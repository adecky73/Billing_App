name: Build Android APK

# Runs on demand (Actions tab -> "Build Android APK" -> "Run workflow")
# and automatically whenever you push a tag like v1.5.0.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # Change these two if you like. APP_ID must stay a valid Java package name:
  # lowercase letters, digits and dots, each part starting with a letter.
  # Changing APP_ID later makes Android treat it as a different app.
  APP_ID: app.billingtool
  APP_NAME: Billing Tool
  # Optional release signing. Leave the secrets unset to get a debug APK.
  KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      # ------------------------------------------------------------------
      # Collect the web app. Everything that is part of the site goes into
      # www/; repository scaffolding does not.
      # ------------------------------------------------------------------
      - name: Collect web assets into www/
        run: |
          set -euo pipefail
          mkdir -p www
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='www' \
            --exclude='android' \
            --exclude='node_modules' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='capacitor.config.json' \
            --exclude='*.md' \
            --exclude='start-server.cmd' \
            --exclude='*.zip' \
            --exclude='*.apk' \
            --exclude='out' \
            --exclude='.nojekyll' \
            ./ www/
          echo "--- www/ contains: ---"
          ls -la www
          test -f www/index.html || { echo "::error::index.html not found at the repository root"; exit 1; }

      # ------------------------------------------------------------------
      # Capacitor wraps www/ into a native Android project. The files are
      # bundled into the APK, so the finished app needs no web server and
      # no network at all.
      # ------------------------------------------------------------------
      - name: Create the Capacitor project
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          # filesystem + share let the app hand a real file to Android's share sheet;
          # without them an <a download> is silently ignored inside the WebView
          npm install --no-audit --no-fund \
            @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 \
            @capacitor/filesystem@^7 @capacitor/share@^7 @capacitor/status-bar@^7
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          npx cap sync android
          # the exec bit can be lost when the template is copied out of node_modules
          chmod +x android/gradlew
          echo "--- versions ---"
          node -v; java -version 2>&1 | head -1; npx cap --version

      # ------------------------------------------------------------------
      # Stamp the app's own version onto the package, so Android's app info
      # screen and the APK filename tell you which build you are holding.
      # versionCode must be an integer that only ever grows: 1.7.1 -> 10701.
      # ------------------------------------------------------------------
      - name: Take the version from the app
        id: ver
        run: |
          set -euo pipefail
          VER="$(grep -o "APP_VERSION *= *'[0-9.]*'" www/index.html | head -1 | grep -o "[0-9][0-9.]*" || true)"
          if [ -z "$VER" ]; then
            echo "::warning::No APP_VERSION found in index.html — falling back to 0.0.0"
            VER=0.0.0
          fi
          MA=${VER%%.*}; REST=${VER#*.}; MI=${REST%%.*}; PA=${REST#*.}; PA=${PA%%.*}
          CODE=$((MA*10000 + MI*100 + PA))
          echo "version=$VER"      >> "$GITHUB_OUTPUT"
          echo "code=$CODE"        >> "$GITHUB_OUTPUT"
          sed -i "s/versionCode .*/versionCode $CODE/; s/versionName .*/versionName \"$VER\"/" \
            android/app/build.gradle
          echo "stamped versionName=$VER versionCode=$CODE"
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Use the app icon for the launcher
        run: |
          set -euo pipefail
          if [ -f www/icon-512.png ]; then
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              dir="android/app/src/main/res/mipmap-${d%%:*}"
              size="${d##*:}"
              mkdir -p "$dir"
              cp www/icon-512.png "$dir/ic_launcher.png"
              cp www/icon-512.png "$dir/ic_launcher_round.png"
              if [ -f www/icon-maskable-512.png ]; then
                cp www/icon-maskable-512.png "$dir/ic_launcher_foreground.png"
              fi
              echo "icon placed in $dir (nominal ${size}px)"
            done
            # remove adaptive-icon XMLs so the PNGs above are used directly
            rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
                  android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          else
            echo "no icon-512.png found - keeping the Capacitor default icon"
          fi

      # ------------------------------------------------------------------
      # Build. With signing secrets present we produce a signed release APK;
      # without them a debug APK, which is installable but is re-signed with
      # a fresh throwaway key on every run (see README).
      # ------------------------------------------------------------------
      # A clean, empty place for the one file this run is allowed to publish.
      - name: Prepare the output directory
        run: |
          set -euo pipefail
          rm -rf out && mkdir -p out
          # An APK committed to the repository is not an error, but it used to
          # end up in the download next to the fresh one. Say so, once.
          STRAY="$(find . -path ./out -prune -o -path ./android/app/build -prune -o \
                        -name '*.apk' -print 2>/dev/null | head -5)"
          if [ -n "$STRAY" ]; then
            echo "::warning::APK files are checked into this repository; they are no longer included in the download. Consider deleting them: $STRAY"
          fi

      - name: Build release APK (signed)
        if: env.KEYSTORE_B64 != ''
        run: |
          set -euo pipefail
          # Strip line breaks and a UTF-8 BOM: Windows PowerShell writes both,
          # and either one makes a naive `base64 -d` fail.
          printf '%s' "$KEYSTORE_B64" \
            | tr -d '[:space:]' \
            | sed 's/^\xef\xbb\xbf//' \
            | base64 -d > /tmp/release.jks
          if [ ! -s /tmp/release.jks ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 could not be decoded. The secret must contain the base64 TEXT of the .jks file, not the command that produces it."
            exit 1
          fi
          # fail early and clearly if the password or alias is wrong
          keytool -list -keystore /tmp/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null || {
            echo "::error::The keystore decoded, but the alias '$KEY_ALIAS' or the store password does not match. Check ANDROID_KEY_ALIAS and ANDROID_KEYSTORE_PASSWORD."
            exit 1
          }
          echo "keystore OK ($(stat -c%s /tmp/release.jks) bytes, alias '$KEY_ALIAS')"
          cd android
          ./gradlew --no-daemon assembleRelease
          cd ..
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "using build-tools: $BT"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED" || UNSIGNED="android/app/build/outputs/apk/release/app-release.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" /tmp/aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/release.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "out/billing-tool-${{ steps.ver.outputs.version }}.apk" /tmp/aligned.apk
          "$BT/apksigner" verify --print-certs "out/billing-tool-${{ steps.ver.outputs.version }}.apk"
          rm -f /tmp/release.jks

      - name: Build debug APK (unsigned release not configured)
        if: env.KEYSTORE_B64 == ''
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/billing-tool-${{ steps.ver.outputs.version }}-debug.apk"
          echo "::warning::Built a DEBUG APK. It installs fine, but each build is signed with a new key - you must uninstall the previous version before installing a newer one. See ANDROID-APP.md to set up proper signing."

      - name: Show what was built
        run: |
          set -euo pipefail
          ls -lh out/
          COUNT="$(ls out/*.apk | wc -l)"
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one APK in out/, found $COUNT."
            exit 1
          fi
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2" \
            dump badging out/*.apk | head -5 || true

      # Uploading a glob over the workspace also picked up any APK that had been
      # committed to the repository, so a download could contain an old build
      # next to the new one. out/ is created empty by this job and holds exactly
      # the file this run produced.
      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: billing-tool-${{ steps.ver.outputs.version }}
          path: out/*.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 90
