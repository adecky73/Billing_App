  if(brief) toastTimer = setTimeout(hideToast, 3000);
}
function hideToast(){ $('toast').classList.remove('show'); }
function personName(id){
  for(var i=0;i<state.people.length;i++) if(state.people[i].id===id) return state.people[i].name;
  return '';
}


/* ==================== where the money goes ====================
   Two addresses per person, kept beside the sheet rather than inside it (see
   normalize): a PayPal name and an IBAN. Anybody may enter them — somebody
   without the app has to be payable too — except where another device stands
   behind that person as "me"; then the address is theirs alone, exactly as
   their name is. Before any money moves the payer sees the address, and PayPal
   or the bank shows the account holder again. */
function payOf(pid){
  var r = (state.pay && state.pay[pid]) || {};
  return { pp: r.pp || '', iban: r.iban || '' };
}
function setPay(pid, kind, value){
  if(!state.pay) state.pay = {};
  var r = state.pay[pid] || { pp:'', iban:'', m:0 };
  r[kind] = value;
  r.m = Date.now();
  state.pay[pid] = r;
  /* deliberately not stampChanges(): an address is not an edit to the sheet,
     and must never cancel somebody's confirmation */
  if(!memoryOnly){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
  syncSoon();
}
/* An IBAN is checked before it is stored: it is the one field in the app where
   a typo sends real money somewhere else. Move the first four characters to the
   end, turn letters into numbers, and the whole thing must divide by 97. */
function cleanIban(v){ return String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function ibanOk(v){
  var iv = cleanIban(v);
  if(!/^[A-Z]{2}[0-9]{2}[A-Z0-9]{10,30}$/.test(iv)) return false;
  var re = iv.slice(4) + iv.slice(0, 4), num = '', i, c;
  for(i=0;i<re.length;i++){
    c = re.charCodeAt(i);
    num += (c >= 65 && c <= 90) ? String(c - 55) : re.charAt(i);
  }
  /* 97 in chunks, because the number is far past what a double can hold */
  var rest = 0;
  for(i=0;i<num.length;i++) rest = (rest * 10 + (num.charCodeAt(i) - 48)) % 97;
  return rest === 1;
}
function ibanPretty(v){ return cleanIban(v).replace(/(.{4})/g, '$1 ').trim(); }
/* "paypal.me/anna", "https://www.paypal.me/anna/12EUR" and "anna" all mean anna */
function cleanPp(v){
  var pv = String(v || '').trim();
  if(isPpMail(pv)) return pv;            /* an e-mail is kept exactly as given */
  pv = pv.replace(/^https?:\/\//i, '').replace(/^www\./i, '');
  pv = pv.replace(/^paypal\.me\//i, '');
  pv = pv.split('/')[0].split('?')[0];
  return pv.replace(/^@/, '').trim();
}
/* PayPal.Me names are letters and digits only — PayPal says so itself, and an
   e-mail cannot be put in such a link at all. But plenty of accounts have no
   PayPal.Me name and run on their e-mail, and those people have to be payable
   too: the address is kept, and the button shows the details to copy instead
   of pretending it can fill a form it has no address for. */
function isPpMail(v){ return String(v || '').indexOf('@') > 0; }
function ppOk(v){
  var raw = String(v || '').trim();
  if(isPpMail(raw)) return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(raw);
  return /^[A-Za-z0-9]{3,20}$/.test(cleanPp(raw));
}

/* PayPal wants a currency CODE; the sheet only knows a symbol. Where the two
   cannot be matched up there is no PayPal button — a guess here would send the
   right number in the wrong currency. */
var CUR_CODE = { '\u20ac':'EUR', '$':'USD', '\u00a3':'GBP', '\u00a5':'JPY',
                 'CHF':'CHF', 'SEK':'SEK', 'NOK':'NOK', 'DKK':'DKK',
                 'PLN':'PLN', 'CZK':'CZK' };
function currencyCode(){
  var c = String(state.currency || '').trim();
  if(/^[A-Z]{3}$/.test(c)) return c;
  return CUR_CODE[c] || '';
}
function ppLink(handle, cents){
  var code = currencyCode();
  return 'https://paypal.me/' + encodeURIComponent(cleanPp(handle)) + '/' +
         (cents / 100).toFixed(2) + (code || '');
}
/* Out of our window and into PayPal's own. A login inside this app's WebView
   would be indistinguishable from the trick it looks like, so the address is
   handed to the system and never loaded here.
   A plain link, not window.open: an anchor with rel=noopener is not treated as
   a pop-up by any browser, and the Android shell hands an external address to
   the system browser or to the app that claims it. window.open('…','noopener')
   always returns null, which made every successful jump look like a failure. */
function openExternal(url){
  var a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/* the dialog behind the two buttons on a person's row */
function payDialog(p, kind){
  if(claimedByOther(p.id)){ toast(t('pay.locked', p.name)); return; }
  var isPp = kind === 'pp';
  var cur = payOf(p.id)[kind];
  dlgOpen(t(isPp ? 'pay.pp.head' : 'pay.bank.head', p.name), function(body){
    var inp = field(body, t(isPp ? 'pay.pp.lbl' : 'pay.bank.lbl'), {
      value: isPp ? cur : ibanPretty(cur), mono: !isPp });
    inp.id = 'payField';
    note(body, t(isPp ? 'pay.pp.hint' : 'pay.bank.hint'));
  }, [
    { label: t('pay.save'), act: 'go', primary: true, onClick: function(){
        var v = $('payField').value.trim();
        if(!v){ setPay(p.id, kind, ''); dlgClose(); renderPeople(); renderResults();
                toast(t('pay.removed', p.name), true); return; }
        if(isPp && !ppOk(v)){ toast(t('pay.bad.pp')); return; }
        if(!isPp && !ibanOk(v)){ toast(t('pay.bad.iban')); return; }
        setPay(p.id, kind, isPp ? cleanPp(v) : cleanIban(v));
        dlgClose(); renderPeople(); renderResults();
        toast(t('pay.saved', p.name), true);
      } },
    { label: t('pay.clear'), act: 'clear', onClick: function(){
        setPay(p.id, kind, ''); dlgClose(); renderPeople(); renderResults();
        toast(t('pay.removed', p.name), true);
      } },
    { label: t('btn.cancel'), act: 'cancel', onClick: dlgClose },
  ]);
}
/* the two buttons themselves: a filled one steps back and wears a tick */
function payButton(p, kind){
  var isPp = kind === 'pp';
  var val = payOf(p.id)[kind];
  var b = el('button', 'paybtn ' + kind + (val ? ' filled' : ''));
  b.type = 'button';
  b.appendChild(el('span','paylbl', t(isPp ? 'pay.pp' : 'pay.bank')));
  if(val) b.appendChild(tickSVG());
  b.title = val ? t(isPp ? 'pay.pp.set' : 'pay.bank.set', p.name,
                    isPp ? val : ibanPretty(val))
                : t(isPp ? 'pay.pp.none' : 'pay.bank.none', p.name);
  b.setAttribute('aria-label', b.title);
  b.addEventListener('click', function(){ payDialog(p, kind); });
  return b;
}
function tickSVG(){
  var s = svgNode('0 0 24 24','paytick');
  svgPath(s, 'M5 13l4.5 4.5L19 7', '3');
  return s;
}

/* ---------- a transfer that has been handed over ----------
   Nothing tells the app whether money actually moved: no bank and no PayPal
   reports back. What it can record is that the details were handed over, and
   by whom — enough to stop the same transfer being paid twice by accident,
   and honest about being no more than that. */
function sentKey(fromId, toId){ return fromId + '>' + toId; }
function sentVia(fromId, toId){
  var r = state.sent && state.sent[sentKey(fromId, toId)];
  return (r && r.via) || '';
}
function markSent(fromId, toId, via){
  if(!state.sent) state.sent = {};
  state.sent[sentKey(fromId, toId)] = { via: via || '', m: Date.now(), d: deviceId };
  /* like an address: a note about the settlement, never an edit to it */
  if(!memoryOnly){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
  syncSoon();
}
function copyOut(text, okMsg){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){ toast(okMsg, true); },
      function(){ prompt(t('copy.prompt'), text); });
  }else{ prompt(t('copy.prompt'), text); }
}
/* Everything a banking app asks for, in one place, ready to copy. No QR code
   and no link: a bank transfer is started in the bank's own app, and this is
   the part we can honestly do for it. */
function bankDialog(x){
  var to = payOf(x.toId), name = personName(x.toId);
  var ref = (state.title || '').trim();
  dlgOpen(t('set.bank.head', name), function(body){
    field(body, t('set.bank.name'), { value: name, ro: true });
    field(body, t('pay.bank.lbl'), { value: ibanPretty(to.iban), ro: true, mono: true });
    field(body, t('set.bank.amount'), { value: money(x.cents), ro: true, mono: true });
    if(ref) field(body, t('set.bank.ref'), { value: ref, ro: true });
  }, [
    { label: t('set.bank.copy'), act: 'go', primary: true, onClick: function(){
        copyOut([name, ibanPretty(to.iban), money(x.cents)].concat(ref ? [ref] : []).join('\n'),
                t('set.bank.copied'));
        markSent(x.fromId, x.toId, 'bank');
        dlgClose(); renderResults();
      } },
    { label: t('btn.cancel'), act: 'cancel', onClick: dlgClose },
  ]);
}
/* What stops this way of paying, if anything: no address on the person, or a
   currency PayPal cannot be told about. */
function payMissing(x, kind){
  var to = payOf(x.toId);
  if(kind === 'pp' && !currencyCode()) return 'cur';
  return to[kind === 'pp' ? 'pp' : 'iban'] ? '' : 'addr';
}
/* An account that has only an e-mail: PayPal has no address that carries the
   amount, so the details are handed over the same way the bank ones are. */
function ppMailDialog(x, mail){
  var name = personName(x.toId), ref = (state.title || '').trim();
  dlgOpen(t('set.pp.head', name), function(body){
    note(body, t('set.pp.note'));
    field(body, t('set.pp.addr'), { value: mail, ro: true, mono: true });
    field(body, t('set.bank.amount'), { value: money(x.cents), ro: true, mono: true });
    if(ref) field(body, t('set.bank.ref'), { value: ref, ro: true });
  }, [
    { label: t('set.bank.copy'), act: 'go', primary: true, onClick: function(){
        copyOut([mail, money(x.cents)].concat(ref ? [ref] : []).join('\n'),
                t('set.pp.copied'));
        markSent(x.fromId, x.toId, 'pp');
        dlgClose(); renderResults();
      } },
    { label: t('set.pp.open'), act: 'open', onClick: function(){
        openExternal('https://www.paypal.com/myaccount/transfer/homepage/pay');
        markSent(x.fromId, x.toId, 'pp');
        dlgClose(); renderResults();
      } },
    { label: t('btn.cancel'), act: 'cancel', onClick: dlgClose },
  ]);
}
function payAction(x, kind){
  var miss = payMissing(x, kind);
  if(miss === 'cur'){ toast(t('set.pay.miss.cur', state.currency)); return; }
  if(miss){
    /* Say what is missing and put the field in front of them — the way to fix
       it is two cards further up, which is not obvious with money in view. */
    var who = null, i;
    for(i=0;i<state.people.length;i++) if(state.people[i].id === x.toId) who = state.people[i];
    if(!who) return;
    if(claimedByOther(who.id)){
      toast(t('set.pay.miss.locked', who.name, t(kind === 'pp' ? 'pay.pp' : 'pay.bank')));
      return;
    }
    toast(t(kind === 'pp' ? 'set.pay.miss.pp' : 'set.pay.miss.bank', who.name), true);
    payDialog(who, kind);
    return;
  }
  var via = sentVia(x.fromId, x.toId);
  if(via){
    /* Pressing a settled transfer again is either a correction or a mistake.
       Ask, and on "yes" only open both ways again — sending is then a second,
       deliberate press. */
    if(!confirm(t('set.pay.again', t(via === 'pp' ? 'set.pay.via.pp' : 'set.pay.via.bank')))) return;
    markSent(x.fromId, x.toId, '');
    renderResults();
    toast(t('set.pay.reopen'), true);
    return;
  }
  if(kind === 'pp'){
    var handle = payOf(x.toId).pp;
    if(isPpMail(handle)){ ppMailDialog(x, handle); return; }
    openExternal(ppLink(handle, x.cents));
    markSent(x.fromId, x.toId, 'pp');
    renderResults();
    toast(t('set.pay.done.pp'), true);
    return;
  }
  bankDialog(x);
}
/* the two names for the same thing: 'iban' is the field on the person, 'bank'
   is the way the money went */
function channelOf(kind){ return kind === 'pp' ? 'pp' : 'bank'; }
function transferPayButton(x, kind, via){
  var isPp = kind === 'pp';
  var chan = channelOf(kind);
  var miss = payMissing(x, kind);
  var b = el('button', 'tpay ' + kind + (miss ? ' miss' : ''));
  b.type = 'button';
  b.appendChild(el('span','paylbl', t(isPp ? 'pay.pp' : 'pay.bank')));
  if(!miss && via === chan){ b.classList.add('done'); b.appendChild(tickSVG()); }
  else if(!miss && via){ b.classList.add('void'); }
  b.title = miss === 'cur' ? t('set.pay.miss.cur', state.currency)
          : miss ? t(isPp ? 'set.pay.miss.pp' : 'set.pay.miss.bank', personName(x.toId))
          : via === chan ? t(isPp ? 'set.pay.done.pp' : 'set.pay.done.bank')
          : t(isPp ? 'set.pay.pp' : 'set.pay.bank', personName(x.toId));
  b.setAttribute('aria-label', b.title);
  b.addEventListener('click', function(){ payAction(x, kind); });
  return b;
}

/* ============================ rendering ============================ */
/* what is typed into the add-person field but not committed yet */
var pendingPerson = '';

function renderPeople(){
  var box = $('people');
  /* Everything but the add-person row is rebuilt. That row survives, because a
     redraw can land between the tap that focuses it and the first letter typed
     — a blur elsewhere on the page is enough to trigger one — and a field that
     is replaced under the user swallows both the focus and the text. */
  var keep = addPersonRow();
  var kids = Array.prototype.slice.call(box.children);
  for(var k=0;k<kids.length;k++) if(kids[k] !== keep) box.removeChild(kids[k]);
  var mine = meId();
  state.people.forEach(function(p){
    var chip = el('div','chip');
    if(isMe(p.id)) chip.classList.add('me');
    if(changedMark.p[p.id]) chip.classList.add('changed');

    if(isMe(p.id)){
      /* The claim is itself the control: pressing it hands the name back. The
         real name stays in the tooltip, so it is never actually lost. */
      var meBtn = el('button','mebtn', t('me.nom'));
      meBtn.disabled = inputsLocked();
      meBtn.title = t('me.release', p.name);
      meBtn.setAttribute('aria-label', t('me.release', p.name));
      meBtn.addEventListener('click', function(){ releasePerson(p.id); });
      chip.appendChild(meBtn);
    }else{
      var inp = document.createElement('input');
      inp.value = p.name; inp.size = Math.max(4, p.name.length);
      inp.setAttribute('aria-label', t('people.name.aria'));
      /* The list stays reachable on a confirmed sheet, but only for addresses:
         the names are what the numbers were agreed on. Grey, fixed, and it
         says how to get at them rather than simply not answering. */
      if(inputsLocked()){
        inp.readOnly = true;
        inp.addEventListener('focus', function(){ toast(t('final.locked.name')); });
        inp.addEventListener('click', function(){ toast(t('final.locked.name')); });
      }
      inp.addEventListener('input', function(){
        /* Somebody else's phone shows this name as "me". Renaming it under them
           would rename them, so it waits until they hand the name back. This is
           the one edit the app refuses outright rather than merely asking. */
        if(claimedByOther(p.id)){
          toast(t('me.namelocked', p.name));
          inp.value = p.name; fitNameInput(inp);
          return;
        }
        if(!mayEdit(p, 'own.person')){ inp.value = p.name; fitNameInput(inp); return; }
        var next = inp.value.toUpperCase();
        if(isReservedName(next)){
          toast(t('me.reserved', next));
          inp.value = p.name;                 /* refuse it, keep what was there */
          fitNameInput(inp);
          return;
        }
        p.name = next;
        inp.value = p.name;
        inp.size = Math.max(4, p.name.length);
        fitNameInput(inp);
        updateHeaderNames(); renderResults(); save();
      });
      chip.appendChild(inp);

      /* the pointing finger, over the middle of the name - only while this
         device has claimed nobody, and only on a name nobody else holds */
      if(claimedBy(p.id) && !isMe(p.id)){
        /* somebody else is this person: no finger, but say why if asked */
        chip.title = t('me.takenshort');
      }
      if(!mine && !claimedBy(p.id)){
        var pick = el('button','pickme');
        pick.disabled = inputsLocked();
        pick.title = t('me.pick', p.name);
        pick.setAttribute('aria-label', t('me.pick', p.name));
        pick.addEventListener('click', function(ev){ ev.preventDefault(); claimPerson(p.id); });
        chip.appendChild(pick);
        chip.classList.add('haspick');
      }
    }

    /* where money would go, on the person it would go to */
    var pays = el('span','payset');
    pays.appendChild(payButton(p, 'pp'));
    pays.appendChild(payButton(p, 'iban'));
    chip.appendChild(pays);

    var x = el('button','x','×');
    x.hidden = inputsLocked();
    x.title = t('people.remove', shownName(p.id));
    x.addEventListener('click', function(){
      /* same reason as the name: a person another phone is standing behind is
         not ours to delete either */
      if(claimedByOther(p.id)){ toast(t('me.namelocked', p.name)); return; }
      if(!mayEdit(p, 'own.person')) return;
      var used = state.expenses.some(function(e){ return e.payerId===p.id || (e.shares[p.id]||0)>0; });
      if(used && !confirm(t(isMe(p.id) ? 'confirm.removeme' : 'confirm.removeperson', p.name))) return;
      if(state.claims[p.id]) state.claims[p.id] = { d: null, m: Date.now() };
      /* their address goes with them */
      if(state.pay && state.pay[p.id]){ setPay(p.id, 'pp', ''); setPay(p.id, 'iban', ''); }
      state.people = state.people.filter(function(q){ return q.id!==p.id; });
      state.expenses.forEach(function(e){ if(e.payerId===p.id) e.payerId=null; delete e.shares[p.id]; });
      renderAll(); save();
    });
    chip.appendChild(x);
    box.insertBefore(chip, keep.parentNode === box ? keep : null);
    if(inp) fitNameInput(inp);       /* needs the real font, so after insertion */
  });

  /* Adding a person used to depend on the keyboard's return key alone. On iOS
     that is not dependable: while autocorrect is composing, keydown arrives as
     keyCode 229 with key "Unidentified", so the name was never committed — it
     just sat in the field looking added until the next redraw cleared it. Hence
     a button that cannot be misread, and three ways to trigger the same thing. */
  /* people somebody else removed, kept the same way the expenses are */
  for(var gpid in ghosts.p){
    var gp = ghosts.p[gpid];
    var gchip = el('div','chip gone');
    gchip.appendChild(el('span','gx','\u2715'));
    gchip.appendChild(el('span','gnm', gp.name || ''));
    gchip.title = goneByText('p', gpid);
    box.insertBefore(gchip, keep.parentNode === box ? keep : null);
  }
  if(keep.parentNode !== box) box.appendChild(keep);
  keep.querySelector('input').placeholder = t('people.add');
  /* and it says so before anything is typed, not after */
  keep.classList.toggle('shut', inputsLocked());
  var addIn = keep.querySelector('input');
  if(!addIn._lockHooked){
    addIn._lockHooked = 1;
    addIn.addEventListener('focus', function(){
      if(inputsLocked()){ addIn.blur(); toast(t('final.locked.name')); }
    });
  }
  /* "People — 3 people" said it twice. With names on the list the count IS the
     heading; with none there is nothing to count, so the plain word stands and
     the hint says what to do. */
  var many = state.people.length > 0;
  $('peopleHead').textContent = many ? nPeople(state.people.length) : t('card.people');
  $('peopleHint').textContent = many ? '' : t('people.hint.empty');
  renderPeopleFold();
}

function claimedByOther(personId){
  var who = claimedBy(personId);
  return !!(who && who !== deviceId);
}

/* A name field that is too short for its name scrolls the text, which reads as
   a broken layout. Measure the name in the field's own font and give it that
   much room — the chips are in a flex row and wrap by themselves. */
var nameRuler = null;
function fitNameInput(inp){
  if(!inp || !inp.isConnected) return;
  if(!nameRuler){
    nameRuler = document.createElement('span');
    nameRuler.setAttribute('aria-hidden','true');
    nameRuler.style.cssText =
      'position:absolute;left:-9999px;top:0;white-space:pre;visibility:hidden';
    document.body.appendChild(nameRuler);
  }
  var cs = getComputedStyle(inp);
  nameRuler.style.font = cs.font;
  nameRuler.style.letterSpacing = cs.letterSpacing;
  nameRuler.textContent = inp.value || '';
  var chrome = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) +
               parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
  var want = Math.max(44, nameRuler.offsetWidth + chrome + 4);
  inp.style.width = want + 'px';
  /* On a phone the addresses share the person's line while the name leaves
     room for them, and drop to a line of their own when it does not. Flex
     wraps on the item's minimum, so the name has to ASK for the room it needs
     — with a cap, or one very long name would push them off on its own. */
  inp.style.minWidth = Math.min(want, 190) + 'px';
}

/* Built once, kept for the life of the page. */
var addRowNode = null;
function addPersonRow(){
  if(addRowNode) return addRowNode;
  var addWrap = el('div','addperson');
  var add = document.createElement('input');
  add.id = 'newPerson'; add.placeholder = t('people.add'); add.setAttribute('aria-label', t('people.add.aria'));
  add.autocapitalize = 'characters';
  add.setAttribute('enterkeyhint', 'done');

  function commitPerson(){
    /* A confirmed sheet is confirmed on the people it names. Adding one is an
       edit like any other and has to wait until the confirmation is undone —
       the addresses are the only thing the list still takes. */
    if(inputsLocked()){ toast(t('final.locked.name')); add.value = ''; return; }
    var nm = add.value.trim().toUpperCase();
    if(!nm){ add.focus(); return; }
    if(isReservedName(nm)){ toast(t('me.reserved', nm)); add.select(); return; }
    if(state.people.some(function(p){return p.name===nm;})){
      toast(t('people.exists', nm)); add.select(); return;
    }
    state.people.push({id:uid(), name:nm, m:Date.now(), o:deviceId});
    add.value = '';
    pendingPerson = '';
    renderAll(); save();
    add.focus();
  }
  add.addEventListener('keydown', function(ev){
    if(ev.key === 'Enter' || ev.keyCode === 13){ ev.preventDefault(); commitPerson(); }
  });
  /* iOS fires this for the return key even when keydown reported nothing useful */
  add.addEventListener('beforeinput', function(ev){
    if(ev.inputType === 'insertLineBreak'){ ev.preventDefault(); commitPerson(); }
  });
  /* belt and braces: the row is kept now, but a value typed into a copy that
     was already detached still has somewhere to land */
  add.value = pendingPerson || '';
  add.addEventListener('input', function(){ pendingPerson = add.value; });

  /* a plus, not a word: the control has to stay narrow enough to sit among
     the name chips */
  var addBtn = el('button','btn sm addbtn', '+');
  addBtn.title = t('people.addbtn');
  addBtn.setAttribute('aria-label', t('people.addbtn'));
  addBtn.addEventListener('click', commitPerson);

  addWrap.appendChild(add);
  addWrap.appendChild(addBtn);
  addRowNode = addWrap;
  return addWrap;
}

function updateHeaderNames(){
  var ths = $('thead').querySelectorAll('th.share .pname');
  for(var i=0;i<ths.length && i<state.people.length;i++){
    var pi = state.people[i];
    ths[i].textContent = shownName(pi.id);
    ths[i].classList.toggle('isme', isMe(pi.id));
  }
  var sels = $('tbody').querySelectorAll('td.payer select');
  for(var j=0;j<sels.length;j++){
    var opts = sels[j].options;
    for(var k=0;k<opts.length;k++){
      if(opts[k].value) opts[k].textContent = shownName(opts[k].value);
    }
  }
  var rows = $('tbody').children;
  for(var r=0;r<rows.length;r++){
    var labels = rows[r].querySelectorAll('td.share .mlabel');
    for(var m=0;m<labels.length && m<state.people.length;m++){
      var pm = state.people[m];
      labels[m].textContent = shownName(pm.id);
      labels[m].classList.toggle('isme', isMe(pm.id));
    }
  }
}

/* On a phone every expense is a card, and twenty cards are a long scroll with
   nothing to scan. So a phone shows one line per expense — what it was, who
   paid, how much — and opens exactly one of them into the full card. The table
   itself is unchanged: the same rows, the same cells, the same DOM. Only the
   phone stylesheet decides which cells are on screen, which keeps printing,
   CSV and the desktop layout exactly as they were.
   The open one is remembered by id, so a redraw (or an exchange with the other
   phones) does not close what somebody is filling in. */
var openExpense = null;
var expandAll = false;
/* Card mode: the list gives way to one expense at a time, with its neighbours
   showing at the edges so it is obvious there is more. It is a way of READING
   the sheet — every card in turn, whole, before saying it is settled — not a
   replacement for the list, which is still the way to find one particular
   expense. A phone thing only. */
var cardMode = false;
var cardAt = 0;

function cardSlides(){
  return $('tbody').querySelectorAll('tr[data-eid], tr.gone');
}
/* how many cards the rail would hold: the expenses plus the ones somebody
   removed, which are still there to be read */
function railCards(){
  return state.expenses.length + Object.keys(ghosts.e).length;
}
/* Which expense the rail was last standing on. The list no longer keeps a card
   open on the way out, so without this the rail would forget where it was —
   and both facts outlive the session: an app closed while swiping opens on the
   same card. */
var CARD_MODE_KEY = 'billing-tool.cardmode';
var CARD_SEEN_KEY = 'billing-tool.cardseen';
var cardSeen = null;
var cardViewSaved = '';
function saveCardView(){
  var line = (cardMode ? '1' : '0') + '|' + (cardSeen || '');
  if(line === cardViewSaved) return;      /* renders are frequent, writes are not */
  cardViewSaved = line;
  lsSet(CARD_MODE_KEY, cardMode ? '1' : '0');
  lsSet(CARD_SEEN_KEY, cardSeen || '');
}
function noteCardSeen(){
  var ex = state.expenses[cardAt];
  cardSeen = ex ? ex.id : null;
  saveCardView();
}
/* At startup: pick the rail up where it was left. Only with a rail to pick up
   — one expense hides the switch, and a card with no way back out of it is a
   trap. */
function restoreCardView(){
  cardSeen = lsGet(CARD_SEEN_KEY) || null;
  if(lsGet(CARD_MODE_KEY) !== '1') return;
  if(!state || state.expenses.length < 2 || inputsLocked()) return;
  cardMode = true;
  var k = 0;
  state.expenses.forEach(function(e, i){ if(e.id === cardSeen) k = i; });
  cardAt = k;
}
function setCardMode(on){
  closeExactRows();
  cardMode = !!on;
  saveCardView();
  if(cardMode){
    /* start where the eye already is: the card that is open, else the one the
       rail was last on, else the newest */
    var want = openExpense || cardSeen;
    var k = 0;
    state.expenses.forEach(function(e, i){ if(e.id === want) k = i; });
    cardAt = k;
  }else{
    noteCardSeen();
    /* and leave the plain list of one-liners — the view the app starts with.
       Coming back with one card standing open reads as a leftover of the rail
       rather than as a list. */
    openExpense = null;
    expandAll = false;
  }
  renderTable(); renderResults();
}
function goCard(step){
  /* whatever was unfolded on the card being left is folded away with it */
  closeExactRows();
  var n = cardSlides().length;
  var next = Math.max(0, Math.min(n - 1, cardAt + step));
  if(next === cardAt) return;
  /* a keyboard that is open while the cards move covers half of what moves */
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  cardAt = next;
  paintCards();
}
/* only the position changes when a card is turned — the cards themselves are
   already built, and rebuilding them under a finger costs a frame and a focus */
/* Turning a card is a drag that is clearly sideways and clearly not the start
   of typing. The threshold is what keeps an ordinary scroll of the page from
   dealing a card; the check on the target is what keeps a text selection from
   turning into one. */
function swipeArea(node){
  var x0 = null, y0 = null, live = false;
  node.addEventListener('pointerdown', function(ev){
    if(!cardMode) return;
    /* Fields and buttons keep their own gestures — except the two arrows at
       the foot of the card: the whole strip has to be draggable, or a thumb
       that lands on an arrow and then wipes does nothing at all. A tap on
       them still reaches the click handler, because the pointer is only
       captured once the drag passes its threshold. */
    if(ev.target.closest && ev.target.closest('input,select,textarea,button:not(.cardnav)')) return;
    x0 = ev.clientX; y0 = ev.clientY; live = false;
  });
  node.addEventListener('pointermove', function(ev){
    if(x0 == null) return;
    var dx = ev.clientX - x0, dy = ev.clientY - y0;
    if(!live && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)){
      live = true;
      /* Only now: without the capture the drag is lost the moment the finger
         leaves the card, and a swipe naturally ends outside it. Capturing on
         the first touch instead would swallow the taps on the chevrons, since
         a captured pointer sends its click to the capturing element. */
      try{ node.setPointerCapture(ev.pointerId); }catch(e){}
    }
    if(live && ev.cancelable) ev.preventDefault();
  });
  node.addEventListener('pointerup', function(ev){
    if(x0 == null) return;
    var dx = ev.clientX - x0, was = live;
    x0 = null; live = false;
    try{ node.releasePointerCapture(ev.pointerId); }catch(e){}
    if(was && Math.abs(dx) > 45) goCard(dx < 0 ? 1 : -1);
  });
  node.addEventListener('pointercancel', function(){ x0 = null; live = false; });
}

/* Which cards carry a mark, by the number they show — and where in the rail
   each of those numbers sits. The list runs newest first, so the number is
   counted from the bottom, exactly as the list itself numbers them. */
function markedCards(){
  var out = [], n = state.expenses.length;
  state.expenses.forEach(function(ex, ri){
    if(changedMark.e[ex.id]) out.push({ no: n - ri, at: ri });
  });
  out.sort(function(a, b){ return a.no - b.no; });
  return out;
}
/* "Changes in 1, 4, 5 · 2 removed" — the numbers are buttons. */
function fillCardChanges(box){
  box.textContent = '';
  var marks = markedCards();
  var gone = 0, g;
  for(g in ghosts.e) gone++;
  if(!marks.length && !gone) return;
  if(marks.length){
    /* the numbers are buttons, so the sentence is built around the placeholder
       rather than substituted into it — and the placeholder is not always at
       the end of the sentence in every language */
    var parts = t(marks.length === 1 ? 'card.changed.one' : 'card.changed').split('{0}');
    if(parts[0]) box.appendChild(document.createTextNode(parts[0]));
    marks.forEach(function(m, i){
      if(i) box.appendChild(document.createTextNode(','));
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chgjump';
      b.textContent = String(m.no);
      b.title = t('card.goto', m.no);
      b.addEventListener('click', function(){ goCard(m.at - cardAt); });
      box.appendChild(b);
    });
    if(parts[1]) box.appendChild(document.createTextNode(parts[1]));
  }
  if(gone){
    if(marks.length) box.appendChild(document.createTextNode(' · '));
    var gb = document.createElement('button');
    gb.type = 'button';
    gb.className = 'chgjump gone';
    gb.textContent = t('card.changed.gone', gone);
    gb.title = t('card.goto.gone');
    gb.addEventListener('click', function(){
      goCard(state.expenses.length - cardAt);
    });
    box.appendChild(gb);
  }
}

/* The rail is a phone layout. Turn the phone sideways and the wide layout takes
   over — the whole table, as on a desktop. The rail's position has to go with
   it: an inline transform survives a media query and pushed the table clean off
   the screen, and rows left inert could not be typed into. */
var PHONE_MQ = window.matchMedia ? window.matchMedia('(max-width:700px)') : null;
function phoneLayout(){ return PHONE_MQ ? PHONE_MQ.matches : true; }

function paintCards(){
  var body = $('tbody');
  var slides = cardSlides(), q;
  if(!cardMode || !phoneLayout()){
    body.style.removeProperty('--rail');
    body.style.transform = '';
    for(q=0;q<slides.length;q++){
      slides[q].removeAttribute('inert');
      if(!cardMode) slides[q].classList.remove('here');
    }
    return;
  }
  /* the card in focus is centred, so a sliver of the one before shows on the
     left and a sliver of the one after on the right — both tucked under it */
  body.style.setProperty('--rail', 'calc(5% - ' + (cardAt * 84) + '%)');
  for(var i=0;i<slides.length;i++) slides[i].classList.toggle('here', i === cardAt);
  /* the card on screen is the one to come back to, whenever that is */
  noteCardSeen();
  var open = state.expenses.filter(function(e){ return !e.payerId; }).length;
  var txt = (cardAt + 1) + '/' + slides.length +
            (open ? ' \u00b7 ' + t('card.open', open) : '');
  var all = document.querySelectorAll('#tbody .cardpos, #tbody .cardchg');
  for(var k=0;k<all.length;k++) all[k].textContent = '';
  var here = slides[cardAt] ? slides[cardAt].querySelector('.cardpos') : null;
  if(here) here.textContent = txt;
  var chgBox = slides[cardAt] ? slides[cardAt].querySelector('.cardchg') : null;
  if(chgBox) fillCardChanges(chgBox);
  /* the cards to either side are half hidden — a field of theirs must not be
     tappable by accident */
  for(var j=0;j<slides.length;j++){
    if(j === cardAt) slides[j].removeAttribute('inert');
    else slides[j].setAttribute('inert','');
  }
}
/* The balance is what you read once the entering is done. Until then it is a
   third of the screen showing numbers that are still moving, so it starts
   folded — and stays however this device last left it. */
var balOpen = lsGet('billing-tool.balopen') === '1';
/* The people list is the other way round: it is where a sheet starts, so it
   starts open and folds away once the names are in. */
var peopleOpen = lsGet('billing-tool.peopleopen') !== '0';

/* A confirmed device cannot edit, so it cannot tap a line open either — the
   card is inert as a whole. Then folding would hide the very numbers it is
   being asked to check, so a locked sheet simply shows everything. */
function isFolded(id){
  if(cardMode) return false;          /* every card is whole in card mode */
  return !(expandAll || inputsLocked()) && openExpense !== id;
}
/* the one open card, and only while it is the only one */
function hoists(id){
  return !cardMode && openExpense === id && !expandAll && !inputsLocked();
}

/* Everything open at once, for reading the whole list through — and back to
   the plain list of lines the app starts with, nothing open. */
function setExpandAll(on){
  closeExactRows();
  expandAll = !!on;
  if(!expandAll) openExpense = null;
  renderTable(); renderResults();
}

function foldExpense(id){
  if(openExpense === id) return;
  closeExactRows();
  openExpense = id;
  renderTable(); renderResults();
  /* the card has just moved to the top of the list — follow it there */
  var row = $('tbody').querySelector('tr[data-eid="' + id + '"]');
  if(row && row.scrollIntoView) row.scrollIntoView({block:'nearest'});
}

/* the closed line: enough to find the expense again, nothing more */
function sumCell(ex, pe){
  var td = el('td','sum');
  var btn = el('button','sumline');
  btn.title = t('row.sum.open');
  var bad = !ex.payerId || (pe && (pe.unassigned || pe.overfixed || pe.shortfixed));
  if(bad) btn.appendChild(el('span','flag'));
  var d = (ex.desc || '').trim();
  btn.appendChild(el('span', d ? 'sdesc' : 'sdesc none', d || t('row.sum.nodesc')));
  btn.appendChild(el('span','swho', ex.payerId ? shownName(ex.payerId) : t('row.sum.nopayer')));
  btn.appendChild(el('span','samt', ex.cents ? money(ex.cents) : money(0)));
  var ch = el('span','schev'); ch.appendChild(chevronSVG('down'));
  btn.appendChild(ch);
  btn.addEventListener('click', function(){ foldExpense(ex.id); });
  td.appendChild(btn);
  return td;
}

function renderTable(){
  /* A confirmed sheet is for reading, and the rail shows one card at a time
     behind an inert switch — there would be no way back to the list. Whoever
     closed it, this device or the last of the others, the list comes back. */
  if(cardMode && inputsLocked()){ noteCardSeen(); cardMode = false; openExpense = null; }
  /* the switch out of the rail is hidden below two cards, so a rail with fewer
     than two is a room with no door. A removed expense is still a card. */
  if(cardMode && railCards() < 2){ cardMode = false; openExpense = null; }
  /* the instruction about tapping share cells only means something while a
     card is open — over a list of one-liners it is noise */
  document.body.classList.toggle('card-mode', cardMode);
  document.body.classList.toggle('card-open',
    expandAll || inputsLocked() || (openExpense != null &&
      state.expenses.some(function(e){ return e.id === openExpense; })));
  var fa = $('foldAll');
  if(fa){
    setChevronLabel(fa, expandAll ? 'up' : 'down', t('row.all'));
    fa.hidden = state.expenses.length < 2 || cardMode;
  }
  var cb = $('cardBtn');
  if(cb){
    cb.textContent = '';
    cb.appendChild(cardMode ? listIconSVG() : swipeIconSVG());
    cb.title = t(cardMode ? 'card.tolist' : 'card.tocards');
    cb.setAttribute('aria-label', cb.title);
    cb.hidden = railCards() < 2;
  }
  var head = $('thead'); head.innerHTML = '';
  head.appendChild(el('th', null, t('th.payer')));
  head.appendChild(el('th', null, t('th.desc')));
  var thA = el('th','num',t('th.amount')); head.appendChild(thA);
  state.people.forEach(function(p, i){
    var th = el('th','share');
    var span = el('span', isMe(p.id) ? 'pname isme' : 'pname', shownName(p.id));
    th.appendChild(span);
    th.title = t('th.share.title', shownName(p.id));
    th.addEventListener('click', function(){
      var allIn = state.expenses.every(function(e){ return (e.shares[p.id]||0) > 0; });
      state.expenses.forEach(function(e){ if(allIn) delete e.shares[p.id]; else if(!e.shares[p.id]) e.shares[p.id]=1; });
      renderTable(); renderResults(); save();
    });
    head.appendChild(th);
  });
  /* a removed person keeps a column, struck through, until the marks are
     answered — otherwise their shares vanish without a trace */
  for(var gph in ghosts.p){
    var gth = el('th','share gone');
    gth.appendChild(el('span','pname', ghosts.p[gph].name || ''));
    gth.title = goneByText('p', gph);
    head.appendChild(gth);
  }
  head.appendChild(el('th','num',t('th.pershare')));
  head.appendChild(el('th', null, ''));

  var body = $('tbody'); body.innerHTML = '';
  var res = computeBalances(state.people, state.expenses);
  /* what the rail will hold: every expense, plus every one somebody removed */
  var slideCount = railCards();

  state.expenses.forEach(function(ex, ri){
    var tr = document.createElement('tr');
    tr.dataset.eid = ex.id;
    if(res.perExpense[ri].unassigned) tr.className = 'unassigned';
    /* somebody changed this after this device had said "final" */
    if(changedMark.e[ex.id]) tr.classList.add('changed');
    if(chgWhole('e', ex.id)) tr.classList.add('whole');
    /* The open card is lifted to the top of the list, so it is where the eye
       already is and the list of the others stays whole underneath it. It goes
       back to its own place the moment it is closed. Only the stylesheet moves
       it — the row keeps its place in the table, which is what printing, CSV
       and the desktop layout read. */
    if(isFolded(ex.id)) tr.classList.add('folded');
    else if(hoists(ex.id)) tr.classList.add('hoist');
    /* in card mode the whole card is a swipe surface, except its form fields */
    swipeArea(tr);

    /* The list runs newest first, so the oldest expense sits at the bottom and
       is number 1 — the order things were actually paid in. The number belongs
       to the expense, not to its place on screen, so an opened card carries it
       up with it. */
    var no = el('td','no', String(state.expenses.length - ri));
    no.setAttribute('aria-hidden','true');
    tr.appendChild(no);

    // the closed line — hidden by the stylesheet on anything wider than a phone
    tr.appendChild(sumCell(ex, res.perExpense[ri]));

    // payer
    var tdP = el('td','payer');
    var sel = document.createElement('select');
    var o0 = document.createElement('option'); o0.value=''; o0.textContent=t('row.payer.empty'); sel.appendChild(o0);
    state.people.forEach(function(p){
      var o = document.createElement('option'); o.value=p.id; o.textContent=shownName(p.id); sel.appendChild(o);
    });
    sel.value = ex.payerId || '';
    if(!ex.payerId) sel.className = 'empty';
    sel.addEventListener('change', function(){
      if(!mayEdit(ex, 'own.expense')){ sel.value = ex.payerId || ''; return; }
      ex.payerId = sel.value || null;
      sel.className = ex.payerId ? '' : 'empty';
      renderResults(); save();
    });
    if(chg('e', ex.id, 'payer')) tdP.classList.add('chg');
    tdP.appendChild(sel); tr.appendChild(tdP);

    // description
    var tdD = el('td','desc');
    var inD = document.createElement('input');
    inD.value = ex.desc; inD.placeholder = t('row.desc.ph'); inD.setAttribute('aria-label', t('row.desc.aria'));
    inD.addEventListener('input', function(){
      if(!mayEdit(ex, 'own.expense')){ inD.value = ex.desc; return; }
      ex.desc = inD.value; save();
    });
    if(chg('e', ex.id, 'desc')) tdD.classList.add('chg');
    tdD.appendChild(inD); tr.appendChild(tdD);

    // amount
    var tdA = el('td','amt');
    var inA = document.createElement('input');
    inA.inputMode = 'decimal'; inA.setAttribute('aria-label', t('row.amount.aria'));
    inA.value = ex.cents ? formatCents(ex.cents) : '';
    inA.placeholder = '0.00';
    inA.addEventListener('input', function(){
      if(!mayEdit(ex, 'own.expense')){ inA.value = ex.cents ? formatCents(ex.cents) : ''; return; }
      ex.cents = parseAmount(inA.value);
      /* an exact-amount strip open below this row shows a note about the
         expense — without this it kept the old warning until it was reopened */
      updatePerShare(); renderResults(); refreshOpenExact(); save();
    });
    inA.addEventListener('blur', function(){ inA.value = ex.cents ? formatCents(ex.cents) : ''; });
    inA.addEventListener('focus', function(){ inA.select(); });
    if(chg('e', ex.id, 'amt')) tdA.classList.add('chg');
    /* On a phone the field stands alone with no column heading over it, so it
       says what it is: the currency sits inside it, after the figure. On a
       desktop the column is already labelled and the box is display:contents,
       which leaves the cell exactly as it was. */
    var amtBox = el('span','amtbox');
    amtBox.appendChild(inA);
    amtBox.appendChild(el('span','cur', state.currency));
    tdA.appendChild(amtBox); tr.appendChild(tdA);

    // shares
    state.people.forEach(function(p){
      var td = el('td','share');
      if(chg('e', ex.id, 'share:' + p.id)) td.classList.add('chg');
      td.appendChild(el('span', isMe(p.id) ? 'mlabel isme' : 'mlabel', shownName(p.id)));
      var b = el('button','sharebtn');
      var n = ex.shares[p.id] || 0;
      var pe0 = res.perExpense[ri];
      paintShare(b, n, ex.fixed && ex.fixed[p.id],
                 pe0.hasFixed && pe0.rest === 0 && (ex.cents||0) !== 0);
      b.setAttribute('aria-label', t('row.share.aria', shownName(p.id), ex.desc || t('card.expenses')));
      b.addEventListener('click', function(ev){
        if(b.disabled) return;
        if(!mayEdit(ex, 'own.expense')) return;
        if(ex.fixed && ex.fixed[p.id]){
          delete ex.fixed[p.id];
          if(!Object.keys(ex.fixed).length) delete ex.fixed;
          closeExactRows(); renderTable(); renderResults(); save();
          return;
        }
        var cur = ex.shares[p.id] || 0;
        var next;
        if(ev.shiftKey) next = cur + 1;
        else next = cur === 0 ? 1 : (cur === 1 ? 2 : 0);
        if(next <= 0) delete ex.shares[p.id]; else ex.shares[p.id] = next;
        paintShare(b, next, null);
        /* a tick decides whether there is a rest for the payer to hold at all,
           so an open strip has to be told about it */
        applyAutoRest(ex);
        updatePerShare(); renderResults(); save(); refreshOpenExact();
      });
      td.appendChild(b); tr.appendChild(td);
    });

    /* and the same column in every row: what they were down for, struck
       through and with nothing to press */
    for(var gpid in ghosts.p){
      var gsd = el('td','share gone');
      gsd.appendChild(el('span','mlabel', ghosts.p[gpid].name || ''));
      var gsb = el('button','sharebtn');
      var had = (ghostShares[gpid] || {})[ex.id];
      if(had && had.fx){ gsb.className = 'sharebtn fixed'; gsb.textContent = formatCents(had.fx); }
      else paintShare(gsb, had ? had.n : 0, null, false);
      gsb.disabled = true;
      gsd.appendChild(gsb);
      gsd.title = goneByText('p', gpid);
      tr.appendChild(gsd);
    }

    // per share
    var tdS = el('td','num pershare');
    /* With fixed amounts in the row, this figure is what one share of the
       REMAINDER costs — calling it "per share" invites reading it as a share
       of the whole expense. */
    tdS.appendChild(el('span','mlabel',
      t(res.perExpense[ri].hasFixed ? 'th.pershare.rest' : 'th.pershare') + ' '));
    tdS.appendChild(el('span','v',''));
    /* bottom right of the open card: the place a thumb lands after reading the
       row from the top down */
    var fold = el('button','rowfold');
    fold.appendChild(chevronSVG('up'));
    fold.appendChild(document.createTextNode(t('row.fold')));
    fold.title = t('row.sum.fold');
    fold.addEventListener('click', function(){
      closeExactRows();
      if(expandAll){ setExpandAll(false); return; }
      openExpense = null;
      renderTable(); renderResults();
    });
    tdS.appendChild(fold);
    /* Where you are, at the right-hand end of the line that already carries a
       figure. A bar of its own under the total said the same thing twice. */
    var pos = el('span','cardpos');
    pos.id = 'cardpos-' + ex.id;
    tdS.appendChild(pos);
    /* Under it: where the marks are. A rail shows one card, so a red frame two
       cards away is invisible — the numbers say where to look, and each one is
       a button that goes there. */
    tdS.appendChild(el('span','cardchg'));
    /* The foot of the card is the one strip with nothing to type into, so it is
       the one place a sideways drag can never be mistaken for selecting text.
       The hand sits between two runs of chevrons; a run is only drawn towards
       a card that exists, so the first card fans one way. The two arrows at
       the ends are buttons — for anyone who would rather tap than drag. */
    var hint = swipeStrip(ri, slideCount);
    /* no listener of its own: the row already carries one, and two of them on
       the same drag would turn two cards */
    tdS.appendChild(hint);
    tr.appendChild(tdS);

    // exact amounts + delete
    var tdX = el('td','rowtools');
    /* A bare currency symbol reads as a label, not as something to press —
       the leading "+" is what makes it an action ("add fixed amounts"). */
    var exBtn = el('button','rowex','+' + (state.currency || '\u20ac'));
    exBtn.title = t('row.exact');
    if(res.perExpense[ri].hasFixed) exBtn.classList.add('on');
    exBtn.addEventListener('click', function(){
      if(!mayEdit(ex, 'own.expense')) return;
      var open = tr.nextSibling && tr.nextSibling.classList &&
                 tr.nextSibling.classList.contains('exactrow');
      closeExactRows();
      if(!open) openExactRow(tr, ex);
    });
    var fixedMoved = false;
    state.people.forEach(function(p){ if(chg('e', ex.id, 'fixed:' + p.id)) fixedMoved = true; });
    if(fixedMoved) exBtn.classList.add('chg');
    tdX.appendChild(exBtn);
    var del = el('button','rowdel','×');
    del.title = t('row.delete');
    del.addEventListener('click', function(){
      if(!mayEdit(ex, 'own.expense')) return;
      state.expenses = state.expenses.filter(function(e){ return e.id !== ex.id; });
      renderTable(); renderResults(); save();
    });
    tdX.appendChild(del); tr.appendChild(tdX);

    body.appendChild(tr);
  });

  /* what somebody else removed, kept visible until this device has answered */
  var gAt = state.expenses.length;
  for(var gid in ghosts.e){
    var g = ghosts.e[gid];
    var gtr = document.createElement('tr');
    gtr.className = 'gone';
    gtr.dataset.gone = gid;
    /* an empty number cell, so the line starts where every other line starts */
    var gno = el('td','no','');
    gno.setAttribute('aria-hidden','true');
    gtr.appendChild(gno);
    var gtd = document.createElement('td');
    gtd.className = 'gonecell';
    gtd.colSpan = state.people.length + Object.keys(ghosts.p).length + 5;
    var gl = el('div','goneline');
    gl.appendChild(el('span','gx','\u2715'));
    gl.appendChild(el('span','sdesc', (g.desc || '').trim() || t('row.sum.nodesc')));
    gl.appendChild(el('span','swho', g.payerId ? (personName(g.payerId) || t('row.sum.nopayer'))
                                               : t('row.sum.nopayer')));
    gl.appendChild(el('span','samt', money(Number(g.cents) || 0)));
    gtd.appendChild(gl);
    gtd.appendChild(el('div','gonenote', goneByText('e', gid)));
    /* in the rail this is a card like any other, and it carries the counter */
    var gfoot = el('div','gonefoot');
    gfoot.appendChild(el('span','cardpos'));
    gfoot.appendChild(el('span','cardchg'));
    gtd.appendChild(gfoot);
    /* it is a card in the rail like any other, so it needs the way out of it */
    gtd.appendChild(swipeStrip(gAt, slideCount));
    gAt++;
    gtr.appendChild(gtd);
    swipeArea(gtr);
    body.appendChild(gtr);
  }

  if(!state.expenses.length){
    var etr = document.createElement('tr');
    etr.className = 'placeholder';
    var etd = el('td','ph', state.people.length ? t('ph.noexpenses') : t('ph.nopeople'));
    etd.colSpan = state.people.length + 5;
    etr.appendChild(etd);
    body.appendChild(etr);
  }

  /* the rail was rebuilt, so its position has to be set again */
  paintCards();

  var foot = $('tfoot'); foot.innerHTML = '';
  if(state.expenses.length){
    var ftr = document.createElement('tr');
    var fc = el('td', null, t('th.total')); fc.colSpan = 2; ftr.appendChild(fc);
    var ft = el('td','num total', ''); ftr.appendChild(ft);
    var fill = el('td');
    fill.colSpan = state.people.length + Object.keys(ghosts.p).length + 2;
    ftr.appendChild(fill);
    foot.appendChild(ftr);
  }

  updatePerShare();
}

/* The exact-amount strip. It lives directly under its expense row, is opened
   from the € button, and is closed again as soon as another one opens — so at
   most one is ever on screen and the normal view stays as plain as before. */
/* Closing a strip in which nobody else was given an amount undoes the payer's
   automatic rest. An expense where only the payer holds a fixed amount is the
   same expense as one with no fixed amounts at all — except that it stops the
   shares from dividing anything. Opening the strip to look at it must not
   quietly turn a three-way expense into the payer's own. */
function endAutoRest(){
  if(!autoRest) return;
  var ex = null, i;
  for(i=0;i<state.expenses.length;i++) if(state.expenses[i].id === autoRest) ex = state.expenses[i];
  autoRest = null;
  if(!ex || !ex.payerId || !ex.fixed) return;
  for(var k in ex.fixed) if(k !== ex.payerId) return;     /* somebody was itemised */
  delete ex.fixed[ex.payerId];
  if(!Object.keys(ex.fixed).length) delete ex.fixed;
  updatePerShare(); save();
}
function closeExactRows(){
  endAutoRest();
  var open = document.querySelectorAll('#tbody tr.exactrow');
  for(var i=0;i<open.length;i++) open[i].remove();
  /* in card mode the strip is a cell of the card itself, not a row after it */
  var cells = document.querySelectorAll('#tbody td.exactcell');
  for(var c=0;c<cells.length;c++) cells[c].remove();
  var on = document.querySelectorAll('#tbody .rowex.active');
  for(var j=0;j<on.length;j++) on[j].classList.remove('active');
  var joined = document.querySelectorAll('#tbody tr.hasexact');
  for(var k=0;k<joined.length;k++) joined[k].classList.remove('hasexact');
}

function openExactRow(afterTr, ex){
  var btn = afterTr.querySelector('.rowex');
  if(btn) btn.classList.add('active');
  afterTr.classList.add('hasexact');
  /* Card mode has no room for a row of its own — a sibling row would become a
     card of its own in the rail. The strip is hung on the bottom of the card
     instead, as one more cell of the same row, and comes off again the moment
     the reader moves on. */
  var tr = afterTr, td;
  if(cardMode){
    td = el('td','exactcell');
  }else{
    tr = document.createElement('tr');
    tr.className = 'exactrow'
      + (afterTr.classList.contains('hoist') ? ' hoist' : '')
      + (afterTr.classList.contains('unassigned') ? ' unassigned' : '');
    td = document.createElement('td');
  }
  td.colSpan = state.people.length + Object.keys(ghosts.p).length + 6;
  var box = el('div','exact');
  box.appendChild(el('div','exact-h', t('exact.head')));

  var grid = el('div','exact-grid');
  var inputs = [];
  state.people.forEach(function(p){
    var cell = el('label','exact-cell');
    if(chg('e', ex.id, 'fixed:' + p.id)) cell.classList.add('chg');
    cell.appendChild(el('span','exact-nm', shownName(p.id)));
    var inp = document.createElement('input');
    inp.inputMode = 'decimal';
    inp.placeholder = t('exact.ph');
    inp.setAttribute('aria-label', shownName(p.id) + ' — ' + t('exact.ph'));
    var cur = ex.fixed && ex.fixed[p.id];
    inp.value = cur ? formatCents(cur) : '';
    inp.addEventListener('input', function(){
      var cents = parseAmount(inp.value);
      if(!ex.fixed) ex.fixed = {};

      /* What is still unclaimed by the OTHER people. Checking against the whole
         expense would let two people each stay under it while together going
         over — the sum is what has to hold. */
      var others = fixedByOthers(ex, p.id);
      var available = (ex.cents || 0) - others;
      /* correcting the payer's own figure ends the guessing, for this expense
         and from now on — including after it is emptied and typed again */
      if(p.id === ex.payerId){ autoRest = null; autoLive = false; autoDone[ex.id] = 1; }
      /* and changing anybody else's arms it for real. Deliberately not
         autoArmed(): while somebody still has a tick there is no rest to give
         away, but the moment the last tick goes the payer has to receive it —
         and by then the change that started it is long past. */
      else if(autoArmedBase(ex)){ autoLive = true; box._proposal = false; }

      /* No expense amount yet: there is nothing to divide up, so a fixed
         amount here could only ever be "more than the whole expense". Refuse
         it the same way an over-large amount is refused instead of letting a
         warning state build up that the user then has to clear by hand. */
      if((ex.cents || 0) <= 0 && cents !== 0){
        delete ex.fixed[p.id];
        if(!Object.keys(ex.fixed).length) delete ex.fixed;
        inp.value = '';
        updatePerShare(); renderResults(); save();
        refreshExactFoot(box, ex, t('exact.noamount'));
        toast(t('exact.noamount'));
        return;
      }

      if((ex.cents || 0) > 0 && cents > available){
        delete ex.fixed[p.id];
        if(!Object.keys(ex.fixed).length) delete ex.fixed;
        inp.value = '';
        applyAutoRest(ex); paintAutoField(box, ex);
        updatePerShare(); renderResults(); save();
        refreshExactFoot(box, ex, t('exact.toomuch', shownName(p.id), money(Math.max(0, available))));
        toast(t('exact.toomuch', shownName(p.id), money(Math.max(0, available))));
        return;
      }

      if(inp.value.trim() === '' || cents === 0) delete ex.fixed[p.id];
      else ex.fixed[p.id] = cents;
      if(ex.fixed && !Object.keys(ex.fixed).length) delete ex.fixed;
      applyAutoRest(ex);
      /* not while the payer is typing in it — but the blink has to stop */
      if(p.id === ex.payerId) inp.classList.remove('auto');
      else paintAutoField(box, ex);
      updatePerShare(); renderResults(); save(); refreshExactFoot(box, ex);
    });
    cell.appendChild(inp);
    inputs.push(inp);
    grid.appendChild(cell);
  });
  box.appendChild(grid);

  var foot = el('div','exact-f');
  var note = el('span','exact-note','');
  var clr = el('button','btn sm', t('exact.clear'));
  clr.addEventListener('click', function(){
    delete ex.fixed;
    autoRest = null;                 /* an empty strip has no rest to carry */
    var ins = box.querySelectorAll('input');
    for(var i=0;i<ins.length;i++) ins[i].value = '';
    updatePerShare(); renderResults(); save(); refreshExactFoot(box, ex);
  });
  var done = el('button','btn sm primary', t('exact.close'));
  done.addEventListener('click', function(){ closeExactRows(); renderTable(); renderResults(); });
  foot.appendChild(note);
  foot.appendChild(clr);
  foot.appendChild(done);
  box.appendChild(foot);
  box._note = note;
  box._ex = ex;
  box._inputs = inputs;

  td.appendChild(box);
  tr.appendChild(td);
  if(!cardMode) afterTr.parentNode.insertBefore(tr, afterTr.nextSibling);
  /* Opening the strip is what starts the automatic rest: an expense with a
     payer and an amount is nearly always "the rest was mine". */
  autoRest = (ex.payerId && (ex.cents || 0) > 0 && !autoDone[ex.id]) ? ex.id : null;
  autoLive = false;
  /* an empty panel gets the rest shown at the payer straight away; one that
     already carries amounts is left exactly as it stands */
  box._proposal = autoArmed(ex) && !ex.fixed;
  if(box._proposal) paintAutoField(box, ex);
  refreshExactFoot(box, ex);
  var first = box.querySelector('input');
  if(first && !first.disabled) first.focus();
}

/* Refresh the strip that is currently open, if any. Called when the expense
   amount changes underneath it. */
/* ---------- the rest, on the person who paid ----------
   Opening the fixed amounts on an expense that has a payer puts whatever is
   left of it on that payer, and keeps it there as the others are typed in: a
   receipt is usually "these three items were for you, the rest was mine".
   The moment their field is emptied or set to zero, the sheet stops doing it
   and the expense goes back to being split by shares. */
var autoRest = null;                 /* the expense id it is running on */
/* Armed but not yet writing. Opening a panel that already has amounts in it
   must not move anybody's figure — the automatic rest engages on the first
   amount that is actually CHANGED. On an empty panel it shows the rest at the
   payer straight away, but as a proposal: the figure is in the field and
   blinking, and nothing is written until something is really entered. */
var autoLive = false;
/* Once the payer's own figure has been corrected by hand, the sheet stops
   guessing at it for that expense — for good, not just until the strip is
   closed. Somebody who has said what their own share was does not want it
   silently rewritten the next time they open the panel. */
var autoDone = {};
/* Is there anybody left to take what is not fixed? A tick with no fixed amount
   beside it IS somebody: the money is already theirs, and there is no rest for
   the payer to hold. Only when the last tick is gone does the remainder have
   nowhere to go, and only then does the payer get it. */
function restTakers(ex){
  var n = 0;
  for(var i=0;i<state.people.length;i++){
    var p = state.people[i];
    if(!(ex.shares && ex.shares[p.id] > 0)) continue;
    /* the payer's own tick counts like everybody else's — what is being
       decided here is whether their FIXED amount should exist at all */
    if(p.id !== ex.payerId && ex.fixed && ex.fixed[p.id]) continue;
    n++;
  }
  return n;
}
function autoArmedBase(ex){
  return !!ex && autoRest === ex.id && !!ex.payerId && !autoDone[ex.id];
}
function autoArmed(ex){ return autoArmedBase(ex) && restTakers(ex) === 0; }
function autoOn(ex){ return autoArmed(ex) && autoLive; }
/* what the others have claimed — the payer's automatic share is not a claim */
function fixedByOthers(ex, exceptId){
  var sum = 0;
  for(var k in (ex.fixed || {})){
    if(k === exceptId) continue;
    /* As long as the payer's figure is still the automatic rest — armed, even
       if it has not moved yet — it is a remainder and not a claim. Counting it
       as a claim left the payer holding the whole expense and every other
       field shut, with no way to itemise anybody at all. */
    if(autoArmed(ex) && k === ex.payerId) continue;
    sum += ex.fixed[k];
  }
  return sum;
}
function applyAutoRest(ex){
  if(!autoArmedBase(ex)) return;
  if(!ex.fixed) ex.fixed = {};
  /* a tick has appeared, or was there all along: the rest is theirs, and
     nothing belongs on the payer */
  if(restTakers(ex) > 0){
    delete ex.fixed[ex.payerId];
    if(!Object.keys(ex.fixed).length) delete ex.fixed;
    return;
  }
  if(!autoLive) return;
  var others = fixedByOthers(ex, null);
  /* Nothing itemised yet means there is nothing for the payer to hold the rest
     OF. Writing the whole expense onto them the moment the panel opens made an
     unshared expense look complete for as long as it stood open, and turned it
     orange again the moment it was closed — a warning that came and went with
     a panel nobody had typed into. */
  if(others <= 0) delete ex.fixed[ex.payerId];
  else {
    var rest = (ex.cents || 0) - others;
    if(rest > 0) ex.fixed[ex.payerId] = rest;
    else delete ex.fixed[ex.payerId];
  }
  if(!Object.keys(ex.fixed).length) delete ex.fixed;
}
/* redraw the payer's field from the model without disturbing what is typed */
function paintAutoField(box, ex){
  var ins = box._inputs || [];
  for(var i=0;i<ins.length && i<state.people.length;i++){
    if(state.people[i].id !== ex.payerId) continue;
    /* the field blinks while the figure in it is the app's and not yet the
       user's — the one place in the sheet where a number writes itself */
    var armed = autoArmed(ex) && (autoLive || box._proposal);
    ins[i].classList.toggle('auto', armed);
    if(document.activeElement === ins[i]) return;
    var v = (ex.fixed && ex.fixed[ex.payerId]) || 0;
    /* a proposal is shown but not stored: closing the panel again has to leave
       the expense exactly as it was found */
    if(!v && armed && box._proposal) v = (ex.cents || 0) - fixedByOthers(ex, null);
    ins[i].value = v > 0 ? formatCents(v) : '';
  }
}

function refreshOpenExact(){
  /* the strip is a row of its own in the list and a cell of the card in the
     rail — looking for only one of the two left the note standing while the
     numbers underneath it moved */
  var open = document.querySelector('#tbody tr.exactrow .exact, #tbody td.exactcell .exact');
  if(!open || !open._ex) return;
  open._proposal = autoArmed(open._ex) && !open._ex.fixed;
  paintAutoField(open, open._ex);
  refreshExactFoot(open, open._ex);
}

function refreshExactFoot(box, ex, override){
  var res = computeBalances(state.people, [ex]);
  var pe = res.perExpense[0];
  var note = box._note;
  note.className = 'exact-note';

  /* Nothing to divide up yet — the fields stay shut rather than inviting an
     entry that would immediately be rejected. The same holds per person once
     the others have claimed the whole expense: that field says so instead of
     offering an "amount" that could only be refused. */
  var noAmount = (ex.cents || 0) <= 0;
  var ins = box._inputs || [];
  for(var i=0;i<ins.length && i<state.people.length;i++){
    var pid = state.people[i].id;
    var own = (ex.fixed && ex.fixed[pid]) || 0;
    var others = fixedByOthers(ex, pid);
    var taken = !own && ((ex.cents || 0) - others) <= 0;
    ins[i].disabled = noAmount || taken;
    ins[i].placeholder = (taken && !noAmount) ? t('exact.nothingleft') : t('exact.ph');
  }

  if(override){ note.textContent = override; note.classList.add('bad'); return; }
  if(noAmount){ note.textContent = t('exact.noamount'); note.classList.add('bad'); return; }
  if(pe.overfixed){ note.textContent = t('exact.over', money(-pe.rest)); note.classList.add('bad'); }
  else if(pe.shortfixed){ note.textContent = t('exact.short', money(pe.rest)); note.classList.add('bad'); }
  else {
    /* Who actually takes what is left. "108 € left over" on its own reads as
       money gone missing, when in fact one tick is collecting all of it. */
    var takers = 0;
    for(var q=0;q<pe.shares.length;q++) if(!pe.fixed[q] && pe.shares[q] > 0) takers++;
    /* nobody splitting anything, and nothing to split: every cent is in a
       fixed amount, which is a finished expense and not a rest of zero */
    if(!takers) note.textContent = t('exact.allfixed');
    else note.textContent = t('exact.rest', money(pe.rest), nPeople(takers));
  }
}

function paintShare(btn, n, fixedCents, spent){
  btn.disabled = false;
  if(fixedCents){
    btn.dataset.n = 'fix';
    btn.className = 'sharebtn fixed';
    btn.textContent = formatCents(fixedCents);
    btn.title = t('row.exact');
    return;
  }
  /* The fixed amounts already account for the whole expense, so a share is
     worth nothing. Leaving a tick here would claim a contribution that is not
     happening — so the cell goes quiet and stops responding. */
  if(spent){
    btn.dataset.n = 'spent';
    btn.className = 'sharebtn spent';
    btn.textContent = '\u00d7';
    btn.title = t('row.share.spent');
    btn.disabled = true;
    return;
  }
  btn.dataset.n = n;
  btn.className = 'sharebtn' + (n > 2 ? ' multi' : '');
  btn.textContent = n === 0 ? '·' : (n === 1 ? '✓' : n + '×');
  btn.title = n === 0 ? t('row.share.0') : (n === 1 ? t('row.share.1') : t('row.share.n', n));
}

function updatePerShare(){
  var res = computeBalances(state.people, state.expenses);
  /* Address the rows by their expense id. Indexing tbody's children broke as
     soon as the exact-amount strip was inserted between them — the warning
     colour then landed on the row below. */
  var rows = $('tbody').querySelectorAll('tr[data-eid]');
  for(var i=0;i<rows.length && i<res.perExpense.length;i++){
    var pe = res.perExpense[i];
    var ex = state.expenses[i];
    var v = rows[i].querySelector('td.pershare .v');
    if(v){
      v.textContent = pe.totalShares > 0 ? formatCents(Math.round(pe.perShare)) + ' ' + state.currency : '—';
      v.style.color = pe.totalShares > 0 ? '' : 'var(--warn)';
    }
    /* Toggle the one class this function owns. It used to rewrite className
       outright, which silently stripped whatever else the row was wearing —
       that cost us the exact-amount join once and the change mark once, and
       would have cost the folded state a third time. */
    var warnRow = !!(pe.unassigned || pe.overfixed || pe.shortfixed);
    rows[i].classList.toggle('unassigned', warnRow);
    /* the open strip for fixed amounts is part of the same card, so it turns
       with it — half an orange card reads as a rendering fault */
    var strip = rows[i].nextSibling;
    if(strip && strip.classList && strip.classList.contains('exactrow'))
      strip.classList.toggle('unassigned', warnRow);

    var spent = pe.hasFixed && pe.rest === 0 && (ex.cents||0) !== 0;
    var btns = rows[i].querySelectorAll('td.share .sharebtn');
    for(var j=0;j<btns.length && j<state.people.length;j++){
      var pid = state.people[j].id;
      paintShare(btns[j], ex.shares[pid] || 0, ex.fixed && ex.fixed[pid], spent);
    }
    var exb = rows[i].querySelector('.rowex');
    if(exb) exb.classList.toggle('on', !!pe.hasFixed);
  }
  var tot = $('tfoot').querySelector('.total');
  if(tot) tot.textContent = money(res.total);
}

function summaryText(){

  lines.push(t('sum.total', money(res.total), state.expenses.length, state.people.length));
  lines.push('');
