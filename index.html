/* Saving a file is the ONLY copy of the data the user controls, so it must never
   fail quietly. Three routes, tried in order, and the user is told which one ran:
     1. the system share sheet — the only reliable way out of an Android WebView,
        where an <a download> can be swallowed without any error at all
     2. a normal browser download
     3. the text on screen, to copy by hand — the escape hatch that always works  */
/* Capacitor route: write the file, then hand it to Android's share sheet so the
   user picks where it lands. Needs @capacitor/filesystem and @capacitor/share to
   be part of the build; returns false when they are not. */
function saveViaCapacitor(name, mime, text, done){
  var P = window.Capacitor && window.Capacitor.Plugins;
  if(!P || !P.Filesystem || !P.Share) return false;
  P.Filesystem.writeFile({ path:name, data:text, directory:'CACHE', encoding:'utf8' })
    .then(function(){ return P.Filesystem.getUri({ path:name, directory:'CACHE' }); })
    .then(function(r){
      return P.Share.share({ title:name, url:r.uri, dialogTitle:'Save or send ' + name });
    })
    .then(function(){ done('sent to the share sheet'); })
    .catch(function(e){
      showRaw(name, text);
      done(t('how.screen.reason', (e && e.message) || e));
    });
  return true;
}

/* The one file handle this session has been given, and the name it belongs to.
   Kept so the second save of the same sheet overwrites the first instead of
   producing Test1 (1).json, Test1 (2).json, ... */
var fileHandle = null, fileHandleName = '';

/* Chromium on the desktop can hand back a real file handle; Firefox, Safari and
   every Android WebView cannot. There, the browser owns the Downloads folder
   and appends a counter, and no web API can talk it out of that. */
function saveViaHandle(name, text, done){
  if(!window.showSaveFilePicker) return false;

  function write(handle){
    return handle.createWritable().then(function(w){
      return w.write(text).then(function(){ return w.close(); });
    }).then(function(){
      fileHandle = handle; fileHandleName = name;
      done(t('how.file', handle.name || name));
    });
  }

  /* same sheet as last time: overwrite silently, no dialog at all */
  if(fileHandle && fileHandleName === name){
    fileHandle.queryPermission({mode:'readwrite'}).then(function(p){
      return p === 'granted' ? 'granted' : fileHandle.requestPermission({mode:'readwrite'});
    }).then(function(p){
      if(p !== 'granted') throw new Error('permission');
      return write(fileHandle);
    }).catch(function(){
      fileHandle = null;
      ask();
    });
    return true;
  }
  ask();
  return true;

  function ask(){
    window.showSaveFilePicker({
      suggestedName: name,
      types: [{description:'JSON', accept:{'application/json':['.json']}}],
    }).then(write).catch(function(e){
      /* the user closing the picker is not a failure */
      if(e && e.name === 'AbortError'){ done('cancelled'); return; }
      viaAnchorFallback(name, text, done);
    });
  }
}

function saveFile(name, mime, text, done){
  done = done || function(){};

  /* An <a download> inside an Android WebView does nothing at all, and throws no
     error while doing it — so in the packaged app we must never take that route,
     or we would claim a save that never happened. */
  if(isNativeShell){
    if(saveViaCapacitor(name, mime, text, done)) return;
    showRaw(name, text);
    done(t('how.screen'));
    return;
  }

  if(mime === 'application/json' && saveViaHandle(name, text, done)) return;

  function viaAnchor(){
    var a = document.createElement('a');
    a.download = name;
    var url = null;
    try{
      url = URL.createObjectURL(new Blob([text], {type: mime}));
      a.href = url;
    }catch(e){
      try{ a.href = 'data:' + mime + ';charset=utf-8,' + encodeURIComponent(text); }
      catch(e2){ showRaw(name, text); return done(t('how.screen')); }
    }
    document.body.appendChild(a);
    try{ a.click(); }
    catch(e){ a.remove(); showRaw(name, text); return done(t('how.screen')); }
    a.remove();
    if(url) setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    done(t('how.download'));
  }

  var file = null;
  try{ file = new File([text], name, {type: mime}); }catch(e){}

  if(file && navigator.canShare && navigator.share){
    var ok = false;
    try{ ok = navigator.canShare({files:[file]}); }catch(e){ ok = false; }
    if(ok){
      navigator.share({files:[file], title:name})
        .then(function(){ done(t('how.share')); })
        .catch(function(err){
          /* the user closing the sheet is not a failure */
          if(err && err.name === 'AbortError'){ done('cancelled'); return; }
          viaAnchor();
        });
      return;
    }
  }
  viaAnchor();
}

/* the plain-download path, reachable from the file-handle route when it fails */
function viaAnchorFallback(name, text, done){
  var a = document.createElement('a');
  a.download = name;
  var url = null;
  try{
    url = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    a.href = url;
  }catch(e){ showRaw(name, text); return done(t('how.screen')); }
  document.body.appendChild(a);
  try{ a.click(); }catch(e){ a.remove(); showRaw(name, text); return done(t('how.screen')); }
  a.remove();
  if(url) setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  done(t('how.download'));
}

/* last resort: put the text where it can at least be selected and copied */
function showRaw(name, text){
  $('rawName').textContent = name;
  var ta = $('rawText');
  ta.value = text;
  $('rawDlg').hidden = false;
  ta.focus(); ta.select();
}
function slug(s){ return (s||'billing').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'billing'; }

function exportCsv(){
  var res = computeBalances(state.people, state.expenses);
  var sep = ';';
  function q(v){ v = String(v==null?'':v); return /[";\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
  var out = [];
  out.push([sheetTitle()].map(q).join(sep));
  out.push('');
  out.push([t('th.payer'),t('th.desc'),t('th.amount')].concat(state.people.map(function(p){return p.name;})).concat([t('th.pershare')]).map(q).join(sep));
  state.expenses.forEach(function(ex, i){
    var pe = res.perExpense[i];
    var row = [personName(ex.payerId), ex.desc, (ex.cents/100).toFixed(2).replace('.',',')];
    state.people.forEach(function(p){ var n = ex.shares[p.id]||0; row.push(n===0?'':(n===1?'x':n+'x')); });
    row.push(pe.totalShares ? (pe.perShare/100).toFixed(2).replace('.',',') : '');
    out.push(row.map(q).join(sep));
  });
  out.push(['',t('th.total'),(res.total/100).toFixed(2).replace('.',',')].map(q).join(sep));
  out.push('');
  out.push([t('csv.name'),t('csv.paid'),t('csv.share'),t('csv.balance')].map(q).join(sep));
  res.rows.slice().sort(function(a,b){return b.balance-a.balance;}).forEach(function(r){
    out.push([r.name,(r.paid/100).toFixed(2).replace('.',','),(r.owed/100).toFixed(2).replace('.',','),(r.balance/100).toFixed(2).replace('.',',')].map(q).join(sep));
  });
  out.push('');
  out.push([t('sum.settlement')].map(q).join(sep));
  try{
    settle(res.rows).forEach(function(x){
      out.push([x.fromName,t('csv.pays'),(x.cents/100).toFixed(2).replace('.',','),t('csv.to'),x.toName].map(q).join(sep));
    });
  }catch(e){}
  saveFile(slug(sheetTitle())+'.csv', 'text/csv;charset=utf-8', '﻿'+out.join('\r\n'),
    function(how){
      if(how === 'cancelled'){ toast(t('save.cancelled')); return; }
      toast(t('save.csv', how));
    });
}

function saveLocalFile(){
  var payload = JSON.stringify(state, null, 2);
  saveFile(slug(sheetTitle())+'.json', 'application/json', payload, function(how){
    if(how === 'cancelled'){ toast(t('save.cancelled')); return; }
    toast(t('save.result', state.people.length, state.people.length===1?t('word.person'):t('word.people'),
            state.expenses.length, state.expenses.length===1?t('word.expense'):t('word.expenses'),
            Math.max(1, Math.round(payload.length/1024)), how));
  });
}

/* ============================ wiring ============================ */
function initMenu(){
  var menu = $('menu'), btn = $('menuBtn');
  function close(){ menu.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    var open = !menu.classList.contains('open');
    menu.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', close);
  menu.addEventListener('click', function(e){ e.stopPropagation(); });
  menu.addEventListener('click', function(e){
    var item = e.target.closest('button[data-act]');
    if(!item) return;
    close();
    var act = item.dataset.act;
    if(inputsLocked() && (act==='new' || act==='clear' || act==='currency')){
      toast(t('final.locked.mine')); return;
    }
    if(act==='save'){
      /* First save of a sheet: local file or shared on GitHub. Once the choice
         is made it is not asked again — a shared sheet syncs by itself, and
         "save" then simply exports a local copy as well. */
      if(!syncCfg && !saveTargetChosen){ askSaveTarget(function(){ saveTargetChosen = true; saveLocalFile(); }); }
      else saveLocalFile();
    }
    else if(act==='load'){ askOpenTarget(); }
    else if(act==='share'){ shareSetup(); }
    else if(act==='openshared'){ openShared(); }
    else if(act==='synccode'){ showCode(false); }
    else if(act==='syncnow'){ toast(t('sync.state.busy'), true); syncNow(); }
    else if(act==='unshare'){
      if(confirm(t('confirm.unshare'))){
        var gonePath = syncCfg && syncCfg.path;
        stopSync();
        if(gonePath) forgetShared(gonePath);
        toast(t('unshared'));
      }
    }
    else if(act==='csv'){ exportCsv(); }
    else if(act==='copy'){
      var txt = summaryText();
      if(navigator.share && /Mobi|Android|iPhone|iPad/.test(navigator.userAgent)){
        navigator.share({title:sheetTitle(), text:txt}).catch(function(){});
      }else if(navigator.clipboard){
        navigator.clipboard.writeText(txt).then(function(){ toast(t('copy.done'), true); },
          function(){ prompt(t('copy.prompt'), txt); });
      }else{ prompt(t('copy.prompt'), txt); }
    }
    else if(act==='raw'){ showRaw(slug(sheetTitle())+'.json', JSON.stringify(state, null, 2)); }
    else if(act==='print'){
      /* An Android WebView has no print pipeline at all: window.print() is a
         no-op there and returns without an error, so promising a PDF would be
         a lie. The text view is the route that works everywhere. */
      if(isNativeShell){
        if(confirm(t('print.native'))) showRaw(slug(sheetTitle())+'.txt', summaryText());
        return;
      }
      /* let the menu finish closing, or it prints itself onto the page */
      setTimeout(function(){ window.print(); }, 120);
    }
    else if(act==='topgap'){ topGapDialog(); }
    else if(act==='currency'){
      var c = prompt(t('currency.prompt'), state.currency);
      if(c!=null && c.trim()){ state.currency = c.trim().slice(0,4); renderAll(); save(); }
    }
    else if(act==='update'){
      /* In a packaged Android app the files live inside the APK. Nothing here can
         replace them — a newer version means installing a newer APK. Saying so is
         better than reloading and pretending something happened. */
      if(isNativeShell){
        alert(t('update.native', APP_VERSION));
        return;
      }
      toast(t('update.looking'), true);
      var done = function(){ setTimeout(function(){ location.reload(); }, 600); };
      if('serviceWorker' in navigator){
        navigator.serviceWorker.getRegistrations().then(function(rs){
          return Promise.all(rs.map(function(r){ return r.update().catch(function(){}); }));
        }).then(done, done);
      } else { done(); }
    }
    else if(act==='new'){
      /* A shared sheet cannot simply be emptied: the copy on the server is the
         one everybody else is still editing, and an empty sheet carries no
         tombstones, so the next exchange would pull all of it back. Leaving the
         sharing is therefore not a side effect — it is part of the question,
         which is why it is ONE question and not two in a row. */
      if(!confirmDrop('new')) return;
      startEmptySheet(false);
      toast(t('new.done'));
    }
    else if(act==='clear'){
      if(!confirmDrop('clear')) return;
      adopt(emptyState()); renderAll(); save(); toast(t('cleared'));
    }
  });
}

$('fileInput').addEventListener('change', function(){
  var f = this.files && this.files[0];
  var input = this;
  if(!f){ return; }
  var fr = new FileReader();

  /* Without this handler a failed read was completely silent — which is exactly
     what an Android file picker does when it hands back a URI the app may not
     read. Never fail quietly on the one action that restores someone's data. */
  fr.onerror = function(){
    input.value = '';
    alert(t('load.unreadable', f.name || '?'));
  };

  fr.onload = function(){
    input.value = '';
    var text = String(fr.result == null ? '' : fr.result);
    if(!text.trim()){
      alert(t('load.empty', f.name || '?'));
      return;
    }
    var st;
    try{
      st = JSON.parse(text);
    }catch(e){

$('addRow').addEventListener('click', function(){

     nobody selected, no payer. Who paid and who shares are the two things that
     genuinely differ from row to row — guessing them is more likely to be wrong
     than right, and a wrong tick is easy to miss. */
  /* c is the ordering key. Without it the row travels with c = 0 and comes
     back from the exchange sorted below everything else — which is exactly the
     "row jumps down after the first tap" that was reported. */
  var fresh = {id:uid(), payerId:null, desc:'', cents:0, shares:{},
               m:Date.now(), c:Date.now(), o:deviceId};
  state.expenses.unshift(fresh);
  /* a new expense is there to be filled in, so it opens */
  openExpense = fresh.id;
  /* In the rail it is the leftmost card — and the one to be looked at. Without
     this the rail stays where it was and the new card is off screen, inert,
     with the cursor in a field nobody can see. */
  if(cardMode) cardAt = 0;
  renderTable(); renderResults(); save();
  var firstRow = $('tbody').querySelector('tr');
  if(!firstRow) return;
  /* the rail is positioned by a transform; scrolling the row itself sideways
     would fight it, so in card mode the card as a whole is brought into view */
  if(cardMode){
    var wrap = $('tbl').closest('.card');
    if(wrap) wrap.scrollIntoView({block:'nearest'});
  }else{
    firstRow.scrollIntoView({block:'nearest'});
  }

  /* Walk the row in the order the entry actually happens: who paid, then how
     much. showPicker() drops the list open in Chromium — everywhere else the
     field is merely focused, which is the same keystroke away. It throws when
     the browser will not honour it (no user gesture, no support), and that is
     not a failure worth reporting. */
  var sel = firstRow.querySelector('td.payer select');
  var amt = firstRow.querySelector('td.amt input');
  if(!sel) return;
  sel.focus();
  try{ if(sel.showPicker) sel.showPicker(); }catch(e){}

  if(!amt) return;

  sel.addEventListener('change', function once(){
    sel.removeEventListener('change', once);
    /* the row's own change handler re-renders the results first */
    setTimeout(function(){
      if(!focusIsFree(sel)) return;
      amt.focus(); amt.select();
    }, 0);

     field, which is exactly when the amount is finished. */
  if(desc) amt.addEventListener('change', function onceAmt(){

   the name box, say — and pulling the cursor back from there is not a
   convenience, it is a fight. So the hop only happens when nothing else has
   claimed the focus in the meantime. */
function focusIsFree(from){
  var a = document.activeElement;
  return !a || a === document.body || a === from;
}

/* A text input does not grow with its text, so a long sheet name used to be
   scrolled inside a squeezed field. Sizing it to the content lets the flex row
   wrap the buttons onto a second line instead. */
/* A text input does not grow with its text, and its `size` attribute is a poor
   proxy — it reserves roughly an average character each, which for a short name
   asks for twice the room the text actually needs. So measure the text itself,
   in the input's own font, and decide from that whether the buttons still fit
   beside it or have to wrap onto their own line. */
var titleRuler = null;
function fitTitle(){
  var i = $('tripTitle');
  var hdr = document.querySelector('header.top');
  var brand = document.querySelector('.brand');
  var acts = document.querySelector('.top-actions');
  if(!i || !hdr || !brand || !acts) return;

  if(!titleRuler){
    titleRuler = document.createElement('span');
    titleRuler.setAttribute('aria-hidden','true');
    titleRuler.style.cssText =
      'position:absolute;left:-9999px;top:0;white-space:pre;visibility:hidden';
    document.body.appendChild(titleRuler);
  }
  var cs = getComputedStyle(i);
  titleRuler.style.font = cs.font;
  titleRuler.style.letterSpacing = cs.letterSpacing;
  titleRuler.textContent = i.value || i.placeholder || '';

  var chrome = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) +
               parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
  var wanted = titleRuler.offsetWidth + chrome + 14;   /* room for the caret */

  hdr.classList.remove('stacked');
  i.style.width = '';
  var fixed = brand.getBoundingClientRect().width - i.getBoundingClientRect().width;
  var room = hdr.clientWidth - acts.scrollWidth - fixed - 16;

  if(wanted > room){
    hdr.classList.add('stacked');      /* the name takes the line to itself */
    i.style.width = '';
  }else{
    i.style.width = Math.max(90, wanted) + 'px';
  }
  /* a wrapped name needs the field to grow with it */
  i.style.height = 'auto';
  i.style.height = i.scrollHeight + 'px';
  measureHead();
}

   service worker either: the files are already local, so an extra cache layer
   would only risk serving something stale inside the packaged app. */

/* ---------------- the strip at the top of the screen ----------------
   Android draws the app edge to edge: the status bar sits ON TOP of the page,
   and on a phone with a punch-hole camera the lens is inside that strip. How
   much room to leave cannot be decided in CSS, because three different things
   can be true and a stylesheet cannot tell them apart:

     - the WebView reports the inset properly   -> use what it reports
     - it reports nothing at all                -> guess, generously
     - the shell turned overlaying off          -> the system keeps the room

   So it is worked out here — and because a guess is a guess, the user can
   correct it from the menu and the correction sticks. */
var overlayOff = false;

function measuredInsetTop(){
  var probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;left:0;width:1px;' +
    'height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none';
  document.body.appendChild(probe);
  var h = probe.getBoundingClientRect().height;
  probe.remove();
  return Math.round(h);
}
function storedTopGap(){
  var v = null;
  try{ v = localStorage.getItem('billing-tool.topgap'); }catch(e){}
  if(v === null || v === '') return null;
  var n = parseInt(v, 10);
  return isNaN(n) ? null : n;
}
function autoTopGap(){
  if(!isNativeShell && !isStandalone) return window.innerWidth <= 700 ? 4 : 6;
  var inset = measuredInsetTop();

  /* 42 is not a formula, it is a measurement: the value that looks right on a
     Pixel 8, which reports an inset of 51 and hides its camera in that strip.
     Deriving it from the reported inset was tried and does not work — adding a
     margin to 51 gives 69, using 51 raw is more room than the bar needs, and
     the plugin's "overlay off" says nothing about whether the strip is really
     reserved, because that device reports 51 either way.
     Phones differ, so this default is only a starting point — Menu → adjust
     the gap corrects it, and the correction sticks. */
  if(inset > 0) return 42;
  if(overlayOff) return 12;   /* reserved by the system: nothing left to clear */
  return 42;                  /* nothing reported either: the same starting point */
}
function applyTopGap(){
  var v = storedTopGap();
  if(v === null) v = autoTopGap();
  v = Math.max(0, Math.min(160, v));
  document.documentElement.style.setProperty('--top-pad', v + 'px');
  measureHead();

}

/* A sheet must be named before anything can be entered. The name doubles as the
   filename on save, so an unnamed sheet would also produce unnamed backups —
   which is how people end up with three files called billing-sheet.json. */
/* Naming a sheet while entries from an earlier one are still present is
   ambiguous: it can mean "new trip" or "I mistyped the name". Rather than guess
   — and silently delete somebody's evening of typing — the app asks once, and
   stays locked until the question is answered. */
var carryChoice = 'keep';   // 'keep' | 'new' | null = still undecided

function countData(){ return state.people.length + state.expenses.length; }

/* A shared sheet has to know who is typing. Everything the group settles later
   hangs on it: who owes whom, whose confirmation is still missing, whose name
   turns into "me". So on a shared sheet the device says who it is BEFORE it
   may enter anything — the people list stays open, everything else waits.
   A sheet used alone needs none of this. */
function needsMeGate(){ return !!syncCfg && !meId(); }

function applyGate(){
  var named = !!(state.title || '').trim();
  var hasData = countData() > 0;
  var undecided = hasData && carryChoice === null;
  var locked = !named || undecided;
  var needMe = !locked && needsMeGate();

  document.body.classList.toggle('needs-title', locked);
  document.body.classList.toggle('needs-me', needMe);
  $('gateBar').hidden = !(locked || needMe);
  $('gateKeep').hidden = !undecided;
  $('gateNew').hidden = !undecided;
  $('gateName').hidden = undecided || needMe;
  $('gateMe').hidden = !needMe;

  if(undecided){
    $('gateHead').textContent = t(named ? 'gate.carry.head.named' : 'gate.carry.head.unnamed');
    $('gateSub').textContent = t('gate.carry.sub', nPeople(state.people.length),
                                 nExpenses(state.expenses.length));
  } else if(locked){
    $('gateHead').textContent = t('gate.name.head');
    $('gateSub').textContent = t('gate.name.sub');
  } else if(needMe){
    $('gateHead').textContent = t('gate.me.head');
    $('gateSub').textContent = t(state.people.length ? 'gate.me.sub' : 'gate.me.sub.empty');
  }

  /* Three locks, one place.
       - the gate closes everything until the sheet has a name
       - "who am I" closes everything except the people list, and answers a tap
         with a hint instead of silence, so nobody wonders what is broken
       - a confirmation closes what can be edited, and leaves the rest alone */
  var editLock = inputsLocked();
  var cards = document.querySelectorAll('.gated');
  for(var i=0;i<cards.length;i++){
    var card = cards[i];
    var meShut = needMe && !card.hasAttribute('data-meok');
    var shut = locked || (editLock && card.hasAttribute('data-edit'));
    /* A confirmed sheet closes for editing — but paying up happens AFTER the
       confirmation, and an address is not part of the sheet. So the people
       list stays reachable: the names are read-only, only the two address
       buttons still answer. Otherwise a missing IBAN could only be added by
       cancelling everybody's confirmation, which would also take away the very
       buttons it was needed for. */
    if(shut && !locked && card.hasAttribute('data-meok')) shut = false;
    setCardLock(card, shut ? 'inert' : (meShut ? 'shade' : 'open'));
  }
  $('tripTitle').readOnly = editLock;
  applyFinalLock();
  /* the people list is forced open while its own answer is what is missing */
  renderPeopleFold();
}

/* An inert subtree swallows the click whole — the event never reaches any
   handler, so there is nothing left to explain the lock with. The shade is a
   plain element on top: it catches the tap, the parts underneath go inert. */
function setCardLock(card, mode){
  var shade = card.querySelector(':scope > .meshade');
  if(mode === 'shade'){
    card.removeAttribute('inert');
    for(var i=0;i<card.children.length;i++){
      var ch = card.children[i];
      if(ch !== shade) ch.setAttribute('inert','');
    }
    if(!shade){
      shade = el('div','meshade');
      shade.addEventListener('click', function(){ toast(t('gate.me.hint')); });
      card.appendChild(shade);
    }
    card.classList.add('shaded');
    return;
  }
  if(shade) shade.remove();
  card.classList.remove('shaded');
  for(var j=0;j<card.children.length;j++) card.children[j].removeAttribute('inert');
  if(mode === 'inert') card.setAttribute('inert',''); else card.removeAttribute('inert');
}

function startEmptySheet(keepTitle){
  /* An empty sheet knows nothing about the records that were there before, so
     it carries no tombstones for them. Left connected, the very next exchange
     would read the server's copy and put every one of them back. The menu asks
     before it gets here; this is the backstop for every other caller. */
  if(syncCfg) stopSync();

  adopt(emptyState());

  carryChoice = 'keep';

}

/* ======================= shared editing (GitHub) =======================
   The sheet lives in a private repository as one encrypted file. Every
   participant holds the same invitation code, which carries the repository,
   the access token and the key OF THIS SHEET — nothing else in that
   repository can be read with it.

   What this is not: it is not a server. There is no locking and no
   authority. Two people editing different rows both keep their edit; two
   people editing the same row, the later write wins. Both devices' clocks
   decide what "later" means, so a badly wrong clock decides wrongly.

var SYNC_KEY  = 'billing-tool.sync';    /* the sheet open right now */
var KNOWN_KEY = 'billing-tool.shared';  /* codes kept on this device */
var syncCfg = null, syncKeyObj = null, syncSha = null, syncPw = null, syncSalt = null;
var syncTimer = null, syncBusy = false, syncAgain = false, syncPoll = null;
/* Bumped whenever the shared sheet changes or sharing ends. A cycle that was
   already in flight checks it before touching anything: without this, ending

   screen a second later. */
var syncGen = 0;

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function knownShared(){
  try{ var a = JSON.parse(lsGet(KNOWN_KEY) || '[]'); return Array.isArray(a) ? a : []; }
  catch(e){ return []; }
}
/* What this device knows about a shared sheet is the whole configuration —
   location, token and password. It never appears on screen: the list shows the
   sheet's name and nothing else, and the code is rebuilt from it when asked
   for. Anyone who can read this device's storage can read the sheet anyway. */
function rememberShared(cfg, title, pw){
  var list = knownShared().filter(function(x){ return x.path !== cfg.path; });
  list.unshift({ path: cfg.path, title: title || '', owner: cfg.owner, repo: cfg.repo,
                 token: cfg.token, pw: pw });
  lsSet(KNOWN_KEY, JSON.stringify(list.slice(0, 20)));
}
function forgetShared(path){
  lsSet(KNOWN_KEY, JSON.stringify(knownShared().filter(function(x){ return x.path !== path; })));
}

/* ---------- wire format ---------- */
/* Deleted records must travel too, or a delete on one phone would simply be
   undone by the next sync from another. They travel as tombstones: id, time,
   and nothing else. */
function toWire(st){
  var w = { title: st.title, tm: st.tm||0, currency: st.currency, cm: st.cm||0,
            people: [], expenses: [], claims: st.claims || {}, final: st.final || {},
            rev: Number(st.rev) || 0, pay: st.pay || {}, sent: st.sent || {} };
  st.people.forEach(function(p){
    var r = {id:p.id, name:p.name, m:p.m||0};
    if(p.o) r.o = p.o;
    w.people.push(r);
  });
  st.expenses.forEach(function(e){
    var o = {id:e.id, payerId:e.payerId, desc:e.desc, cents:e.cents, shares:e.shares,
             m:e.m||0, c:e.c||0};
    if(e.o) o.o = e.o;
    if(e.fixed) o.fixed = e.fixed;
    w.expenses.push(o);
  });
  for(var a in st.gone.p) w.people.push({id:a, x:1, m:st.gone.p[a].m, o:st.gone.p[a].d || undefined});
  for(var b in st.gone.e) w.expenses.push({id:b, x:1, m:st.gone.e[b].m, o:st.gone.e[b].d || undefined});
  return w;
}
function fromWire(w){
  var st = emptyState();
  st.title = String(w.title || ''); st.tm = Number(w.tm)||0;
  st.currency = w.currency || st.currency; st.cm = Number(w.cm)||0;
  st.claims = w.claims || {};
  st.final = w.final || {};
  st.rev = Number(w.rev) || 0;
  st.pay = w.pay || {};
  st.sent = w.sent || {};
  (w.people||[]).forEach(function(p){
    if(p.x) st.gone.p[p.id] = { m: Number(p.m)||0, d: p.o || null }; else st.people.push(p);
  });
  (w.expenses||[]).forEach(function(e){
    if(e.x) st.gone.e[e.id] = { m: Number(e.m)||0, d: e.o || null }; else st.expenses.push(e);
  });
  return normalize(st);
}

/* ---------- claiming a person as "me" ---------- */
/* On a shared sheet the claim has to be checked against the others before it
   is believed: read what is on the server, look again, write, then read back.
   On a local sheet there is nobody to collide with and it is immediate. */
function claimPerson(personId){
  if(meId()) return;                       /* one at a time */
  var taken = claimedBy(personId);
  if(taken && taken !== deviceId){ toast(t('me.taken', personName(personId))); return; }

  function apply(){
    state.claims[personId] = { d: deviceId, m: Date.now() };
    renderAll(); save();
  }

  if(!syncCfg){ apply(); return; }

  toast(t('me.checking'), true);
  syncNow().then(function(){
    var who = claimedBy(personId);
    if(who && who !== deviceId){ toast(t('me.taken', personName(personId))); renderAll(); return; }
    apply();
    return syncNow();
  }).then(function(){
    /* the exchange may have brought a competing claim with a later stamp */
    if(meId() !== personId && claimedBy(personId)){
      toast(t('me.lost', personName(personId)));
      renderAll();
    }
  }).catch(function(){
    /* offline: keep it locally, the next exchange settles it */
    apply();
  });
}

function releasePerson(personId){
  /* An empty entry, stamped now: a claim that is merely deleted would come
     straight back from the other side, which still has the old one. */
  state.claims[personId] = { d: null, m: Date.now() };
  renderAll(); save();
}

/* ---------- status ---------- */
/* The footer promises that nothing leaves the device. For a shared sheet that
   promise is false, and a false promise about where data goes is worse than no
   promise at all. */
function updatePrivacyNote(){
  var n = $('privacyNote');
  if(!n) return;
  var key = syncCfg ? 'foot.privacy.shared' : 'foot.privacy';
  n.dataset.i18n = key;
  n.textContent = t(key);
}

function setSyncStatus(kind, detail){
  var bar = $('syncBar');
  /* "deleted" is the one state worth keeping on screen after the sharing has
     ended — otherwise the bar would simply vanish and nobody would learn why */
  var show = !!syncCfg || kind === 'gone';
  bar.hidden = !show;
  updatePrivacyNote();
  /* the bar covers the last few lines of the page unless the body makes room */
  document.body.classList.toggle('has-syncbar', show);
  if(!show) return;
  bar.dataset.s = kind;
  $('syncLbl').textContent = t('sync.state.' + kind);
  bar.title = detail || t('sync.state.' + kind);
}
function syncMenuItems(){
  ['synccode','syncnow','unshare'].forEach(function(a){
    var b = document.querySelector('#menu [data-act="' + a + '"]');
    if(b) b.hidden = !syncCfg;
  });
  var sh = document.querySelector('#menu [data-act="share"]');
  if(sh) sh.hidden = !!syncCfg;
  /* the confirmation only exists among several devices, so it comes and goes
     with the sharing itself */
  /* this also runs while the page is still starting up, before there is a
     sheet to look at */
  if(state && $('finalBar')){ renderFinal(); applyGate(); }
}

/* ---------- the sync cycle ---------- */
function syncSoon(){
  if(!syncCfg) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){ syncNow(); }, 1500);
}

var EDIT_GRACE = 2500;
/* Where the cursor was, in terms that survive the whole table being rebuilt:
   which expense row, which kind of cell, and how far into the text. */
function markSpot(){
  var a = document.activeElement;
  if(!a || !a.closest) return null;
  var td = a.closest('td');
  var tr = a.closest('tr[data-eid]');
  var spot = { start: a.selectionStart, end: a.selectionEnd };
  if(tr && td){ spot.eid = tr.dataset.eid; spot.cell = td.className.split(' ')[0]; return spot; }
  if(a.id){ spot.id = a.id; return spot; }
  return null;
}
function restoreSpot(spot){
  if(!spot) return;
  var node = null;
  if(spot.eid){
    var tr = $('tbody').querySelector('tr[data-eid="' + spot.eid + '"]');
    if(tr) node = tr.querySelector('td.' + spot.cell + ' input, td.' + spot.cell + ' select');
  } else if(spot.id){
    node = $(spot.id);
  }
  if(!node) return;
  try{
    node.focus();
    if(spot.start != null && node.setSelectionRange) node.setSelectionRange(spot.start, spot.end);
  }catch(e){}
}

function typingNow(){
  var a = document.activeElement;
  if(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) return true;
  /* focus() does not always take on iOS Safari, so the focused-element test
     alone is not enough to tell that somebody is in the middle of something. */
  return (Date.now() - lastLocalEdit) < EDIT_GRACE;
}

function syncNow(){
  if(!syncCfg || !syncKeyObj) return Promise.resolve();
  if(syncBusy){ syncAgain = true; return Promise.resolve(); }
  syncBusy = true;
  setSyncStatus('busy');
  var gen = syncGen;
  var stale = function(){ return gen !== syncGen || !syncCfg; };

  return Sync.ghGet(syncCfg)
    .then(function(r){
      if(stale()) return null;
      /* The file is always created before sharing starts, so "not there" can
         only mean somebody deleted it. Pushing our copy back would undo their
         deletion — and did: a sheet deleted on one phone reappeared seconds
         later, written by another that still had it open. */
      if(r.missing){
        stopSync();
        setSyncStatus('gone');
        toast(t('sync.gone'));
        return null;
      }
      syncSha = r.sha;
      return Sync.unseal(syncKeyObj, r.text);
    })
    .then(function(remote){
      if(stale()){ syncBusy = false; return null; }
      var mine = toWire(state);
      var merged = remote ? Sync.mergeState(mine, remote) : mine;
      var fpMerged = Sync.fingerprint(merged);

      /* take what the others changed — but never yank the field the user is
         typing in out from under them; the next round picks it up */
      if(remote && fpMerged !== Sync.fingerprint(mine) && !typingNow()){
        var spot = markSpot();
        var beforeFinal = lastFinalSeen, beforeSnap = lastSnap;
        adopt(fromWire(merged));
        noticeFinalChange(beforeFinal, beforeSnap);
        renderAll();
        restoreSpot(spot);
        lsSet(STORE_KEY, JSON.stringify(state));
      }
      if(remote && fpMerged === Sync.fingerprint(remote)) return { sha: syncSha };

      return Sync.seal(syncKeyObj, syncSalt, merged, merged.title).then(function(text){
        /* sealing is a key operation and takes a moment; the sheet may have
           been left or deleted in the meantime */
        if(stale()) return { sha: syncSha };
        return Sync.ghPut(syncCfg, text, syncSha, 'billing-tool: ' + Sync.randomId(4));
      });
    })
    .then(function(res){
      if(stale()){ syncBusy = false; return; }
      if(res && res.conflict){
        /* somebody wrote between our read and our write — go round again */
        syncBusy = false;
        return syncNow();
      }
      if(res && res.sha) syncSha = res.sha;
      /* The sheet keeps its file and its invitation code when it is renamed —
         changing either would cut off every device that already has them. What
         has to follow is the NAME this device shows for it in the list. */
      if(syncCfg) rememberShared(syncCfg, state.title, syncPw);
      setSyncStatus('ok');
      syncBusy = false;
      if(syncAgain){ syncAgain = false; syncSoon(); }
    })
    .catch(function(e){
      syncBusy = false;
      if(stale()) return;
      var kind = (e && (e.status === 401 || e.status === 403)) ? 'denied'
               : (e && e.message === 'wrong-password') ? 'badkey' : 'offline';
      setSyncStatus(kind, (e && e.message) || '');
    });
}

function startSync(cfg, password, key, salt){
  syncGen++;
  syncBusy = false; syncAgain = false;
  syncCfg = cfg; syncSha = null; syncPw = password;
  syncKeyObj = key || null; syncSalt = salt || null;
  lsSet(SYNC_KEY, JSON.stringify({cfg: cfg, pw: password}));
  syncMenuItems();
  setSyncStatus('busy');
  clearInterval(syncPoll);
  /* a poll rather than a push channel: 20 s costs about 180 of the 5000
     hourly API calls and needs no server of any kind */
  syncPoll = setInterval(function(){
    if(document.visibilityState === 'visible' && !typingNow()) syncNow();
  }, 20000);
  if(syncKeyObj && syncSalt) return syncNow();
  /* no key handed in — the sheet must already be there to take a salt from */
  return Sync.ghGet(cfg).then(function(r){
    if(r.missing) throw new Error('gone');
    syncSha = r.sha;
    return Sync.openSealed(password, r.text);
  }).then(function(o){
    syncKeyObj = o.key; syncSalt = o.salt;
    return syncNow();
  });
}
/* One question, not two. On a shared sheet, leaving the sharing and losing the
   entries are the same decision, and splitting them into two dialogs only
   invites clicking through both. Ending the sharing keeps the device coupled:
   repository and token stay stored, so the next sheet this device shares asks
   for nothing but a password.
   Returns false when the user backs out. */
function confirmDrop(kind){
  if(syncCfg){
    if(!confirm(t('confirm.shared.' + kind, nPeople(state.people.length),
                  nExpenses(state.expenses.length)))) return false;
    var path = syncCfg.path;
    stopSync();
    forgetShared(path);
    return true;
  }
  if(kind === 'new') return !countData() || confirm(t('confirm.new', countData()));
  return confirm(t('confirm.clear'));
}

function stopSync(){
  syncGen++;
  syncBusy = false; syncAgain = false;
  clearInterval(syncPoll); clearTimeout(syncTimer);
  syncCfg = null; syncKeyObj = null; syncSha = null; syncPw = null; syncSalt = null;
  /* a confirmation only means anything among several devices — keeping it after
     leaving would lock this one with nobody left to unlock it */
  if(state.final && state.final[deviceId])
    state.final[deviceId] = { a: 0, m: Date.now(), r: Number(state.rev) || 0 };
  finalNotice = null;
  lastFinalSeen = JSON.stringify(stFinal());
  applyFinalLock();
  lsDel(SYNC_KEY);
  syncMenuItems();
  $('syncBar').hidden = true;
  document.body.classList.remove('has-syncbar');
  updatePrivacyNote();
}

/* ---------- dialog plumbing ---------- */
function dlgOpen(title, buildBody, buttons){
  $('shareTitle').textContent = title;
  var body = $('shareBody'); body.innerHTML = '';
  buildBody(body);
  var foot = $('shareFoot'); foot.innerHTML = '';
  /* The way out goes last, on the right, in every dialog — decided in one
     place so no individual dialog can get the order wrong. */
  var ordered = buttons.slice().sort(function(x, y){
    var wx = (x.act === 'cancel' || x.act === 'close') ? 1 : 0;
    var wy = (y.act === 'cancel' || y.act === 'close') ? 1 : 0;
    return wx - wy;
  });
  ordered.forEach(function(b){
    var btn = el('button', 'btn' + (b.primary ? ' primary' : '') + (b.danger ? ' danger' : ''), b.label);
    if(b.act) btn.dataset.b = b.act;
    btn.addEventListener('click', b.onClick);
    foot.appendChild(btn);
  });
  $('shareDlg').hidden = false;
  /* focus the first field the user is meant to fill in — focusing a read-only
     one scrolls a long code to its end and hides the start of it */
  var first = body.querySelector('input:not([readonly]),textarea:not([readonly]),button');
  if(first) first.focus();
}
/* Emptying the dialog on close matters: a hidden button with a live handler
   from the previous dialog is still in the document, still findable, and still
   clickable by anything that does not check visibility. */
function dlgClose(){
  $('shareDlg').hidden = true;
  $('shareBody').innerHTML = '';
  $('shareFoot').innerHTML = '';
}
function field(parent, labelText, opts){
  var wrap = el('label','fld');
  wrap.appendChild(el('span','fld-l', labelText));
  var inp = document.createElement(opts && opts.area ? 'textarea' : 'input');
  if(opts && opts.ph) inp.placeholder = opts.ph;
  if(opts && opts.value) inp.value = opts.value;
  if(opts && opts.mono) inp.className = 'mono';
  if(opts && opts.ro) inp.readOnly = true;
  wrap.appendChild(inp);
  parent.appendChild(wrap);
  inp._wrap = wrap;
  return inp;
}
function note(parent, text, cls){ parent.appendChild(el('p','dlg-p' + (cls?' '+cls:''), text)); }

/* ---------- start sharing ---------- */
/* Where the sheets are kept and what opens the repository are properties of the
   DEVICE, not of a sheet — once given, they are never asked for again. Only the
   password, which belongs to the individual sheet, has to be typed. */
function storeStore(repo, token){
  lsSet('billing-tool.repo', JSON.stringify({ repo: repo, token: token }));
}
/* The group all share one repository, so its address is not a secret and not
   worth making anyone type. The token still is, and still must be. */
var DEFAULT_REPO = 'adecky73/billing-tool-data';
function storedStore(){
  var last = null;
  try{ last = JSON.parse(lsGet('billing-tool.repo') || 'null'); }catch(e){}
  var list = knownShared();
  return {
    repo: (last && last.repo) || DEFAULT_REPO,
    token: (last && last.token) || (list.length && list[0].token) || '',
  };
}
/* repo + token fields that hide themselves once they are known, behind one
   button — so the normal case is a single password field */
function storeFields(b, known){
  var repoIn = field(b, t('share.field.repo'), {ph:'user/billing-tool-data', value:known.repo, mono:true});
  var tokIn  = field(b, t('share.field.token'), {ph:'github_pat_…', value:known.token, mono:true});
  /* Hide only what is actually known. With a built-in default repository but
     no token yet, the token field is the one thing that must stay visible. */
  var have = !!(known.repo && known.token);
  repoIn._wrap.hidden = have || !!known.repo;
  tokIn._wrap.hidden = have;
  var line = null;
  if(known.repo){
    line = el('button','linkbtn', t('store.change'));
    line.addEventListener('click', function(){
      repoIn._wrap.hidden = false; tokIn._wrap.hidden = false;
      line.hidden = true; repoIn.focus();
    });
    b.appendChild(line);
  }
  return { repo: repoIn, token: tokIn };
}
/* returns owner/repo/token, or null after saying what is wrong */
function readStoreFields(f){
  var parts = String(f.repo.value||'').trim()
    .replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').split('/');
  var token = String(f.token.value||'').trim();
  if(parts.length !== 2 || !parts[0] || !parts[1]){
    f.repo._wrap.hidden = false; toast(t('share.badrepo')); f.repo.focus(); return null;
  }
  if(!token){
    f.token._wrap.hidden = false; toast(t('share.badtoken')); f.token.focus(); return null;
  }
  storeStore(parts.join('/'), token);
  return { owner: parts[0], repo: parts[1], token: token };
}

function shareSetup(){
  if(!(state.title||'').trim()){ toast(t('share.needname')); return; }
  var sf, pwIn;
  var known = storedStore();
  dlgOpen(t('share.setup.title'), function(b){
    note(b, t(known.repo && known.token ? 'share.setup.intro.known' : 'share.setup.intro'));
    sf = storeFields(b, known);
    pwIn = field(b, t('share.field.pw'), {ph:t('share.pw.ph'), value:Sync.suggestPassword(), mono:true});
    note(b, t('share.pw.hint'));
    note(b, t('share.setup.warn'), 'warnp');
  }, [
    { label: t('btn.cancel'), act:'cancel', onClick: dlgClose },
    { label: t('share.pw.new'), act:'newpw', onClick: function(){ pwIn.value = Sync.suggestPassword(); pwIn.focus(); } },
    { label: t('share.setup.go'), act:'go', primary: true, onClick: function(){
        var pw = String(pwIn.value||'').trim();
        if(pw.length < 8){ toast(t('share.badpw')); pwIn.focus(); return; }
        var st = readStoreFields(sf);
        if(!st) return;
        dlgClose();
        toast(t('sync.state.busy'), true);
        /* Two sheets with the same name in one repository is how a group ends
           up keeping two half-filled copies of the same trip. Look first. */
        readShelf(st).then(function(items){
          var clash = items.filter(function(it){ return sameName(it.label, state.title); })[0];
          if(clash) return askAboutClash(clash);
          return createShared(st, pw);
        }).catch(function(e){
          reportShareError(e);
        });
      } },
  ]);
}

/* The name is already on the shelf: open that one, or pick another name. */
function askAboutClash(it){
  dlgOpen(t('clash.title'), function(b){
    note(b, t('clash.intro', it.label));
    note(b, t('clash.warn'), 'warnp');
  }, [
    { label: t('btn.cancel'), act:'cancel', onClick: dlgClose },
    { label: t('clash.rename'), act:'rename', onClick: function(){
        dlgClose();
        $('tripTitle').focus();
        $('tripTitle').select();
        toast(t('clash.renamehint'));
      } },
    { label: t('clash.open'), act:'go', primary: true, onClick: function(){
        dlgClose();
        askPasswordFor(it);
      } },
  ]);
}

function reportShareError(e){
  var msg = (e && e.status === 404) ? t('share.err.404')
          : (e && (e.status === 401 || e.status === 403)) ? t('share.err.auth')
          : ((e && e.message) || 'error');
  alert(t('share.err.head') + '\n\n' + msg);
}

function createShared(st, pw){
  var cfg = { owner: st.owner, repo: st.repo,
              path: 'sheets/' + Sync.randomId(10) + '.json', token: st.token };
  var salt = Sync.newSalt(), key = null;
  return Sync.deriveKey(pw, salt).then(function(k){
    key = k;
    return Sync.seal(k, salt, toWire(state), state.title);
  }).then(function(text){
    return Sync.ghPut(cfg, text, null, 'billing-tool: new sheet');
  }).then(function(res){
    if(res.conflict) throw new Error('conflict');
    syncSha = res.sha;
    rememberShared(cfg, sheetTitle(), pw);
    return startSync(cfg, pw, key, salt);
  }).then(function(){
    return showCode(true);
  });
}

/* ---------- the invitation code ---------- */
/* The code is inert without the password, so the two must not travel in the
   same message. The dialog says so once, plainly, instead of hoping. */
function codeOneMessage(){ return lsGet('billing-tool.onecode') === '1'; }

function showCode(fresh){
  if(!syncCfg || !syncPw) return Promise.resolve();
  var one = codeOneMessage();
  return Sync.makeCode(syncCfg, syncPw, one).then(function(code){
    dlgOpen(t(fresh ? 'code.title.new' : 'code.title'), function(b){
      note(b, t(one ? 'code.intro.one' : 'code.intro'));

      var ta = field(b, t('code.field'), {area:true, value:code, mono:true, ro:true});
      sendCopyRow(b, code, t('code.field'));

      if(!one){
        var pw = field(b, t('code.pw.field'), {value:syncPw, mono:true, ro:true});
        sendCopyRow(b, syncPw, t('code.pw.field'));
      }
      note(b, t(one ? 'code.warn.one' : 'code.warn'), 'warnp');

      var sw = el('button','linkbtn', t(one ? 'code.split' : 'code.merge'));
      sw.addEventListener('click', function(){
        lsSet('billing-tool.onecode', one ? '0' : '1');
        dlgClose();
        showCode(fresh);
      });
      b.appendChild(sw);
    }, [
      { label: t('btn.close'), act:'close', onClick: dlgClose },
    ]);
  });
}

/* Send and copy, right under the thing they act on — the code and the password
   are meant to travel apart, so one shared pair of buttons at the bottom was
   the wrong shape. */
function sendCopyRow(parent, text, what){
  var row = el('div','sendrow');

  var send = el('button','btn sm', t('code.share'));
  send.dataset.b = 'send';
  send.addEventListener('click', function(){ shareText(text, what); });
  row.appendChild(send);

  var copy = el('button','btn sm primary', t('code.copy'));
  copy.dataset.b = 'copy';
  copy.addEventListener('click', function(){ copyText(text); });
  row.appendChild(copy);

  parent.appendChild(row);
}

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(t('raw.copied'), true); },
                                            function(){ copyFallback(text); });
    return;
  }
  copyFallback(text);
}
/* execCommand needs a real selection in the document to work at all */
function copyFallback(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly','');
  ta.style.position = 'fixed'; ta.style.top = '-1000px';
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, text.length);
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  ta.remove();
  toast(ok ? t('raw.copied') : t('raw.copyfail'));
}

/* navigator.share only exists on phones and in a few desktop builds, and it
   rejects for reasons worth telling the user about. Swallowing that was why
   "Send" looked like it did nothing at all. */
function shareText(text, what){
  if(navigator.share){
    navigator.share({ title: sheetTitle() + ' — ' + what, text: text })
      .then(function(){ toast(t('code.sent'), true); })
      .catch(function(err){
        if(err && err.name === 'AbortError') return;      /* user closed it */
        copyText(text);
        toast(t('code.nosharefell'));
      });
    return;
  }
  copyText(text);
  toast(t('code.noshare'));
}

/* ---------- open a shared sheet ---------- */
/* Three ways in, in the order they are actually used: a sheet this device
   already knows, an invitation code somebody sent, or — with neither — the
   location typed by hand. None of them ever puts a path on screen. */
function openShared(){
  /* Switching sheets is not obviously destructive — the current one stays on
     the server — but it does clear the screen, so it gets asked once. */
  if(syncCfg && !confirm(t('confirm.switchshared'))) return;
  var codeIn, pwIn;
  dlgOpen(t('open.title'), function(b){
    var list = knownShared();
    if(list.length){
      note(b, t('open.known'));
      var box = el('div','sheetlist');
      list.forEach(function(item){
        var row = el('button','sheetitem');
        row.appendChild(el('span','nm', item.title || t('open.untitled')));
        row.addEventListener('click', function(){
          dlgClose();
          openKnown(item);
        });
        box.appendChild(row);
      });
      b.appendChild(box);
    }
    note(b, t('open.paste'));
    codeIn = field(b, t('open.field'), {area:true, ph:Sync.CODE_PREFIX + '…', mono:true});
    pwIn = field(b, t('open.pw'), {ph:t('open.pw.ph'), mono:true});
    /* A code that brings its own password must not also ask for one — the
       field disappears as soon as such a code is pasted. */
    var syncPwField = function(){
      var self = Sync.codeIsSelfContained(codeIn.value);
      pwIn._wrap.hidden = self && !!String(codeIn.value||'').trim();
    };
    codeIn.addEventListener('input', syncPwField);
    codeIn.addEventListener('paste', function(){ setTimeout(syncPwField, 0); });
    syncPwField();
  }, [
    { label: t('btn.cancel'), act:'cancel', onClick: dlgClose },
    { label: t('open.manual'), act:'manual', onClick: function(){ dlgClose(); openManual(); } },
    { label: t('open.go'), act:'go', primary: true, onClick: function(){
        var v = String(codeIn.value||'').trim();
        var pw = String(pwIn.value||'').trim();
        if(!v){ codeIn.focus(); return; }
        if(!Sync.codeIsSelfContained(v) && !pw){ toast(t('open.needpw')); pwIn.focus(); return; }
        dlgClose(); adoptCode(v, pw);
      } },
  ]);
}

function openKnown(item){
  var cfg = { owner:item.owner, repo:item.repo, path:item.path, token:item.token };
  loadSheet(cfg, item.pw);
}

/* The route for a device that was sent nothing at all. It asks for as little
   as it can: the repository is prefilled, so in the normal case the only thing
   to type is the token — and the password is asked for once, for the one sheet
   that was actually picked. */
function openManual(){
  var sf;
  var known = storedStore();
  dlgOpen(t('manual.title'), function(b){
    note(b, t('manual.intro'));
    sf = storeFields(b, known);
  }, [
    { label: t('btn.cancel'), act:'cancel', onClick: dlgClose },
    { label: t('manual.go'), act:'go', primary: true, onClick: function(){
        var st = readStoreFields(sf);
        if(!st) return;
        dlgClose();
        browseRepo(st);
      } },
  ]);
}

/* Read the whole shelf: every file with its sha, its raw text and the title
   that is stored in the clear. Used both for browsing and for spotting a name
   that is already taken. */
function readShelf(base){
  return Sync.ghList(base, 'sheets').then(function(paths){
    var items = [];
    return paths.reduce(function(chain, path){
      return chain.then(function(){
        var cfg = {owner:base.owner, repo:base.repo, path:path, token:base.token};
        return Sync.ghGet(cfg).then(function(r){
          if(!r.missing) items.push({cfg:cfg, sha:r.sha, text:r.text, label:Sync.labelOf(r.text)});
        }, function(){});
      });
    }, Promise.resolve()).then(function(){ return items; });
  });
}
function sameName(a, b){
  return String(a||'').trim().toLowerCase() === String(b||'').trim().toLowerCase();
}

/* List what is in the repository and offer it by name. The names are readable
   because they are stored in the clear beside the ciphertext; everything else
   about a sheet stays sealed until its password is given. */
function browseRepo(base){
  toast(t('sync.state.busy'), true);
  readShelf(base).then(function(items){
    if(!items.length) throw new Error('empty');
    showShelf(base, items);
  }).catch(function(e){
    var msg = (e && e.message === 'empty') ? t('manual.none')
            : (e && (e.status === 401 || e.status === 403)) ? t('share.err.auth')
            : (e && e.status === 404) ? t('share.err.404')
            : ((e && e.message) || 'error');
    alert(t('manual.err.head') + '\n\n' + msg);
  });
}

function showShelf(base, items){
  dlgOpen(t('manual.pick'), function(b){
    note(b, t('manual.pick.intro'));
    var box = el('div','sheetlist');
    items.forEach(function(it){
      var row = el('div','sheetrow');
      var open = el('button','sheetitem');
      open.appendChild(el('span','nm', it.label || t('open.untitled')));
      open.addEventListener('click', function(){ dlgClose(); askPasswordFor(it); });
      row.appendChild(open);
      /* Deleting needs no password, and pretending otherwise would be a lie:
         anyone holding the token can delete any file in this repository from a
         command line regardless. What the button adds is the confirmation. */
      var del = el('button','sheetdel','×');
      del.title = t('shelf.delete');
      del.setAttribute('aria-label', t('shelf.delete'));
      del.addEventListener('click', function(){
        if(!confirm(t('shelf.delete.confirm', it.label || t('open.untitled')))) return;
        dlgClose();
        toast(t('sync.state.busy'), true);
        /* Leave the sheet FIRST. Doing it afterwards left a window in which
           this device's own exchange — already under way — wrote the file
           straight back, and the sheet reappeared seconds after being
           deleted. */
        if(syncCfg && syncCfg.path === it.cfg.path) stopSync();
        forgetShared(it.cfg.path);
        Sync.ghDelete(it.cfg, it.sha, 'billing-tool: remove sheet').then(function(res){
          if(res.conflict) throw new Error('conflict');
          toast(t('shelf.deleted', it.label || t('open.untitled')));
          return readShelf(base).then(function(rest){
            if(rest.length) showShelf(base, rest);
          });
        }).catch(function(e){
          alert(t('shelf.delete.failed') + '\n\n' + ((e && e.message) || 'error'));
        });
      });
      row.appendChild(del);
      box.appendChild(row);
    });
    b.appendChild(box);
  }, [{ label: t('btn.close'), act:'cancel', onClick: dlgClose }]);
}

function askPasswordFor(it){
  var pwIn;
  dlgOpen(it.label || t('open.untitled'), function(b){
    note(b, t('manual.pw.intro'));
    pwIn = field(b, t('open.pw'), {ph:t('open.pw.ph'), mono:true});
  }, [
    { label: t('btn.cancel'), act:'cancel', onClick: dlgClose },
    { label: t('open.go'), act:'go', primary: true, onClick: function(){
        var pw = String(pwIn.value||'').trim();
        if(!pw){ toast(t('open.needpw')); pwIn.focus(); return; }
        dlgClose();
        toast(t('sync.state.busy'), true);
        Sync.openSealed(pw, it.text).then(function(o){
          return applyOpened({cfg:it.cfg, sha:it.sha, o:o}, pw);
        }).catch(reportOpenError);
      } },
  ]);
}

function applyOpened(f, pw){
  storeStore(f.cfg.owner + '/' + f.cfg.repo, f.cfg.token);
  adopt(fromWire(f.o.data));
  carryChoice = 'keep';
  syncSha = f.sha;
  rememberShared(f.cfg, (f.o.data && f.o.data.title) || '', pw);
  renderAll();
  lsSet(STORE_KEY, JSON.stringify(state));
  return startSync(f.cfg, pw, f.o.key, f.o.salt).then(function(){
    toast(t('open.ok', nPeople(state.people.length), nExpenses(state.expenses.length)));
  });
}

function adoptCode(code, pw){
  toast(t('sync.state.busy'), true);
  Sync.parseCode(code, pw).then(function(cfg){
    return loadSheet({owner:cfg.owner, repo:cfg.repo, path:cfg.path, token:cfg.token},
                     cfg.password);
  }).catch(function(e){
    reportOpenError(e);
  });
}

function loadSheet(cfg, pw){
  toast(t('sync.state.busy'), true);
  return Sync.ghGet(cfg).then(function(r){
    if(r.missing) throw new Error('gone');
    return Sync.openSealed(pw, r.text).then(function(o){
      return applyOpened({cfg:cfg, sha:r.sha, o:o}, pw);
    });
  }).catch(reportOpenError);
}

function reportOpenError(e){
  var m = e && e.message;
  var msg = (m === 'gone') ? t('open.err.gone')
          : (m === 'wrong-password') ? t('open.err.pw')
          : (m === 'bad-prefix' || m === 'bad-code') ? t('open.badcode')
          : (e && (e.status === 401 || e.status === 403)) ? t('share.err.auth')
          : (e && e.status === 404) ? t('share.err.404')
          : (m || 'error');
  alert(t('open.err.head') + '\n\n' + msg);
}

/* ---------- where to save / where to open ---------- */
function askSaveTarget(saveLocal){
  dlgOpen(t('where.save.title'), function(b){
    note(b, t('where.save.intro'));
  }, [
    { label: t('btn.cancel'), act:'cancel', onClick: dlgClose },
    { label: t('where.local'), act:'local', onClick: function(){ dlgClose(); saveLocal(); } },
    { label: t('where.shared'), act:'shared', primary: true, onClick: function(){ dlgClose(); shareSetup(); } },
  ]);
}
function askOpenTarget(){
  dlgOpen(t('where.open.title'), function(b){
    note(b, t('where.open.intro'));
  }, [
    { label: t('btn.cancel'), act:'cancel', onClick: dlgClose },
    { label: t('where.local'), act:'local', onClick: function(){ dlgClose(); $('fileInput').click(); } },
    { label: t('where.shared'), act:'shared', primary: true, onClick: function(){ dlgClose(); openShared(); } },
  ]);
}

$('shareClose').addEventListener('click', dlgClose);
$('shareDlg').addEventListener('click', function(e){ if(e.target === $('shareDlg')) dlgClose(); });
$('syncBtn').addEventListener('click', function(){ syncNow(); });
window.addEventListener('focus', function(){ if(syncCfg) syncNow(); });

/* resume a shared sheet after a reload */
(function resumeSync(){
  var raw = lsGet(SYNC_KEY);
  if(!raw) return;
  var box;
  try{ box = JSON.parse(raw); }catch(e){ return; }
  if(!box || !box.cfg || !box.cfg.token || !box.pw) return;
  startSync(box.cfg, box.pw);
})();

/* ---------------- language ---------------- */
function setLang(next, announce){
  lang = next;
  try{ localStorage.setItem('billing-tool.lang', lang); }catch(e){}
  /* an arrow in front, so the code reads as "switch to" rather than as a badge
     saying which language is on */
  setTextArrows($('langLbl'), '\u2192' + (lang === 'de' ? 'EN' : 'DE'));
  applyStaticI18n();
  /* the menu entry and the install hint are written by script, so they only
     follow the language if we redraw them here */
  if(isNativeShell){
    var ub = document.querySelector('#menu [data-act="update"]');
    if(ub) ub.textContent = t('menu.update.native');
  }
  if(!$('installHelp').hidden) $('installHelpTxt').innerHTML = installHelpHtml();
  $('verMode').textContent = t(isNativeShell ? 'mode.native'
    : (isStandalone ? 'mode.installed' : 'mode.browser'));
  renderAll();
  if(announce) toast(lang === 'de' ? 'Sprache: Deutsch' : 'Language: English', true);
}

/* turning the phone changes which layout is in force, and the rail has to be
   put away or set up again accordingly */
if(PHONE_MQ && PHONE_MQ.addEventListener){
  PHONE_MQ.addEventListener('change', function(){
    if(state){ renderTable(); renderResults(); }
  });
}

lang = pickLang();

$('langBtn').addEventListener('click', function(){
  setLang(lang === 'de' ? 'en' : 'de', true);
});

/* go */
initMenu();
if(isNativeShell){
  var updBtn = document.querySelector('#menu [data-act="update"]');
  if(updBtn) updBtn.textContent = 'ℹ️ About updating this app';
  /* there is only one copy of the data in a packaged app */
  var bn = $('browserNote'); if(bn) bn.hidden = true;
}

/* The inset is only readable once the document is laid out, so this waits. */
(function safeArea(){
  function apply(){
    if(isNativeShell){
      document.body.classList.add('native');
      /* sticky is unreliable in an Android WebView; fixed is not */
      document.body.classList.add('fixedhead');
    }
    applyTopGap();
    var menuItem = document.querySelector('#menu [data-act="topgap"]');
    if(menuItem) menuItem.hidden = !(isNativeShell || isStandalone);
  }
  if(document.readyState === 'complete') apply();
  else window.addEventListener('load', apply);
  window.addEventListener('orientationchange', function(){ setTimeout(applyTopGap, 250); });
})();

/* Correcting the gap by hand. It exists because the automatic answer is a
   guess on any device that reports no inset, and a guess that cannot be
   corrected is just a bug with a nicer name. */
function topGapDialog(){
  var current = applyTopGap();
  var preview = current;
  var out;
  function show(){
    document.documentElement.style.setProperty('--top-pad', preview + 'px');
    out.textContent = preview + ' px';
  }
  dlgOpen(t('topgap.title'), function(b){
    note(b, t('topgap.intro'));
    var row = el('div','gaprow');
    var less = el('button','btn', '−8');
    less.addEventListener('click', function(){ preview = Math.max(0, preview - 8); show(); });
    var more = el('button','btn', '+8');
    more.addEventListener('click', function(){ preview = Math.min(160, preview + 8); show(); });
    out = el('span','gapval', preview + ' px');
    row.appendChild(less); row.appendChild(out); row.appendChild(more);
    b.appendChild(row);
    note(b, t('topgap.measured', measuredInsetTop(),
                overlayOff ? t('topgap.overlay.off') : t('topgap.overlay.on'),
                autoTopGap()));
  }, [
    { label: t('topgap.auto'), act:'auto', onClick: function(){
        try{ localStorage.removeItem('billing-tool.topgap'); }catch(e){}
        preview = applyTopGap(); show();
      } },
    { label: t('btn.close'), act:'close', onClick: function(){
        try{ localStorage.setItem('billing-tool.topgap', String(preview)); }catch(e){}
        applyTopGap(); dlgClose();
      } },
  ]);
}
state = load();
restoreCardView();
/* a stored sheet that has entries but lost its name is exactly the ambiguous
   case — ask rather than silently adopt it under whatever name is typed next */
if(!(state.title || '').trim() && countData() > 0) carryChoice = null;
/* setLang paints the static labels and then renders, so it replaces the
   first renderAll() — it must run after the state exists, not before */
setLang(lang, false);
/* focus follows what the sheet still needs */
if(!(state.title || '').trim()){ $('tripTitle').focus(); }
else if(!state.people.length && !state.expenses.length){
  var np1 = $('newPerson'); if(np1) np1.focus();
}
if(memoryOnly){
  setTimeout(function(){ toast(t('nostorage')); }, 800);
}
})();
</script>
