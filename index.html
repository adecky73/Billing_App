<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15803d">
<meta name="description" content="Split shared expenses and settle up with the fewest transfers.">
<title>Billing Tool</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Billing Tool">
<style>
/* ============================================================
   Billing Tool — Material 3 styling.

   Colour, shape and type follow Android's current design system:
   tonal surfaces instead of drop shadows, pill-shaped buttons,
   16/28px corner radii, Roboto, 48dp touch targets.

   Where the browser supports the CSS system colour keywords
   (Firefox does), the app picks up the phone's own accent colour
   instead of the built-in indigo.
   ============================================================ */

:root{
  color-scheme: light dark;

  --primary:#4f46e5;
  --on-primary:#ffffff;
  --primary-c:#e3e0ff;
  --on-primary-c:#181479;
  --focus:#4f46e5;

  --surface:#fdfbff;
  --surface-1:#f5f2fa;
  --surface-2:#efecf5;
  --surface-3:#e9e6f0;
  --on-surface:#1b1b21;
  --on-surface-var:#48464f;
  --outline:#79767f;
  --outline-var:#cac5d0;
  --row-line:#948f9e;
  --me:#8c1220;

  --success:#0f6b3c;
  --success-c:#9df6c1;
  --on-success-c:#00210f;
  --error:#ba1a1a;
  --error-c:#ffdad6;
  --on-error-c:#410002;
  --warn:#7a5900;
  --warn-c:#ffdf9e;
  --on-warn-c:#261a00;
  /* messages: a light blue that no card, button or banner uses, so a message
     never reads as part of the page behind it */
  --note-c:#cfe4f7;
  --on-note-c:#0b2b47;
  --note-line:#7fb3dc;
  /* the card in focus while swiping: a blue of its own, lighter than a
     message so a message still sits clearly on top of it */
  --card-f:#e2eefb;
  --card-f-line:#6ea9d8;
  /* the cards behind it: the same blue a step deeper, so the stack reads as
     one stack and the card in focus as the lit one */
  --card-back:#c2d8ee;
  --card-back-line:#9dbcd8;
  /* the ways of paying, wherever they appear: a warm ground that belongs to
     none of the other states in the sheet */
  --pay-c:#ffe2c2;
  --pay-line:#dd9c55;
  --on-pay-c:#5a3306;
  /* the swipe symbol is the one warm accent in the header */
  --swipe:#c25706;

  --r-xs:4px; --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:28px; --r-full:999px;
  --e1:0 1px 2px rgba(0,0,0,.14), 0 1px 3px 1px rgba(0,0,0,.08);
  --e2:0 1px 2px rgba(0,0,0,.16), 0 2px 6px 2px rgba(0,0,0,.10);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --primary:#c3c0ff;
    --on-primary:#1b1178;
    --primary-c:#3b32a0;
    --on-primary-c:#e3e0ff;
    --focus:#c3c0ff;

    --surface:#131318;
    --surface-1:#1b1b21;
    --surface-2:#201f26;
    --surface-3:#2b2a31;
    --on-surface:#e5e1e9;
    --on-surface-var:#c9c5d0;
    --outline:#938f99;
    --outline-var:#48464f;
    --row-line:#5f5c6b;
    --me:#ff9aa2;

    --success:#83d9a4;
    --success-c:#00522a;
    --on-success-c:#9df6c1;
    --error:#ffb4ab;
    --error-c:#93000a;
    --on-error-c:#ffdad6;
    --warn:#f2c04b;
    --warn-c:#5c4200;
    --on-warn-c:#ffdf9e;
    --note-c:#123449;
    --on-note-c:#cfe4f7;
    --card-f:#173343;
    --card-f-line:#4d86ad;
    --card-back:#0f2635;
    --card-back-line:#2c5670;
    --pay-c:#3d2a14;
    --pay-line:#9a6a35;
    --on-pay-c:#ffd7a8;
    --swipe:#ffb072;
    --note-line:#3f7ba8;
    --e1:0 1px 2px rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.3);
    --e2:0 1px 2px rgba(0,0,0,.55), 0 2px 6px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --primary:#c3c0ff;
  --on-primary:#1b1178;
  --primary-c:#3b32a0;
  --on-primary-c:#e3e0ff;
  --focus:#c3c0ff;

  --surface:#131318;
  --surface-1:#1b1b21;
  --surface-2:#201f26;
  --surface-3:#2b2a31;
  --on-surface:#e5e1e9;
  --on-surface-var:#c9c5d0;
  --outline:#938f99;
  --outline-var:#48464f;
  --row-line:#5f5c6b;
  --me:#ff9aa2;

  --success:#83d9a4;
  --success-c:#00522a;
  --on-success-c:#9df6c1;
  --error:#ffb4ab;
  --error-c:#93000a;
  --on-error-c:#ffdad6;
  --warn:#f2c04b;
  --warn-c:#5c4200;
  --on-warn-c:#ffdf9e;
  --note-c:#123449;
  --on-note-c:#cfe4f7;
  --card-f:#173343;
  --card-f-line:#4d86ad;
  --card-back:#0f2635;
  --card-back-line:#2c5670;
  --pay-c:#3d2a14;
  --pay-line:#9a6a35;
  --on-pay-c:#ffd7a8;
  --swipe:#ffb072;
  --note-line:#3f7ba8;
  --e1:0 1px 2px rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.3);
  --e2:0 1px 2px rgba(0,0,0,.55), 0 2px 6px 2px rgba(0,0,0,.35);
}

/* Adopt the phone's own accent colour where the browser exposes it, and
   derive the matching container tints from it. Both features are needed;
   without color-mix the derived tints would clash with a custom accent. */
@supports (color: AccentColor) and (background: color-mix(in srgb, red 10%, white)){
  :root{
    --primary: AccentColor;
    --on-primary: AccentColorText;
    /* The accent is only ever a *tint* here: 16% in container fills, 30% in the
       text on them. Mixing the rest from the surface / on-surface pair keeps the
       contrast above 6:1 for every possible accent, including pure white and
       pure black — a naive 70% mix drops to 2.4:1 on a yellow accent. */
    --primary-c: color-mix(in srgb, AccentColor 16%, var(--surface));
    --on-primary-c: color-mix(in srgb, AccentColor 30%, var(--on-surface));
    --focus: color-mix(in srgb, AccentColor 55%, var(--on-surface));
  }
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--surface); color:var(--on-surface);
  font:400 15px/1.45 Roboto, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-tap-highlight-color:transparent;
}
.wrap{
  max-width:1120px;margin:0 auto;
  padding-top:0;
  padding-right:calc(16px + env(safe-area-inset-right, 0px));
  padding-bottom:72px;
  padding-left:calc(16px + env(safe-area-inset-left, 0px));
}
/* WebViews that report no inset but still draw under the status bar */

h1,h2,h3{margin:0;font-weight:500;letter-spacing:0}
button{font:inherit;color:inherit}
input,select{font:inherit;color:inherit}
::placeholder{color:var(--on-surface-var);opacity:.7}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}

/* ---------- top app bar ---------- */
/* Sticky, and no taller than it needs to be: on a phone this bar was eating
   the first sixth of the screen and then scrolling away just when the menu was
   wanted. The status-bar inset is carried by the bar itself now, not by the
   page, so nothing sits under the clock and the battery. */
header.top{
  position:sticky;top:0;z-index:160;   /* above the fixed sync bar */
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  /* Negative margins that exactly cancel the page padding, so the bar's
     background reaches the edges without creating a wider box than the page. */
  margin:0 calc(-16px - env(safe-area-inset-right, 0px)) 0 calc(-16px - env(safe-area-inset-left, 0px));
  /* One number, worked out in script and written into --top-pad: the measured
     status-bar inset where the WebView reports one, a fallback where it does
     not, and whatever the user set by hand if they had to correct it. CSS
     cannot tell those three apart. */
  padding:var(--top-pad, 6px)
          calc(16px + env(safe-area-inset-right, 0px)) 8px
          calc(16px + env(safe-area-inset-left, 0px));
  min-height:0;
  background:var(--surface);
}

/* An Android WebView does not keep a sticky header put — it works everywhere
   else, including a phone browser, but not there. `fixed` has none of sticky's
   containing-block subtleties, so the packaged app uses that instead and the
   page reserves the height it takes (--head-h, measured in script, because the
   bar grows a line when the sheet name is long). */
body.fixedhead header.top{
  position:fixed;top:0;left:0;right:0;margin:0;
  padding-left:calc(16px + env(safe-area-inset-left, 0px));
  padding-right:calc(16px + env(safe-area-inset-right, 0px));
}
body.fixedhead .wrap{padding-top:var(--head-h, 64px)}
@media (max-width:700px){
  body.fixedhead header.top{
    padding-left:calc(12px + env(safe-area-inset-left, 0px));
    padding-right:calc(12px + env(safe-area-inset-right, 0px));
  }
}
@media print{ body.fixedhead header.top{position:static} body.fixedhead .wrap{padding-top:0} }
/* Three cases in the packaged app, most specific last:
   - a WebView that reports the inset correctly: inset + breathing room
   - one that reports none but still draws under the status bar: fixed 34px
   - the status bar hidden altogether: no bar to clear, but the mark still
     needs a margin or it sits flush against the top edge */
/* The name takes the room it needs; when that leaves too little for the
   buttons, they wrap onto a second line and stay right-aligned there. The
   switch is thrown from script, which can measure what CSS cannot. */
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto}
header.top.stacked .brand{flex:1 1 100%}
header.top.stacked #tripTitle{flex:1 1 auto}
.logo{width:44px;height:44px;flex:none;display:block}
.logo svg{display:block;width:100%;height:100%}
#tripTitle{
  font-size:22px;font-weight:400;letter-spacing:0;line-height:1.25;
  background:transparent;border:none;border-radius:var(--r-s);
  padding:4px 8px;min-width:0;flex:0 1 auto;width:auto;max-width:100%;
  /* a textarea that behaves like a heading: no handle, no scrollbar, and it
     breaks between words rather than mid-word */
  resize:none;overflow:hidden;font-family:inherit;display:block;
  overflow-wrap:break-word;word-break:normal;
}
#langLbl{white-space:nowrap;letter-spacing:.02em}
#tripTitle:hover{background:var(--surface-2)}
#tripTitle:focus{outline:2px solid var(--focus);outline-offset:-2px;background:var(--surface-1)}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- buttons ---------- */
.btn{
  border:none;background:var(--surface-2);color:var(--on-surface);
  border-radius:var(--r-full);min-height:40px;padding:0 16px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:14px;font-weight:500;letter-spacing:.01em;cursor:pointer;
  transition:background .15s, box-shadow .15s;white-space:nowrap;
}
.btn:hover{background:var(--surface-3)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn:active{background:var(--outline-var)}
/* Material 3 "filled tonal" button. Deliberately NOT a raw accent fill: with a
   system accent we cannot guarantee the contrast of accent-vs-AccentColorText,
   whereas this tonal pair measures at least 6.2:1 for any accent whatsoever. */
.btn.primary{background:var(--primary-c);color:var(--on-primary-c);box-shadow:none}
.btn.primary:hover{background:var(--primary-c);box-shadow:var(--e1)}
.btn.primary:active{box-shadow:none}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.icon{width:40px;padding:0;border-radius:var(--r-full)}
#langBtn{min-width:44px;padding:0 10px;font-weight:650;letter-spacing:.03em}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}

/* ---------- cards ---------- */
.card{
  background:var(--surface-1);border:none;border-radius:var(--r-xl);
  margin-bottom:12px;overflow:hidden;
}
.card > .card-h{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:16px 20px 8px;
}
.card-h h2{
  font-size:16px;font-weight:500;letter-spacing:.01em;color:var(--on-surface);
  text-transform:none;
}
.card-h .spacer{margin-left:auto}
.card-b{padding:8px 20px 16px}

/* ---------- people ---------- */
/* One person, one line. The names used to wrap like tags, which was tidy until
   every person carried two addresses as well — then a row is the only shape
   that lets the eye run down the column and see who can be paid. */
.people{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.chip{
  display:flex;align-items:center;gap:6px;
  border:1px solid var(--outline-var);background:transparent;
  border-radius:var(--r-s);min-height:44px;padding:0 6px 0 14px;
  transition:background .15s;
}
/* the name takes what is left, the addresses and the delete button do not move */
.chip > input{flex:1 1 auto;min-width:60px}
.payset{display:flex;align-items:center;gap:6px;margin-left:auto;flex:0 0 auto}
.paybtn{
  display:inline-flex;align-items:center;gap:5px;position:relative;
  border:1px solid var(--pay-line);background:var(--pay-c);
  color:var(--on-pay-c);border-radius:var(--r-full);
  padding:0 12px;min-height:32px;font:inherit;font-size:12.5px;font-weight:500;
  letter-spacing:.02em;cursor:pointer;white-space:nowrap;
  transition:background .15s, opacity .15s;
}
.paybtn:hover{filter:brightness(.96)}
.chip .x[hidden]{display:none}
.mebtn:disabled,.pickme:disabled{opacity:.5;cursor:default}
.paybtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* Filled in: the button steps back and wears a tick. Half transparent says
   "nothing to do here"; the tick says why. */
.paybtn.filled{opacity:.55;border-color:var(--success)}
.paybtn.filled:hover{opacity:.85}
.paytick{width:15px;height:15px;color:var(--success);flex:0 0 auto;display:block}
@media (prefers-color-scheme: dark){.paytick{color:var(--success)}}
.chip:hover{background:var(--surface-2)}
/* the width is measured in script; the cap only stops one very long name from
   taking a whole line on a phone */
.chip input{
  background:transparent;border:none;width:auto;min-width:44px;max-width:min(100%, 280px);
  font-size:14px;font-weight:500;padding:2px;border-radius:var(--r-xs);
}
.chip input:focus{outline:2px solid var(--focus);outline-offset:1px}
/* a confirmed sheet fixes the names: grey, and they say why when tapped */
.chip input[readonly]{color:var(--on-surface-var);opacity:.7;cursor:default}
/* no new people while the sheet is confirmed either */
.addperson.shut{opacity:.5}
.addperson.shut input{cursor:default}
.chip .x{
  border:none;background:transparent;cursor:pointer;color:var(--on-surface-var);
  width:32px;height:32px;border-radius:var(--r-full);
  display:grid;place-items:center;font-size:18px;line-height:1;
}
.chip .x:hover{background:var(--error-c);color:var(--on-error-c)}
/* Field and button are one control: the border belongs to the wrapper, the
   button sits inside it at the right edge. */
.addperson{
  display:inline-flex;align-items:center;gap:4px;
  border:1px dashed var(--outline);border-radius:var(--r-full);
  background:transparent;padding:3px 3px 3px 14px;min-height:40px;
}
.addperson:focus-within{border:2px solid var(--focus);padding:2px 2px 2px 13px}
#newPerson{
  border:none;background:transparent;color:var(--on-surface);outline:none;
  padding:0;min-width:0;width:9.5em;font-size:14px;
}
.addperson .addbtn{
  flex:none;min-height:32px;height:32px;width:32px;padding:0;
  border-radius:var(--r-full);font-size:19px;line-height:1;font-weight:400;
  background:var(--primary-c);color:var(--on-primary-c);
}
.addperson .addbtn:hover{filter:brightness(.95)}

/* ---------- expense table ---------- */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:660px}
th,td{padding:6px 10px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--outline-var)}
thead th{
  position:sticky;top:0;z-index:2;background:var(--surface-1);
  font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;
  color:var(--on-surface-var);white-space:nowrap;padding-top:10px;padding-bottom:10px;
}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
tbody tr.unassigned{background:var(--warn-c);color:var(--on-warn-c)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
th.share,td.share{text-align:center;padding:4px}
th.share{cursor:pointer;border-radius:var(--r-s) var(--r-s) 0 0}
th.share:hover{background:var(--surface-2)}
th.share .pname{display:block;max-width:96px;overflow:hidden;text-overflow:ellipsis}

td.desc input,td.amt input{
  width:100%;background:transparent;border:1px solid transparent;
  border-radius:var(--r-xs);padding:9px 10px;font-size:14px;
}
td.amt input{text-align:right;font-variant-numeric:tabular-nums}
/* the desktop table has a column heading for this, so the box and its currency
   step out of the way entirely */
.amtbox{display:contents}
td.amt .cur{display:none}
td.desc input:hover,td.amt input:hover{background:var(--surface-2)}
td.desc input:focus,td.amt input:focus{
  outline:none;border-color:var(--focus);background:var(--surface);
  box-shadow:0 0 0 1px var(--focus);
}
td.payer select{
  width:100%;background:transparent;border:1px solid transparent;
  border-radius:var(--r-xs);padding:9px 6px;font-size:14px;font-weight:500;cursor:pointer;
}
td.payer select:hover{background:var(--surface-2)}
td.payer select:focus{outline:2px solid var(--focus);outline-offset:-2px}
td.payer select.empty{color:var(--error);font-weight:400}

.sharebtn{
  width:40px;height:40px;border-radius:var(--r-full);
  border:1px solid var(--outline-var);background:transparent;
  cursor:pointer;color:var(--on-surface-var);font-weight:500;font-size:13px;
  display:inline-grid;place-items:center;transition:background .12s,border-color .12s;
}
.sharebtn:hover{background:var(--surface-2)}
.sharebtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sharebtn[data-n="0"]{opacity:.55}
/* One share vs. several: told apart by the ring and the label, not by fill
   strength — two tints of an arbitrary system accent can be indistinguishable. */
.sharebtn[data-n="1"]{background:var(--primary-c);border-color:transparent;color:var(--on-primary-c)}
.sharebtn[data-n="2"],.sharebtn.multi{
  background:var(--primary-c);color:var(--on-primary-c);
  border:2px solid var(--focus);font-weight:700;
}
/* ---------- exact amounts (opt-in, one row at a time) ---------- */
td.rowtools{white-space:nowrap;text-align:right}
/* A pill with a visible edge: the previous borderless glyph was invisible as
   a control unless you already knew it was one (or hovered for the tooltip). */
.rowex{
  border:1px solid var(--outline-var);background:transparent;cursor:pointer;
  color:var(--on-surface-var);min-width:44px;height:34px;padding:0 10px;
  border-radius:var(--r-full);
  font-size:14px;font-weight:650;line-height:1;letter-spacing:.02em;
}
.rowex:hover{background:var(--surface-2)}
.rowex.on{color:var(--on-primary-c);background:var(--primary-c);border-color:transparent}
.rowex.active{border-color:var(--focus)}
/* Nothing left to share in: a red cross rather than a grey dash, so it is
   read as "this person is out" and not as an empty cell. No opacity here —
   a washed-out red stops reading as red at all. */
.sharebtn.spent{
  cursor:not-allowed;border-style:dashed;border-color:var(--error);
  background:transparent;color:var(--error);font-size:16px;font-weight:600;
}
.sharebtn.fixed{
  width:auto;min-width:56px;padding:0 10px;font-size:12.5px;
  background:var(--primary-c);color:var(--on-primary-c);border-color:transparent;
  font-variant-numeric:tabular-nums;
}
tr.exactrow td{background:var(--surface-2);border-bottom:1px solid var(--outline-var);padding:0}
tr.exactrow:hover td{background:var(--surface-2)}
.exact{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.exact-h{font-size:13px;color:var(--on-surface-var)}
.exact-grid{display:flex;flex-wrap:wrap;gap:8px}
.exact-cell{
  display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--outline-var);border-radius:var(--r-s);padding:4px 8px 4px 12px;
}
.exact-nm{font-size:12px;font-weight:500;color:var(--on-surface-var);
  max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exact-cell input{
  width:92px;border:none;background:transparent;text-align:right;
  font-variant-numeric:tabular-nums;padding:6px 2px;font-size:14px;
}
.exact-cell input:focus{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-xs)}
/* The one figure in the sheet that writes itself: the rest, on whoever paid.
   It blinks for as long as it is the app's number rather than the user's —
   typing over it stops both the blinking and the guessing. */
@keyframes restblink{
  0%,100%{background:transparent;color:var(--on-surface)}
  50%{background:var(--pay-c);color:var(--on-pay-c)}
}
.exact-cell input.auto{
  animation:restblink 1.5s ease-in-out infinite;
  border-radius:var(--r-xs);font-weight:600;
}
@media (prefers-reduced-motion: reduce){
  /* still marked, just not moving */
  .exact-cell input.auto{
    animation:none;background:var(--pay-c);color:var(--on-pay-c);
  }
}

/* ---------- an expense and its open strip are one block ----------
   On a desktop the two are ordinary table rows, and nothing said they belonged
   together. A frame around both does. */
@media (min-width:701px){
  tbody tr.hasexact > td{
    background:var(--card-f);
    border-top:2px solid var(--card-f-line);border-bottom:none;
  }
  /* The first and last cells of a row are the running number and the folded
     line, and neither is displayed on a wide screen — a border on them is a
     border on nothing, which is what left the corner open. The frame goes on
     the first and last cells that are actually there. */
  tbody tr.hasexact > td.payer{border-left:2px solid var(--card-f-line)}
  tbody tr.hasexact > td.rowtools{border-right:2px solid var(--card-f-line)}
  tbody tr.exactrow > td{
    background:var(--card-f);
    border:2px solid var(--card-f-line);border-top:none;
  }
  tbody tr.hasexact:hover > td,tbody tr.exactrow:hover > td{background:var(--card-f)}
  /* a warning outranks the frame's colour, on both halves of it */
  tbody tr.hasexact.unassigned > td,tbody tr.exactrow.unassigned > td{
    background:var(--warn-c);
  }
}
.exact-cell input:disabled{opacity:.45;cursor:not-allowed}
.exact-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.exact-note{flex:1;font-size:13px;color:var(--on-surface-var);font-variant-numeric:tabular-nums}
.exact-note.bad{color:var(--error);font-weight:500}

.rowdel{
  border:none;background:transparent;cursor:pointer;color:var(--on-surface-var);
  width:40px;height:40px;border-radius:var(--r-full);font-size:18px;line-height:1;
}
.rowdel:hover{background:var(--error-c);color:var(--on-error-c)}
tfoot td{
  font-weight:500;font-size:15px;border-top:1px solid var(--outline);
  border-bottom:none;background:transparent;padding-top:12px;padding-bottom:12px;
}
tbody tr.placeholder:hover{background:transparent}
td.ph{color:var(--on-surface-var);text-align:left;padding:24px 4px;border-bottom:none}

/* ---------- results ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid2 > .card{margin-bottom:0}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.balrow{
  display:flex;align-items:center;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--outline-var);
}
.balrow:last-child{border-bottom:none}
.balrow .nm{font-weight:500;font-size:15px}
.balrow .sub{color:var(--on-surface-var);font-size:13px}
.balrow .val{
  margin-left:auto;font-variant-numeric:tabular-nums;font-weight:500;font-size:15px;
  padding:6px 12px;border-radius:var(--r-s);white-space:nowrap;
}
.val.pos{color:var(--on-success-c);background:var(--success-c)}
.val.neg{color:var(--on-error-c);background:var(--error-c)}
.val.zero{color:var(--on-surface-var);background:var(--surface-2)}
.tr{
  display:flex;align-items:baseline;gap:6px;padding:12px 0;flex-wrap:wrap;
  border-bottom:1px solid var(--outline-var);
}
.tr:last-child{border-bottom:none}
.tr .from,.tr .to{font-weight:500}
.tr .arrow{color:var(--focus);font-weight:500}
.tr .amt{font-variant-numeric:tabular-nums;font-weight:500;color:var(--error)}
/* the two ways to pay, at the end of a transfer I owe */
.tpayset{display:flex;align-items:center;gap:6px;margin-left:auto;flex:0 0 auto}
.tpay{
  display:inline-flex;align-items:center;gap:5px;
  border:1px solid var(--pay-line);background:var(--pay-c);
  color:var(--on-pay-c);border-radius:var(--r-full);
  padding:0 12px;min-height:32px;font:inherit;font-size:12.5px;font-weight:500;
  cursor:pointer;white-space:nowrap;transition:background .15s, opacity .15s;
}
.tpay:hover{filter:brightness(.96)}
.tpay:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* handed over: this one steps back with a tick, the other is crossed out —
   both still respond, because a transfer can always be repeated */
.tpay.done{opacity:.55;border-color:var(--success)}
.tpay.done:hover{opacity:.85}
.tpay.void{
  opacity:.45;background:transparent;border-color:var(--outline-var);
  color:var(--on-surface-var);text-decoration:line-through;
}
.tpay.void:hover{opacity:.7}
/* a way with nothing behind it yet: dashed, quiet, and it still answers */
.tpay.miss{
  background:transparent;border-style:dashed;border-color:var(--pay-line);
  color:var(--on-surface-var);opacity:.85;
}
.tpay.miss:hover{opacity:1;border-color:var(--primary)}
.empty-note{color:var(--on-surface-var);padding:8px 0}
.note{
  background:var(--warn-c);color:var(--on-warn-c);border-radius:var(--r-m);
  padding:12px 14px;font-size:13.5px;margin-bottom:12px;
}
.hint{color:var(--on-surface-var);font-size:13px}

/* Changed after this device had confirmed: the message says so, this says
   where — and once the card is open, exactly which field moved rather than
   "somewhere in this row". It goes away with the next confirmation or the
   next own edit. */
td.chg,.exact-cell.chg,.rowex.chg{
  outline:3px dashed var(--error);outline-offset:-2px;border-radius:var(--r-s);
}
.chip.changed{outline:3px dashed var(--error);outline-offset:1px}
/* Removed by somebody else: still there to be read, struck through, with
   nothing to press. It goes when the other marks go. */
tbody tr.gone > td.gonecell{
  border:3px dashed var(--error);border-radius:var(--r-m);
  background:var(--surface-2);
}
.goneline{
  display:flex;align-items:center;gap:9px;min-width:0;
  text-decoration:line-through;color:var(--on-surface-var);
}
.goneline .gx{text-decoration:none;color:var(--error);font-weight:700;flex:0 0 auto}
.goneline .sdesc{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goneline .swho{font-size:12.5px;white-space:nowrap}
.goneline .samt{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap}
.gonenote{font-size:11.5px;color:var(--error);margin-top:3px;letter-spacing:.02em}
.chip.gone{
  border:2px dashed var(--error);color:var(--on-surface-var);
  padding:0 12px;min-height:40px;gap:7px;
}
.chip.gone .gnm{text-decoration:line-through}
/* A person somebody removed keeps their column until the marks are answered:
   struck through, with the share they held, and nothing to press. Their shares
   would otherwise disappear from every card without leaving a trace. */
th.share.gone .pname,td.share.gone .mlabel{
  text-decoration:line-through;color:var(--error);
}
th.share.gone{opacity:.75}
/* the tick is history, not a setting — it must not look like one */
td.share.gone .sharebtn{opacity:.5;cursor:default;filter:grayscale(.6)}
.chip.gone .gx{color:var(--error);font-weight:700}

/* A row that is wholly new has no single field to point at, so the frame goes
   round the row. On a table that means borders on the cells — which is a
   desktop-only trick: on a phone the row is a card and gets a real border, and
   the cell borders would leave a red stripe beside the number and beside the
   delete button. Hence the min-width: these three rules must not reach the
   phone layout at all. */
@media (min-width:701px){
  tbody tr.changed.whole td{border-top:3px dashed var(--error);border-bottom:3px dashed var(--error)}
  tbody tr.changed.whole td:first-child{border-left:3px dashed var(--error)}
  tbody tr.changed.whole td:last-child{border-right:3px dashed var(--error)}
}
@media (max-width:700px){
  /* closed, the whole line is the mark; open, the fields inside carry it */
  tbody tr.changed.folded{border:3px dashed var(--error);border-radius:var(--r-m)}
  tbody tr.changed.whole:not(.folded){border:3px dashed var(--error)}
}

/* ---- "we are done": one confirmation per device ------------------------- */
/* ---- the confirmation, under the transfers it confirms ---- */
.finalbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:4px 20px 14px;
}
.finalstat{color:var(--on-surface-var);font-size:13px}
.finalstat.all{color:var(--success);font-weight:600}
/* Neither indigo nor grey: this button commits the whole group to a result, so
   it is deliberately not the same colour as "add expense" or "sync". */
.btn.finalbtn.seal{background:var(--success-c);color:var(--on-success-c)}
.btn.finalbtn.seal:hover{background:var(--success-c);box-shadow:var(--e1)}
.btn.finalbtn.open{background:var(--warn-c);color:var(--on-warn-c)}
.btn.finalbtn.open:hover{background:var(--warn-c);box-shadow:var(--e1)}

.finalnote{
  margin:0 20px 16px;padding:10px 14px;border-radius:var(--r-m);
  font-size:13px;background:var(--surface-2);color:var(--on-surface-var);
}
.finalnote.warn{background:var(--warn-c);color:var(--on-warn-c)}

/* Locked cards say so by going flat and grey. inert already stops every click;
   this is only so nobody wonders why nothing reacts. The people list is not
   one of them: paying up happens after the confirmation, and the addresses
   live there — only the NAMES inside it are fixed, and they say so
   themselves (see .chip input[readonly]). */
body.await-final .card[data-edit]:not([data-meok]),
body.all-final  .card[data-edit]:not([data-meok]){
  opacity:.6;filter:grayscale(.6);
  background:
    repeating-linear-gradient(135deg, transparent 0 9px, rgba(120,120,145,.13) 9px 18px),
    var(--surface-2);
}
body.all-final .card[data-edit]:not([data-meok]){opacity:.5}
body.await-final #tripTitle,
body.all-final  #tripTitle{opacity:.62}
/* Waiting for "which one are you?": the same washed-out look as the naming
   gate, but a tap has to land somewhere that can say why nothing happens. */
.shaded{position:relative;opacity:.45;filter:saturate(.5)}
.meshade{position:absolute;inset:0;z-index:3;cursor:not-allowed;background:transparent}

/* the settlement is the one thing that stays fully lit once everybody agrees */
body.all-final .grid2 .card:not([data-edit]){
  outline:2px solid var(--success);outline-offset:-2px;
}


/* ---------- naming gate ---------- */
.gate{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:var(--primary-c);color:var(--on-primary-c);
  border-radius:var(--r-xl);padding:18px 20px;margin-bottom:12px;
}
.gate-txt{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:4px}
.gate-txt strong{font-size:17px;font-weight:500}
.gate-txt span{font-size:13.5px;line-height:1.5;opacity:.85}
.gate-act{display:flex;gap:8px;flex-wrap:wrap}
/* the banner already uses the container tint, so the buttons have to invert
   against it — otherwise the primary button is the same colour as its backdrop */
.gate .btn{background:var(--surface);color:var(--on-surface)}
.gate .btn:hover{background:var(--surface-2)}
.gate .btn.primary{background:var(--on-primary-c);color:var(--primary-c)}
.gate .btn.primary:hover{background:var(--on-primary-c);filter:brightness(1.15)}
.needs-title #tripTitle{
  background:var(--surface);
  box-shadow:0 0 0 2px var(--focus);
}
.gated[inert]{opacity:.45;filter:saturate(.5)}
@media (max-width:700px){
  .gate{padding:16px;border-radius:var(--r-l)}
  .gate-act{width:100%}
  .gate-act .btn{flex:1 1 auto}
}

/* ---------- install hint ---------- */
.iosbar{
  display:flex;align-items:flex-start;gap:12px;
  background:var(--primary-c);color:var(--on-primary-c);
  border:none;border-radius:var(--r-l);padding:14px 14px 14px 16px;margin-bottom:12px;
  font-size:13.5px;line-height:1.5;
}
.iosbar .ico{font-size:18px;line-height:1.3;flex:none}
.iosbar .txt{flex:1;min-width:0}
.iosbar .shareico{display:inline-block;vertical-align:-2px;margin:0 1px}
.iosbar .x{
  border:none;background:transparent;cursor:pointer;color:inherit;flex:none;
  width:32px;height:32px;border-radius:var(--r-full);font-size:18px;line-height:1;
}
.iosbar .x:hover{background:rgba(128,128,128,.22)}

/* ---------- menu ---------- */
.menu-anchor{position:relative}
/* The bar is sticky now, so the menu is pinned to the top of the screen and
   scrolling the page can no longer bring its last entries into reach — it has
   to scroll inside itself. */
.menu{
  position:absolute;right:0;top:calc(100% + 8px);z-index:50;min-width:260px;
  background:var(--surface-3);color:var(--on-surface);
  border:none;border-radius:var(--r-m);box-shadow:var(--e2);
  padding:8px 0;display:none;
  /* ...and it must stop above the sync bar, which is fixed over everything at
     the bottom and would otherwise swallow the last entries' taps. */
  max-height:calc(100vh - 96px - env(safe-area-inset-top, 0px) - var(--syncbar-h, 0px));
  overflow-y:auto;overscroll-behavior:contain;
}
.menu.open{display:block}
.menu button{
  display:flex;width:100%;text-align:left;border:none;background:transparent;
  padding:0 16px;min-height:48px;cursor:pointer;gap:12px;align-items:center;font-size:14px;
}
.menu button:hover{background:var(--surface-2)}
.menu hr{border:none;border-top:1px solid var(--outline-var);margin:8px 0}
.menu .danger:hover{background:var(--error-c);color:var(--on-error-c)}
.menu .lbl{
  font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--on-surface-var);padding:8px 16px 4px;
}

/* ---------- raw-data dialog ---------- */
.dlg{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.45);padding:16px;
}
.dlg-box{
  background:var(--surface-1);color:var(--on-surface);border-radius:var(--r-xl);
  box-shadow:var(--e2);width:min(640px,100%);max-height:86vh;
  display:flex;flex-direction:column;padding:20px;gap:12px;
}
.dlg-h{display:flex;align-items:center;gap:12px}
.dlg-h strong{font-size:16px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dlg-h .x{
  border:none;background:transparent;cursor:pointer;color:var(--on-surface-var);
  width:40px;height:40px;border-radius:var(--r-full);font-size:20px;line-height:1;flex:none;
}
.dlg-h .x:hover{background:var(--surface-3)}
.dlg-p{margin:0;font-size:13.5px;color:var(--on-surface-var);line-height:1.55}
.dlg-p code{font-size:12.5px;background:var(--surface-3);padding:1px 5px;border-radius:var(--r-xs)}
#rawText{
  flex:1;min-height:180px;resize:vertical;width:100%;
  font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;
  background:var(--surface);color:var(--on-surface);
  border:1px solid var(--outline-var);border-radius:var(--r-m);padding:12px;
}
#rawText:focus{outline:2px solid var(--focus);outline-offset:-2px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

footer{
  color:var(--on-surface-var);font-size:12.5px;text-align:center;
  padding:12px 0 0;line-height:1.8;
}
footer .ver{font-size:11.5px;opacity:.8}

.toast{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);
  z-index:400;                    /* above the sync bar and the sticky header */
  background:var(--note-c);color:var(--on-note-c);
  padding:18px;border-radius:var(--r-m);box-shadow:var(--e2);
  border:2px solid var(--note-line);
  font-size:15px;line-height:1.45;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  width:max-content;max-width:min(92vw, 420px);
}
.toast.show{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.toast.brief{pointer-events:none}
/* the button has to sit on the message colour, not on the page colour */
#toastOk{min-width:96px;background:var(--on-note-c);color:var(--note-c)}
#toastOk:hover{background:var(--on-note-c);filter:brightness(1.2)}
#toastOk[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- phone layout: one card per expense ---------- */
.mlabel{display:none}
/* the folded line and the controls that go with it belong to the phone layout
   alone — on a desktop the table already shows everything at once */
td.sum,td.no,.rowfold,.foldall,.foldbtn,.swipehint,.cardpos,.cardchg,.gonefoot,
td.exactcell{display:none}
/* the swipe symbol is the only warm thing in the header, so it reads as a
   gesture rather than as one more grey button. The chevron run is drawn wide
   and large — the button keeps its size, the padding gives way instead. */
.cardbtn .swico{width:20px;height:20px;display:block;flex:0 0 auto;color:var(--swipe)}
/* the chevron run is drawn wide and large; the button keeps its size because
   it has none of its own to give — it is a fixed square either way */
.cardbtn .swico.wide{width:30px;height:19px}
/* .btn.sm sets a padding of its own, so this has to out-specify it */
.btn.sm.cardbtn{padding:0;width:34px;min-width:34px;height:34px;min-height:34px}
/* Nothing folds on a desktop: the whole point of folding is a screen that
   cannot hold the list, and a desktop can. The card may still carry the class
   — it simply does nothing here. */

@media (max-width:700px){
  /* ---------- card mode: one expense at a time ----------
     The list becomes a rail. Each card takes 86% of the width so the next one
     shows at the edge — that peek is the whole point: it says there is more,
     which a single card on its own never does. Only the position is animated;
     the cards themselves are the same cards. */
  body.card-mode .tablewrap{overflow:hidden}
  body.card-mode tbody{
    transform:translateX(var(--rail, 0));
    flex-direction:row;flex-wrap:nowrap;align-items:flex-start;
    transition:transform .28s cubic-bezier(.2,.7,.3,1);
    touch-action:pan-y;
  }
  /* The neighbours slide UNDER the card in focus rather than standing beside
     it: 90% wide with a 84% step, so six per cent of each neighbour shows past
     the edge and the rest is covered. The card in focus keeps almost the whole
     width — which is where the fields are — and it is still obvious that there
     is more on both sides. */
  body.card-mode tbody > tr{
    flex:0 0 90%;margin:0 -6% 0 0;opacity:.55;
    position:relative;z-index:1;transition:opacity .28s;
    /* a colour of its own: in the list a row is a line among lines, here it is
       a card lying on the panel, and the ones behind are the same blue a step
       deeper — one stack, with the light on the card in front */
    background:var(--card-back);border-color:var(--card-back-line);
  }
  /* The card in focus is blue, not white: on white the fields — which are
     themselves near-white — disappeared into their own card. */
  /* the arrows belong to the card in focus; on the neighbours they are half
     hidden, inert and just noise. visibility, not display: the cards behind
     have to keep the same height as the one in front. */
  body.card-mode tbody > tr:not(.here) .swipehint{visibility:hidden}
  body.card-mode tbody > tr.here{
    opacity:1;z-index:3;box-shadow:var(--e2);
    background:var(--card-f);border-color:var(--card-f-line);
  }
  body.card-mode tbody > tr.unassigned{background:var(--warn-c)}
  /* ---------- a removed expense, at card size ----------
     In the rail everything is a card, so this is one too: the same width, the
     red frame, and a cross the size of the card, because the one thing it has
     to say is that there is nothing here any more. */
  body.card-mode tbody > tr.gone{
    flex-wrap:wrap;align-items:center;justify-content:center;
    min-height:200px;padding:0;overflow:hidden;
    background:var(--surface-3);border:3px dashed var(--error);
  }
  body.card-mode tbody > tr.gone > td.no{display:none}
  body.card-mode tbody > tr.gone > td.gonecell{
    padding:18px;text-align:center;flex:1 1 100%;
  }
  body.card-mode tr.gone .goneline{justify-content:center;flex-wrap:wrap;min-height:0}
  body.card-mode tr.gone .goneline .samt{margin-left:0}
  body.card-mode tr.gone .gonenote{margin-top:10px;font-size:12.5px}
  body.card-mode tbody > tr.gone::before,
  body.card-mode tbody > tr.gone::after{
    content:'';position:absolute;left:5%;right:5%;top:calc(50% - 3px);
    height:6px;border-radius:3px;background:var(--error);opacity:.3;
    pointer-events:none;
  }
  body.card-mode tbody > tr.gone::before{transform:rotate(26deg)}
  body.card-mode tbody > tr.gone::after{transform:rotate(-26deg)}
  /* the counter and the marks line, above the strip and out of its way */
  body.card-mode .gonefoot{
    display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:baseline;
    gap:2px 10px;margin-top:14px;
  }
  body.card-mode .gonefoot .cardchg{flex:0 1 auto;justify-content:flex-end}
  /* The strip for fixed amounts is a table row of its own, so in a rail it
     would become a card of its own. It belongs to the list view. */
  body.card-mode tbody > tr.exactrow{display:none}
  body.card-mode .rowfold{display:none}
  body.card-mode #foldAll{display:none}
  /* the fixed amounts hang off the bottom of the card they belong to */
  body.card-mode td.exactcell{
    /* the other cells carry an explicit order; without one this would sort
       itself to the very top of the card */
    order:9;
    display:block;flex:1 1 100%;padding:0;margin:8px -10px -8px;
    /* it hangs off the card, so it is the card: same blue, and only a line to
       say where the one ends and the other begins */
    border-top:1px solid var(--card-f-line);
    background:var(--card-f);
    border-radius:0 0 var(--r-l) var(--r-l);overflow:hidden;
  }
  body.card-mode tr.unassigned td.exactcell{background:var(--warn-c)}
  body.card-mode td.exactcell .exact{padding:12px}

  /* where you are, at the end of the line that already carries a figure */
  body.card-mode .cardpos{
    display:inline;margin-left:auto;font-size:12px;letter-spacing:0;
    text-transform:none;color:var(--on-surface-var);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  /* ---------- and under it, where the marks are ----------
     The rail shows one card, so a red frame two cards away is invisible. The
     numbers say where to look and take you there: they are the numbers the
     list itself puts in front of each expense. */
  body.card-mode .cardchg{
    display:flex;flex:1 1 100%;justify-content:flex-end;align-items:center;
    flex-wrap:wrap;gap:0;margin-top:2px;font-size:12px;letter-spacing:0;
    text-transform:none;color:var(--error);font-variant-numeric:tabular-nums;
  }
  body.card-mode .cardchg:empty{display:none}
  .chgjump{
    border:none;background:transparent;color:var(--error);
    font:inherit;font-weight:700;cursor:pointer;
    padding:2px 2px;min-height:24px;border-radius:var(--r-xs);
  }
  .chgjump:hover{background:var(--error-c);color:var(--on-error-c)}
  .chgjump:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
  /* not struck through: a strike here would read as "the removal was undone" */
  .chgjump.gone{font-weight:500}

  /* ---------- the swipe handle at the foot of a card ----------
     The only strip of the card with nothing to type into, which is what makes
     it safe to drag across. The hand leans into the direction of travel; the
     chevrons only fan out towards a card that actually exists. */
  /* Three slots: an arrow, the hand with its chevrons, an arrow. Fixed outer
     columns keep the hand in the middle of the card even on the first and the
     last one, where only one arrow exists. */
  body.card-mode .swipehint{
    display:grid;grid-template-columns:40px 1fr 40px;align-items:center;
    flex:1 1 100%;margin:8px -4px -2px;padding:6px 4px 2px;
    touch-action:pan-y;cursor:grab;
  }
  .swipehint .navslot{display:flex;align-items:center}
  .swipehint .navslot.right{justify-content:flex-end}
  /* the arrows are the one thing here that is tapped, so they look tappable */
  .cardnav{
    background:var(--surface);color:var(--primary);
    border:1px solid var(--card-f-line);
    width:38px;height:38px;border-radius:var(--r-full);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;padding:0;
  }
  .cardnav:hover{background:var(--surface-2)}
  .cardnav:active{background:var(--outline-var)}
  .cardnav:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .cardnav .navarw{width:22px;height:22px;display:block}
  /* the hand and its chevrons: one gesture, drawn tight so the chevrons read
     as coming off the hand rather than as two marks beside it */
  .swipehint .swipeset{
    display:flex;align-items:center;justify-content:center;gap:2px;
  }
  .swipehint .swhand{
    width:26px;height:26px;color:var(--on-surface-var);
    transform:rotate(-16deg);flex:0 0 auto;
  }
  .chevrun{display:inline-flex;align-items:center;gap:1px}
  .chevrun .chev{width:13px;height:20px;color:var(--primary);display:block}
  /* the run reads as motion: faint at the far end, solid next to the hand */
  .chevrun.left{flex-direction:row-reverse}

  /* ---------- one line per expense, one card open ---------- */
  /* On a phone a name and two addresses do not fit side by side, and the name
     is what has to stay readable — so the addresses drop to a line of their
     own underneath it, still inside the person's row. */
  .chip{flex-wrap:wrap;padding:6px 6px 6px 8px;row-gap:4px}
  /* the hand joins the row instead of floating over it: with two lines there
     is no single middle for it to sit in */
  .chip.haspick{padding-left:8px}
  .pickme{position:static;transform:none;order:0;flex:0 0 auto;margin-right:2px}
  /* A short name keeps its addresses beside it; a long one takes the line and
     sends them underneath. The minimum width is set from the name itself. */
  .chip > input{flex:1 1 auto;order:1}
  .chip .mebtn{order:0}
  /* the way to remove a person stays last, wherever the line breaks */
  .chip .x{order:4}
  .payset{flex:0 1 auto;order:3;margin-left:auto;justify-content:flex-end}
  .foldall{display:inline-flex;align-items:center}
  .foldall[hidden]{display:none}
  /* A folded card keeps its heading, its summary line and any warning — a
     warning that folds away with the numbers it is about is worse than none. */
  .foldbtn{min-width:40px;padding:6px 10px;font-size:13px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center}
  /* a class beats the browser's own [hidden] rule, so it has to be said here */
  .foldbtn[hidden]{display:none}
  .foldbtn .arw.chev{margin:0}
  .card.folded > .card-b{padding-top:0;padding-bottom:14px}
  .card.folded > .card-b > *:not(.note){display:none}
  .card.folded > .card-b:empty{display:none}
  tbody tr.folded{
    padding:0;background:var(--surface);border-color:var(--outline-var);
    overflow:hidden;flex-wrap:nowrap;
  }
  /* A removed line keeps the shape of the line it was: same width, same edge,
     no second box inside a first one. The frame is the row's, the grey is the
     row's, and the cell inside carries nothing of its own. */
  tbody tr.gone{
    padding:0;margin-bottom:3px;flex-wrap:nowrap;
    background:var(--surface-3);border:3px dashed var(--error);
  }
  tbody tr.gone > td.no{padding:0 0 0 8px;align-self:center}
  tbody tr.gone > td.gonecell{
    display:block;flex:1 1 auto;min-width:0;
    border:none;background:transparent;border-radius:0;padding:9px 12px 9px 4px;
  }
  .goneline{min-height:30px}
  tbody tr.folded.unassigned{background:var(--warn-c)}
  tbody tr.folded > td:not(.sum):not(.no){display:none}
  tbody tr.folded > td.no{padding:0 0 0 10px}
  tbody tr:not(.folded) > td.sum{display:none}
  tbody tr.folded > td.sum{display:block;padding:0;width:100%}
  .sumline{
    display:flex;align-items:center;gap:9px;width:100%;min-width:0;
    font:inherit;text-align:left;color:inherit;background:transparent;
    border:none;padding:13px 12px;cursor:pointer;min-height:48px;
  }
  .sumline .flag{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:0 0 auto}
  tbody tr.folded.unassigned .sumline .flag{background:var(--on-warn-c)}
  .sumline .sdesc{
    font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
  }
  .sumline .sdesc.none{font-weight:400;font-style:italic;color:var(--on-surface-var)}
  .sumline .swho{
    font-size:12.5px;color:var(--on-surface-var);white-space:nowrap;
    flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;
  }
  tbody tr.folded.unassigned .sumline .swho{color:var(--on-warn-c)}
  .sumline .samt{
    margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .sumline .schev{color:var(--on-surface-var);flex:0 0 auto;display:flex;
    align-items:center;opacity:.75}
  .sumline .schev .arw.chev{width:17px;height:17px;margin:0;vertical-align:0}
  .sumline:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;border-radius:var(--r-l)}
  /* the way back out of an open card, next to the delete button */
  /* the way out of the open card, at its bottom right */
  .rowfold{
    display:inline-flex;align-items:center;gap:4px;margin-left:auto;
    border:1px solid var(--outline-var);border-radius:var(--r-full);
    padding:6px 12px 6px 9px;cursor:pointer;font:inherit;font-size:13px;
    background:var(--surface);color:var(--on-surface-var);
  }
  .rowfold:hover{background:var(--surface-3)}
  .rowfold .arw.chev{width:15px;height:15px;margin:0;vertical-align:0}
  td.pershare{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  /* the lifted card says so: it sits on the page rather than in the list */
  /* An open card is an open card, rail or list: the same blue, so the fields
     on it stand out the same way. A card with something missing keeps its
     orange — that warning outranks the colour of the mode. */
  tbody tr:not(.folded):not(.gone):not(.unassigned){
    background:var(--card-f);border-color:var(--card-f-line);
  }
  tbody tr.hoist{
    border-color:var(--primary);box-shadow:var(--e2);
  }
  tbody tr.hoist.unassigned{background:var(--warn-c)}
  tbody tr:not(.folded):hover{background:var(--card-f)}
  tbody tr:not(.folded).unassigned:hover{background:var(--warn-c)}
  .rowfold:hover{background:var(--surface-3)}

  .wrap{
    padding-top:0;
    padding-right:calc(12px + env(safe-area-inset-right, 0px));
    padding-bottom:64px;
    padding-left:calc(12px + env(safe-area-inset-left, 0px));
  }
  /* one line as long as it fits: logo, name, then the buttons */
  header.top{
    gap:6px;
    margin:0 calc(-12px - env(safe-area-inset-right, 0px)) 0 calc(-12px - env(safe-area-inset-left, 0px));
    padding:var(--top-pad, 4px)
            calc(12px + env(safe-area-inset-right, 0px)) 6px
            calc(12px + env(safe-area-inset-left, 0px));
  }
  .brand{flex:0 1 auto}
  .logo{width:34px;height:34px}
  #tripTitle{font-size:19px;padding:2px 6px;line-height:1.25}
  .top-actions{gap:6px}
  .top-actions .btn{min-height:36px;padding:0 12px;font-size:13px}
  .tablewrap{overflow:visible}
  table{min-width:0}
  table,tfoot,tr,td{display:block;width:auto}
  /* a column of cards, so the open one can be lifted to the top of it without
     touching the row order the rest of the app reads */
  tbody{display:flex;flex-direction:column;width:auto}
  tbody > tr{order:0}
  tbody > tr.hoist{order:-2}
  tbody > tr.exactrow.hoist{order:-1}
  thead{display:none}
  tbody tr{
    display:flex;flex-wrap:wrap;align-items:center;
    border:1px solid var(--row-line);border-radius:var(--r-l);
    margin:0 0 10px;padding:10px 10px 8px;
    position:relative;background:var(--surface-2);
  }
  /* closed lines sit almost on top of each other: they are one list, not a
     stack of separate cards, and the whole point is to see many at once */
  tbody tr.folded{margin-bottom:3px}
  tbody tr.folded + tr:not(.folded){margin-top:10px}
  /* the running number: small, quiet, and the same one whether the expense is
     a line in the list or the card lifted above it */
  td.no{
    display:block;flex:0 0 auto;padding:0 2px 0 0;
    font-size:11px;font-variant-numeric:tabular-nums;
    color:var(--on-surface-var);opacity:.7;min-width:18px;text-align:right;
  }
  tbody tr:not(.folded) > td.no{order:0;align-self:flex-start;padding-top:12px}
  /* an expense and its open exact-amount strip read as one block */
  tbody tr.hasexact{
    border-bottom:none;margin-bottom:0;
    border-bottom-left-radius:0;border-bottom-right-radius:0;
  }
  tbody tr:hover{background:var(--surface-2)}
  tbody tr.unassigned{background:var(--warn-c)}
  tbody tr.placeholder{display:block;text-align:left;background:transparent;border:1px dashed var(--outline-var)}
  tbody td{border:none;padding:3px 4px}
  td.ph{padding:18px 12px}
  .mlabel{
    display:inline;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--on-surface-var);font-weight:500;
  }
  td.payer{order:1;flex:1 1 50%;min-width:0}
  td.payer select{font-size:15px;padding:10px 6px;background:var(--surface);border-radius:var(--r-s)}
  td.amt{order:2;flex:0 1 40%;min-width:0;padding-right:44px}
  /* the field carries its own label on a phone: the currency, inside the box */
  td.amt .amtbox{
    display:flex;align-items:center;gap:1px;min-width:0;
    background:var(--surface);border-radius:var(--r-s);padding-right:10px;
  }
  td.amt input{background:transparent;border-radius:var(--r-s);font-size:16px;
    font-weight:500;padding:10px 2px 10px 10px;min-width:0}
  td.amt .cur{
    display:inline;font-size:15px;font-weight:500;color:var(--on-surface-var);
    flex:0 0 auto;
  }
  td.desc{order:3;flex:1 1 100%}
  td.desc input{background:var(--surface);border-radius:var(--r-s);font-size:15px;padding:10px}
  td.share{
    order:4;display:inline-flex;align-items:center;gap:6px;width:auto;
    background:var(--surface);border-radius:var(--r-full);
    padding:2px 3px 2px 12px;margin:6px 6px 0 0;
  }
  td.share .mlabel{max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.share .sharebtn{width:34px;height:34px;border:none}
  td.pershare{
    order:5;flex:1 1 100%;text-align:left;padding-top:10px;margin-top:8px;
    border-top:1px solid var(--outline-var);color:var(--on-surface-var);
  }
  td.pershare .v{font-weight:500;color:var(--on-surface)}
  /* the delete button floats in the corner — but the placeholder row has a
     single cell, which would otherwise be caught by :last-child too */
  tbody tr:not(.placeholder):not(.exactrow) td.amt{padding-right:4px}
  tbody tr.exactrow.unassigned{background:var(--warn-c)}
  tbody tr.exactrow.unassigned .exact-cell input{background:var(--surface)}
  tbody tr.exactrow{
    display:block;padding:0;margin:0 0 10px;background:var(--card-f);
    border:1px solid var(--card-f-line);border-top:none;
    border-radius:0 0 var(--r-l) var(--r-l);
    overflow:hidden;
  }
  /* the desktop rule gives this cell its own background and bottom rule; both
     paint over the rounded corners of the block, which is what squared off the
     bottom edge in the Android WebView */
  tbody tr.exactrow td{display:block;padding:0;background:transparent;border-bottom:none}
  .exact{padding:12px}
  .exact-grid{flex-direction:column}
  .exact-cell{width:100%}
  .exact-cell input{flex:1;width:auto}
  /* both row buttons flow in after the per-person cells they belong to —
     floating them over the amount field made them overlap it */
  td.rowtools{order:4;display:inline-flex;gap:4px;width:auto;padding:0;margin:6px 0 0 auto}
  .rowex,td.rowtools .rowdel{position:static;width:34px;height:34px;margin:0}
  tfoot tr{display:flex;align-items:center;gap:8px;padding:8px 6px}
  tfoot td{display:block;border:none;background:transparent;padding:0}
  tfoot td.num{margin-left:auto;font-size:18px}
  tfoot td:last-child{display:none}
  .card-h .hint{font-size:12px;flex-basis:100%;order:3}
  /* the instruction is about the share cells inside a card — with every card
     closed there is nothing it could be talking about */
  body:not(.card-open) #expHint{display:none}
  /* the balance summary and the head count are two words each and belong
     beside their heading, not on a line of their own like the long
     instruction in the expenses header */
  .card-h #balHint,.card-h #peopleHint{flex-basis:auto;order:0}
  .card-h .btn{order:2}
  /* ---------- the expenses header, all of it on one line ----------
     Four things share about 350 px: the heading, "all", the add button and the
     swipe symbol. They fit by giving up padding rather than by wrapping — and
     "all" belongs to the heading it folds, so it sits next to it instead of
     drifting over to the two buttons on the right. */
  [data-edit] > .card-h{gap:3px;padding-left:14px;padding-right:14px}
  [data-edit] > .card-h h2{font-size:15px}
  [data-edit] > .card-h #foldAll{order:0;gap:0;padding:0 6px;margin-left:1px}
  [data-edit] > .card-h #foldAll .arw.chev{margin:0}
  [data-edit] > .card-h .btn.sm{min-height:34px;font-size:13px;padding:0 9px}
  [data-edit] > .card-h .btn.sm.cardbtn{padding:0}

  [data-edit] > .card-h .hint{padding:0 6px}
  #tripTitle{font-size:20px;max-width:none;width:100%;min-width:0}
}

@media print{
  body{background:#fff;color:#000}
  /* on paper the sheet is a sheet, whatever the screen was doing */
  body.card-mode tbody{transform:none!important;flex-direction:column!important}
  body.card-mode tbody > tr{opacity:1!important}
  .swipehint,.cardnav,.cardchg{display:none!important}
  th.share.gone,td.share.gone{display:none!important}
  .top-actions,.rowdel,.rowfold,.foldall,.card-h .btn,.addperson,.chip .x,.iosbar,footer .noprint{display:none!important}
  /* a ghost is a note to one device, not part of the sheet */
  tbody tr.gone,.chip.gone{display:none!important}
  /* a folded row on screen is still a full row on paper */
  tbody tr > td.sum{display:none!important}
  tbody tr.folded > td:not(.sum){display:table-cell!important}
  .card{background:#fff;border:1px solid #ccc;break-inside:avoid;margin-bottom:12px}
  .tablewrap{overflow:visible}
  tbody tr{background:#fff!important}
}

/* ---------- shared editing ---------- */
/* the fixed bar of a shared sheet */
.syncbar{
  position:fixed;left:0;right:0;bottom:0;z-index:150;
  display:flex;align-items:center;gap:10px;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:var(--surface-1);color:var(--on-surface);
  border-top:1px solid var(--outline-var);
  box-shadow:0 -2px 10px rgba(0,0,0,.10);
}
.syncbar .dot{width:10px;height:10px;border-radius:50%;background:var(--outline);flex:0 0 auto}
.syncbar .lbl{font-size:13.5px;color:var(--on-surface-var);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syncbar .spacer{flex:1}
/* two spacers, so the sync button sits in the middle whatever the two labels
   either side of it happen to say */
.syncbar .finalmini{font-size:13px;color:var(--on-surface-var);white-space:nowrap;
  flex:0 0 auto;max-width:38%;overflow:hidden;text-overflow:ellipsis}
.syncbar .finalmini.all{color:var(--success);font-weight:600}
.syncbar .finalmini.warn{color:var(--warn);font-weight:600}
.syncbar .lbl{max-width:38%}
.syncbar[data-s="ok"] .dot{background:var(--success)}
.syncbar[data-s="busy"] .dot{background:var(--warn)}
.syncbar[data-s="offline"] .dot{background:var(--outline)}
.syncbar[data-s="denied"] .dot,.syncbar[data-s="badkey"] .dot{background:var(--error)}
.syncbar[data-s="gone"] .dot{background:var(--error)}
.syncbar[data-s="gone"] .lbl{color:var(--error);font-weight:500}
.syncbar[data-s="denied"] .lbl,.syncbar[data-s="badkey"] .lbl{color:var(--error);font-weight:500}
/* keep the last card clear of the bar, and off the print-out entirely */
body.has-syncbar{--syncbar-h:76px}
body.has-syncbar .wrap{padding-bottom:76px}
@media print{ .syncbar{display:none} body.has-syncbar .wrap{padding-bottom:0} }
/* the box already carries the padding; this only needs to scroll */
.dlg-b{display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}
.fld{display:flex;flex-direction:column;gap:5px}
.fld-l{font-size:12px;font-weight:500;color:var(--on-surface-var);
  text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld textarea{
  width:100%;padding:11px 12px;border:1px solid var(--outline-var);
  border-radius:var(--r-s);background:var(--surface);color:var(--on-surface);
  font:inherit;font-size:15px;
}
.fld textarea{min-height:88px;resize:vertical;line-height:1.45}
.fld .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px;word-break:break-all}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--focus);outline-offset:1px}
/* the one paragraph that must not be skimmed past */
.dlg-p.warnp{
  background:var(--warn-c);color:var(--on-warn-c);
  padding:10px 12px;border-radius:var(--r-s);margin:0;
}
.sheetlist{display:flex;flex-direction:column;gap:6px}
.sheetitem{
  display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer;
  padding:10px 12px;border:1px solid var(--outline-var);border-radius:var(--r-s);
  background:var(--surface);color:var(--on-surface);font:inherit;
}
.sheetitem:hover{background:var(--surface-2)}
.sheetrow{display:flex;gap:6px;align-items:stretch}
.sheetrow .sheetitem{flex:1;min-width:0}
.sheetdel{
  flex:0 0 auto;width:44px;border:1px solid var(--outline-var);border-radius:var(--r-s);
  background:var(--surface);color:var(--error);cursor:pointer;font-size:18px;line-height:1;
}
.sheetdel:hover{background:var(--error-c);border-color:var(--error)}
.sheetitem .nm{font-weight:500}
/* the password is meant to be read off the screen and typed on another phone */
.sendrow{display:flex;gap:8px;justify-content:flex-end;margin-top:-4px}
.linkbtn{
  align-self:flex-start;background:none;border:none;padding:0;cursor:pointer;
  color:var(--primary);font:inherit;font-size:13px;text-decoration:underline;
}
.linkbtn:hover{color:var(--focus)}
.gaprow{display:flex;align-items:center;gap:14px;justify-content:center}
.gaprow .btn{min-width:64px;font-size:17px}
.gapval{font-variant-numeric:tabular-nums;font-size:17px;font-weight:500;min-width:70px;text-align:center}
/* the add-person field and its button belong together */
.addperson{display:inline-flex;align-items:center;gap:6px}
.addperson .addbtn{flex:none}

/* ---------- "that one is me" ---------- */
.chip{position:relative}
/* room for the hand ahead of the name. Set from script rather than with
   :has(), which is too new to rely on in a WebView. */
.chip.haspick{padding-left:36px}
/* The finger sits over the middle of the name, dimmed until it is wanted —
   a solid button there would make the list unreadable. */
/* Ahead of the name rather than over the middle of it: a hand is a solid
   shape, and in the middle it swallowed two letters of every name. Pointing
   right, from the left, it points AT the name it belongs to. */
.pickme{
  position:absolute;left:3px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border-radius:var(--r-full);border:none;cursor:pointer;
  display:grid;place-items:center;
  /* The hand is a picture, not a glyph: a free pointing-hand icon from
     magnific.com, turned a quarter to the left and recoloured to a skin tone
     with a dark rim so it still reads on a light disc. Source and the exact
     changes are recorded in CREDITS.md. It carries its own colours, so the
     button is the same plain disc in either theme. */

.chip.me{border-color:var(--me)}
.mebtn{
  border:none;background:transparent;cursor:pointer;
  color:var(--me);font:inherit;font-size:15px;font-weight:700;
  letter-spacing:.04em;padding:0 4px;min-height:32px;
}
.mebtn:hover{text-decoration:underline}
/* the substitution stays recognisable wherever it appears */
.balrow .nm.isme,.tr .from.isme,.tr .to.isme{color:var(--me);font-weight:600}
/* the drawn arrow: sized to the text it stands in, solid head at any size */
.arw{width:1.55em;height:.84em;vertical-align:-.06em;flex:0 0 auto;display:inline-block}
/* the switch arrow only has to be legible, not loud — the header row is the
   tightest space in the app */
#langLbl .arw{width:.95em;height:.62em;margin-right:1px}
.btn .arw{margin:0 1px}
/* the drawn arrow, a quarter turn either way — a square box so the rotation
   stays inside it */
.arw.chev{width:1.15em;height:1.15em;margin:0 2px 0 0;vertical-align:-.22em}
.arw.chev.down{transform:rotate(90deg)}
.arw.chev.up{transform:rotate(-90deg)}
/* the same everywhere the name stands in for this device: lower case, dark red */
th.share .pname.isme,td.share .mlabel.isme{
  color:var(--me);font-weight:700;text-transform:none;letter-spacing:0;
}

</style>

<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f5132"/>
      <stop offset="1" stop-color="#1f9d55"/>
    </linearGradient>

    <!-- one figure, in a 100 x 140 box: head plus a bell-shaped body -->
    <symbol id="lg-pawn" viewBox="0 0 100 140">
      <circle cx="50" cy="30" r="27"/>
      <path d="M50 60c18 0 30 18 34 41l4 21c2 10-4 16-13 16H25c-9 0-15-6-13-16l4-21c4-23 16-41 34-41z"/>
    </symbol>

    <!-- five figures on a regular pentagon around the centre, one on top.
         Centres sit on r=150 about (256,256); each use is offset by half its
         88 x 123 box so the figure is centred on its point. -->
    <g id="lg-mark">
      <g fill="#ffffff">
        <use href="#lg-pawn" x="212"   y="44.5"  width="88" height="123"/>
        <use href="#lg-pawn" x="354.7" y="148.1" width="88" height="123"/>
        <use href="#lg-pawn" x="300.2" y="315.8" width="88" height="123"/>
        <use href="#lg-pawn" x="123.8" y="315.8" width="88" height="123"/>
        <use href="#lg-pawn" x="69.3"  y="148.1" width="88" height="123"/>
      </g>
      <text x="256" y="258" fill="#ffffff"
            font-family="Roboto, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif"
            font-size="150" font-weight="700"
            text-anchor="middle" dominant-baseline="central">€</text>
    </g>
  </defs>

  <rect width="100%" height="100%" rx="112" fill="url(#lg-bg)"/>
  <g transform="translate(256,256) scale(1.0) translate(-256,-256)"><use href="#lg-mark"/></g>
</svg></div>
      <!-- a textarea, not an input: an input cannot wrap, and a long sheet name
           has to break at a word boundary instead of scrolling out of sight.
           It is kept to one visual line's worth of rows and grows as needed. -->
      <textarea id="tripTitle" rows="1" data-i18n-ph="title.ph" data-i18n-aria="title.aria"
                spellcheck="false" enterkeyhint="done"></textarea>
    </div>
    <div class="top-actions">
      <button class="btn" id="installBtn" data-i18n="btn.install" hidden>⬇︎ Install app</button>
      <button class="btn ghost" id="langBtn" data-i18n-title="btn.lang" data-i18n-aria="btn.lang"><span id="langLbl">DE</span></button>
      <button class="btn ghost" id="themeBtn" data-i18n-title="btn.theme" data-i18n-aria="btn.theme"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
      <div class="menu-anchor">
        <button class="btn" id="menuBtn" data-i18n="btn.menu" aria-haspopup="true" aria-expanded="false">Menu ▾</button>
        <div class="menu" id="menu" role="menu">
          <div class="lbl" data-i18n="menu.group.save">Save &amp; share</div>
          <button data-act="save" data-i18n="menu.save">…</button>
          <button data-act="load" data-i18n="menu.load">…</button>
          <button data-act="csv" data-i18n="menu.csv">…</button>
          <button data-act="copy" data-i18n="menu.copy">…</button>
          <button data-act="raw" data-i18n="menu.raw">…</button>
          <button data-act="print" data-i18n="menu.print">…</button>

          <button data-act="openshared" data-i18n="menu.openshared">…</button>
          <button data-act="synccode" data-i18n="menu.synccode" hidden>…</button>

          <button data-act="topgap" data-i18n="menu.topgap" hidden>…</button>

      </div>

  </header>

  <div class="gate" id="gateBar" hidden>
    <div class="gate-txt">
      <strong id="gateHead">Name this sheet to start</strong>
      <span id="gateSub">Give it a name — “Skitrip 2026”, “Flat share March” — and everything below unlocks.
        The name is also the filename when you save.</span>
    </div>
    <div class="gate-act">
      <button class="btn" id="gateOpen" data-i18n="gate.open">…</button>
      <button class="btn" id="gateKeep" data-i18n="gate.keep" hidden>…</button>
      <button class="btn primary" id="gateNew" data-i18n="gate.new" hidden>…</button>

      <span class="spacer"></span>
      <span class="hint" id="expHint" data-i18n="expenses.hint">…</span>
      <button class="btn sm primary" id="addRow" data-i18n="expenses.add">…</button>
      <button class="btn sm foldall cardbtn" id="cardBtn">…</button>
    </div>
    <div class="tablewrap">
      <table id="tbl">
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
        <tfoot id="tfoot"></tfoot>
      </table>
    </div>

  </div>

  <div class="grid2 gated">
    <div class="card" id="balCard">
      <div class="card-h">
        <h2 data-i18n="card.balance">Balance</h2>
        <span class="hint" id="balHint"></span>
        <span class="spacer"></span>
        <button class="btn sm foldbtn" id="balFold">…</button>
      </div>
      <div class="card-b" id="balances"></div>
    </div>
    <div class="card">
      <div class="card-h">
        <h2 data-i18n="card.settlement">Settlement</h2>
        <span class="spacer"></span>
        <span class="hint" id="trCount"></span>
      </div>
      <div class="card-b" id="transfers"></div>
      <!-- "we are done": one confirmation per device, plus the tally -->
      <div class="finalbar" id="finalBar" hidden>
        <button class="btn finalbtn" id="finalBtn">…</button>
        <span class="finalstat" id="finalStat"></span>
      </div>
      <div class="finalnote" id="finalNote" hidden></div>
    </div>
  </div>

  <footer>
    <div data-i18n="foot.credit">…</div>
    <div class="noprint" id="privacyNote" data-i18n="foot.privacy">…</div>
    <div class="noprint" id="browserNote" data-i18n="foot.browser" data-i18n-html>…</div>
    <div class="noprint ver"><span data-i18n="foot.version">Version</span> <strong id="verNo">–</strong> · <span id="verMode">–</span></div>
  </footer>
</div>

<!-- Shared sheets get a bar that stays put while the page scrolls: on a phone
     the header is off screen most of the time, and the one control people reach
     for repeatedly is "is this actually in sync?". -->
<div class="syncbar" id="syncBar" hidden>
  <span class="dot" aria-hidden="true"></span>
  <span class="lbl" id="syncLbl">–</span>
  <span class="spacer"></span>
  <button class="btn sm primary" id="syncBtn" data-i18n="sync.now">…</button>
  <span class="spacer"></span>
  <!-- the short form of the tally: the long one lives next to the button that
       sets it, but "how many are done?" is worth having on screen always -->
  <span class="finalmini" id="finalMini" hidden></span>
</div>

    </div>
  </div>
</div>
<div class="dlg" id="shareDlg" hidden role="dialog" aria-modal="true" aria-labelledby="shareTitle">

    <div class="dlg-h">

    </div>
    <div class="dlg-b" id="shareBody"></div>
    <div class="dlg-f" id="shareFoot"></div>
  </div>
</div>

     one waits for an OK; only pure confirmations ("copied") fade by themselves. -->
<div class="toast" id="toast" role="status" aria-live="polite">

</div>

var lang = 'en';

function t(key){
  var table = I18N[lang] || I18N.en;
  /* An empty string is a legitimate translation — German needs no auxiliary
     verb where English does. Treating it as "missing" fell back to English and
     put a stray "has" in the middle of a German sentence. */
  var s = Object.prototype.hasOwnProperty.call(table, key) ? table[key] : undefined;
  if(s === undefined) s = I18N.en[key];
  if(s === undefined) return key;
  for(var i = 1; i < arguments.length; i++){
    s = s.split('{' + (i-1) + '}').join(String(arguments[i]));
  }
  return s;
}

/* plural helpers used all over the interface */
function nPeople(n){ return n + ' ' + (n === 1 ? t('word.person') : t('word.people')); }
function nExpenses(n){ return n + ' ' + (n === 1 ? t('word.expense') : t('word.expenses')); }

function pickLang(){
  var saved = null;
  try{ saved = localStorage.getItem('billing-tool.lang'); }catch(e){}
  if(saved === 'de' || saved === 'en') return saved;
  var nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  return nav.indexOf('de') === 0 ? 'de' : 'en';
}

function applyStaticI18n(){
  document.documentElement.lang = lang;
  var nodes = document.querySelectorAll('[data-i18n]');
  for(var i=0;i<nodes.length;i++){
    var k = nodes[i].getAttribute('data-i18n');
    if(nodes[i].hasAttribute('data-i18n-html')) nodes[i].innerHTML = t(k);
    else nodes[i].textContent = t(k);
  }
  var ph = document.querySelectorAll('[data-i18n-ph]');
  for(var j=0;j<ph.length;j++) ph[j].placeholder = t(ph[j].getAttribute('data-i18n-ph'));
  var ti = document.querySelectorAll('[data-i18n-title]');
  for(var k2=0;k2<ti.length;k2++) ti[k2].title = t(ti[k2].getAttribute('data-i18n-title'));
  var ar = document.querySelectorAll('[data-i18n-aria]');
  for(var m=0;m<ar.length;m++) ar[m].setAttribute('aria-label', t(ar[m].getAttribute('data-i18n-aria')));
}
