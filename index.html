<script>
/* ============================================================
   BILLING TOOL — calculation core
   Cent-exact reimplementation of the VBA logic of
   "Billing Tool v11, (c) Andreas Deckert 2023".

   All money is handled as integer cents. No floating point
   is used anywhere in the calculation path, so balances always
   sum to exactly zero and the rounding drift documented in the
   original VBA ("BUGS not solved yet") cannot occur.
   ============================================================ */

/** Parse a user-typed amount ("1.234,56", "1234.56", "12,5") into integer cents. */
function parseAmount(input) {
  if (typeof input === 'number') return Math.round(input * 100);
  let s = String(input == null ? '' : input).trim();
  if (!s) return 0;
  s = s.replace(/[^\d.,\-]/g, '');
  const lastComma = s.lastIndexOf(',');
  const lastDot = s.lastIndexOf('.');
  if (lastComma > -1 && lastDot > -1) {
    // the rightmost separator is the decimal separator
    if (lastComma > lastDot) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
  } else if (lastComma > -1) {
    // a single comma: decimal separator unless it looks like a thousands group
    s = /,\d{3}$/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.');
  }
  const n = parseFloat(s);
  if (!isFinite(n)) return 0;
  return Math.round(n * 100);
}

/** Format integer cents as a plain number string with two decimals. */
function formatCents(cents, opts) {
  const o = opts || {};
  const sign = cents < 0 ? '-' : '';
  const abs = Math.abs(cents);
  const s = (abs / 100).toFixed(2);
  const [int, frac] = s.split('.');
  const grouped = int.replace(/\B(?=(\d{3})+(?!\d))/g, o.thousands === undefined ? ',' : o.thousands);
  const dec = o.decimal === undefined ? '.' : o.decimal;
  return sign + grouped + dec + frac;
}

/**
 * Split one expense over its sharers, cent-exact.
 * shares: array of non-negative integers, one per participant
 *         (1 = the old "x", 2 = the old "xx", any n is allowed).
 * fixed:  optional array of integer cents. A person with a fixed amount owes
 *         exactly that and takes no part in the share-based division; the
 *         remainder is what the shares divide up. This is the "Anna had the
 *         expensive dish" case, and it is off unless someone types a number.
 * Returns an array of integer cents that sums to exactly `cents` whenever the
 * expense is assignable at all.
 */
function splitExpense(cents, shares, fixed) {
  const out = shares.map(() => 0);
  let rest = cents;

  if (fixed) {
    for (let i = 0; i < shares.length; i++) {
      const f = Math.round(Number(fixed[i]) || 0);
      if (f !== 0) { out[i] = f; rest -= f; }
    }
  }

  // people with a fixed amount do not also take a share
  const eff = shares.map((n, i) => (fixed && Math.round(Number(fixed[i]) || 0) !== 0 ? 0 : n));
  const totalShares = eff.reduce((a, b) => a + b, 0);
  if (totalShares <= 0 || rest === 0) return out;

  const neg = rest < 0;
  const abs = Math.abs(rest);
  const perShare = Math.floor(abs / totalShares);
  let remainder = abs - perShare * totalShares;

  const add = eff.map((n) => perShare * n);
  if (remainder > 0) {
    const order = eff
      .map((s, i) => ({ s, i }))
      .filter((e) => e.s > 0)
      .sort((a, b) => b.s - a.s || a.i - b.i);
    let k = 0;
    while (remainder > 0) {
      add[order[k % order.length].i] += 1;
      remainder -= 1;
      k += 1;
    }
  }
  for (let i = 0; i < out.length; i++) out[i] += neg ? -add[i] : add[i];
  return out;
}

function computeBalances(people, expenses) {
  const idx = new Map(people.map((p, i) => [p.id, i]));
  const paid = people.map(() => 0);
  const owed = people.map(() => 0);
  const perExpense = [];

  for (const ex of expenses) {
    const shares = people.map((p) => {
      const v = ex.shares ? ex.shares[p.id] : 0;
      return Math.max(0, Math.floor(Number(v) || 0));
    });
    const fixed = people.map((p) => {
      const v = ex.fixed ? ex.fixed[p.id] : 0;
      return Math.round(Number(v) || 0);
    });
    const fixedTotal = fixed.reduce((a, b) => a + b, 0);
    const hasFixed = fixed.some((f) => f !== 0);
    const eff = shares.map((n, i) => (fixed[i] !== 0 ? 0 : n));
    const totalShares = eff.reduce((a, b) => a + b, 0);
    const cents = ex.cents || 0;
    const rest = cents - fixedTotal;

    /* Nobody at all is attached to this amount. Counting the payer's credit
       while nobody owes anything would leave the balances not summing to zero,
       which makes the settlement unsolvable. The expense is flagged and left
       out of the balances entirely — which is what the warning already says. */
    const unassigned = totalShares === 0 && !hasFixed && cents !== 0;
    /* fixed amounts add up to more than the expense */
    const overfixed = hasFixed && rest < 0;
    /* A remainder that nothing picks up. "Nothing" is the whole test:
       totalShares already counts only people who have a share AND no fixed
       amount of their own, so it is zero exactly when nobody is left to take
       what is over. Anything narrower cries wolf — a remainder that one
       person's tick collects is assigned, not lost. */
    const shortfixed = hasFixed && rest > 0 && totalShares === 0;

    const split = unassigned ? shares.map(() => 0) : splitExpense(cents, shares, fixed);
    if (!unassigned) {
      for (let i = 0; i < people.length; i++) owed[i] += split[i];
      if (ex.payerId != null && idx.has(ex.payerId)) paid[idx.get(ex.payerId)] += cents;
    }

    perExpense.push({
      shares,
      fixed,
      hasFixed,
      totalShares,
      split,
      rest,
      // "per person" as in the original sheet: what one share costs
      perShare: totalShares > 0 ? rest / totalShares : 0,
      unassigned,
      overfixed,
      shortfixed,
    });
  }

  const rows = people.map((p, i) => ({
    id: p.id,
    name: p.name,
    paid: paid[i],
    owed: owed[i],
    balance: paid[i] - owed[i],
  }));
  return { rows, perExpense, total: expenses.reduce((a, e) => a + (e.cents || 0), 0) };
}

/* ---------- settlement ---------------------------------------------------
   Minimising the number of transfers is the "partition into zero-sum
   subsets" problem: with m participants holding a non-zero balance and g
   disjoint groups that each sum to zero, m - g transfers are needed, and
   that is optimal. For m <= 14 we solve the partition exactly with a
   subset DP; above that we fall back to plain greedy (one group), which
   still never needs more than m - 1 transfers.
------------------------------------------------------------------------- */

function _partitionZeroSum(values) {
  const m = values.length;
  if (m === 0) return [];
  if (m > 14) return [values.map((_, i) => i)];

  const size = 1 << m;
  const sums = new Int32Array(size);
  for (let mask = 1; mask < size; mask++) {
    const low = mask & -mask;
    const i = 31 - Math.clz32(low);
    sums[mask] = sums[mask ^ low] + values[i];
  }
  const dp = new Int8Array(size).fill(-1);
  const choice = new Int32Array(size);
  dp[0] = 0;
  for (let mask = 1; mask < size; mask++) {
    const low = mask & -mask;
    let best = -1;
    let bestSub = 0;
    for (let sub = mask; sub > 0; sub = (sub - 1) & mask) {
      if (!(sub & low)) continue;
      if (sums[sub] !== 0) continue;
      const rest = dp[mask ^ sub];
      if (rest >= 0 && rest + 1 > best) {
        best = rest + 1;
        bestSub = sub;
      }
    }
    dp[mask] = best;
    choice[mask] = bestSub;
  }

  const full = size - 1;
  if (dp[full] < 0) return [values.map((_, i) => i)]; // shouldn't happen: total is 0
  const groups = [];
  let mask = full;
  while (mask) {
    const sub = choice[mask];
    const g = [];
    for (let i = 0; i < m; i++) if (sub & (1 << i)) g.push(i);
    groups.push(g);
    mask ^= sub;
  }
  return groups;
}

/**
 * Turn balances into a list of transfers.
 * rows: [{id, name, balance}] — balances must sum to zero.
 * Returns [{fromId, fromName, toId, toName, cents}]
 */
function settle(rows) {
  const nz = rows.filter((r) => r.balance !== 0);
  if (!nz.length) return [];
  const total = nz.reduce((a, r) => a + r.balance, 0);
  if (total !== 0) throw new Error('balances do not sum to zero: ' + total);

  const groups = _partitionZeroSum(nz.map((r) => r.balance));
  const transfers = [];

  for (const g of groups) {
    const creditors = g.filter((i) => nz[i].balance > 0).map((i) => ({ i, left: nz[i].balance }));
    const debtors = g.filter((i) => nz[i].balance < 0).map((i) => ({ i, left: -nz[i].balance }));
    creditors.sort((a, b) => b.left - a.left);
    debtors.sort((a, b) => b.left - a.left);
    let c = 0;
    let d = 0;
    while (c < creditors.length && d < debtors.length) {
      const amount = Math.min(creditors[c].left, debtors[d].left);
      if (amount > 0) {
        transfers.push({
          fromId: nz[debtors[d].i].id,
          fromName: nz[debtors[d].i].name,
          toId: nz[creditors[c].i].id,
          toName: nz[creditors[c].i].name,
          cents: amount,
        });
      }
      creditors[c].left -= amount;
      debtors[d].left -= amount;
      if (creditors[c].left === 0) c++;
      if (debtors[d].left === 0) d++;
    }
  }
  transfers.sort((a, b) => a.fromName.localeCompare(b.fromName) || b.cents - a.cents);
  return transfers;
}

<script>
/* ============================================================
   BILLING TOOL — shared editing over GitHub

   Three separate jobs live here, deliberately kept apart from
   the UI so they can be tested without a browser:

     1. crypto   — AES-GCM 256 under a password stretched with
                   PBKDF2. One password PER SHEET, never one for
                   the whole repository: the token that reaches
                   every participant can read every file, so the
                   password is the only thing that separates one
                   sheet from another.
     2. transport— the GitHub contents API. Optimistic locking
                   via the blob sha; a lost race is reported, not
                   silently overwritten.
     3. merge    — last-writer-wins per record, with tombstones.
                   Two people editing DIFFERENT rows both keep
                   their edit; two people editing the SAME row,
                   the later write wins. That is the honest
                   description — it is not a full CRDT.
   ============================================================ */

(function (root, factory) {
  var api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Sync = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var SUBTLE = (typeof crypto !== 'undefined' && crypto.subtle) ? crypto.subtle : null;

  /* ---------- base64 helpers (browser and node, no Buffer) ---------- */
  function bytesToB64(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }
  function b64ToBytes(b64) {
    var s = atob(b64);
    var out = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }
  function b64url(b64) { return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function unb64url(s) {
    s = String(s).replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    return s;
  }
  function utf8(str) { return new TextEncoder().encode(str); }
  function unutf8(bytes) { return new TextDecoder().decode(bytes); }

  /* ---------- keys ---------- */
  /* Everything hangs off a password now. There is no separate random key to
     pass around: the key IS the password, stretched. That is what lets a
     second device open a sheet with nothing but the location and the
     password, and it is why the stretching has to be expensive — an
     encrypted file in a repository can be attacked offline, as often and as
     fast as the attacker likes. */
  var PBKDF2_ROUNDS = 250000;

  function newSalt() {
    var b = new Uint8Array(16);
    crypto.getRandomValues(b);
    return bytesToB64(b);
  }
  function deriveKey(password, saltB64) {
    return SUBTLE.importKey('raw', utf8(String(password)), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return SUBTLE.deriveKey(
          { name: 'PBKDF2', salt: b64ToBytes(saltB64), iterations: PBKDF2_ROUNDS, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      });
  }
  /* A password worth having, for people who would otherwise type "urlaub2026".
     Digits and letters only — it gets read aloud and retyped on phones. */
  var WORDCHARS = 'abcdefghijkmnopqrstuvwxyz23456789';
  function suggestPassword() {
    var b = new Uint8Array(20);
    crypto.getRandomValues(b);
    var out = '';
    for (var i = 0; i < b.length; i++) {
      out += WORDCHARS[b[i] % WORDCHARS.length];
      if (i % 5 === 4 && i < b.length - 1) out += '-';
    }
    return out;
  }
  function randomId(n) {
    var b = new Uint8Array(n || 12);
    crypto.getRandomValues(b);
    var s = '';
    for (var i = 0; i < b.length; i++) s += ('0' + b[i].toString(16)).slice(-2);
    return s;
  }

  /* ---------- envelope ---------- */
  /* What lands in the repository. Only iv and ciphertext are readable; the
     sheet's name is inside the ciphertext, not in the filename, so the file
     listing gives nothing away either. */
  /* `label` is written in the CLEAR, next to the ciphertext. It exists so a
     device holding only the token can list what is there and ask for the
     password of the one sheet the user picks — without it there is nothing to
     put in that list but random filenames. The trade is real and it is only
     the title: anyone with the token can read the sheet's name, but not a single
     name, amount or share. Callers that pass no label write none. */
  function seal(key, salt, obj, label) {
    var iv = new Uint8Array(12);
    crypto.getRandomValues(iv);
    return SUBTLE.encrypt({ name: 'AES-GCM', iv: iv }, key, utf8(JSON.stringify(obj)))
      .then(function (ct) {
        var env = { v: 2, s: salt, iv: bytesToB64(iv), ct: bytesToB64(new Uint8Array(ct)) };
        if (label) env.l = String(label).slice(0, 120);
        return JSON.stringify(env);
      });
  }
  /* the title of a stored sheet, without decrypting anything */
  function labelOf(text) {
    try { return JSON.parse(text).l || ''; } catch (e) { return ''; }
  }
  function envelopeOf(text) {
    var env;
    try { env = JSON.parse(text); } catch (e) { throw new Error('not-an-envelope'); }
    if (!env || !env.s || !env.iv || !env.ct) throw new Error('not-an-envelope');
    return env;
  }
  function unseal(key, text) {
    var env = envelopeOf(text);
    return SUBTLE.decrypt({ name: 'AES-GCM', iv: b64ToBytes(env.iv) }, key, b64ToBytes(env.ct))
      .then(function (buf) { return JSON.parse(unutf8(new Uint8Array(buf))); },
            function () { return Promise.reject(new Error('wrong-password')); });
  }
  /* Opening costs one key derivation, so the caller keeps the key it gets back
     and reuses it for every later read and write of the same sheet. */
  function openSealed(password, text) {
    var env;
    try { env = envelopeOf(text); } catch (e) { return Promise.reject(e); }
    var key;
    return deriveKey(password, env.s)
      .then(function (k) { key = k; return unseal(k, text); })
      .then(function (obj) { return { data: obj, key: key, salt: env.s }; });
  }

  /* ---------- invitation code ---------- */
  /* Two shapes, and the difference is not cosmetic.

     BT2 — location and token sealed under the sheet's password. Inert on its
       own: a forwarded chat message gives an attacker nothing. Costs the
       recipient one extra field, and costs the sender a second channel for
       the password. If both halves travel through the same WhatsApp thread
       the separation is theatre and BT2 buys nothing over BT3.

     BT3 — everything, password included, in one string. Base64 is encoding,
       not encryption: this is a bearer key. Whoever holds the string is in,
       forever, including whoever it gets forwarded to. */
  var CODE_PREFIX = 'BT2.';
  var CODE_FULL_PREFIX = 'BT3.';

  function makeCode(cfg, password, withPassword) {
    if (withPassword) {
      var payload = { o: cfg.owner, r: cfg.repo, p: cfg.path, t: cfg.token, w: password };
      return Promise.resolve(CODE_FULL_PREFIX + b64url(bytesToB64(utf8(JSON.stringify(payload)))));
    }
    var salt = newSalt();
    return deriveKey(password, salt).then(function (k) {
      return seal(k, salt, { o: cfg.owner, r: cfg.repo, p: cfg.path, t: cfg.token });
    }).then(function (sealed) {
      return CODE_PREFIX + b64url(bytesToB64(utf8(sealed)));
    });
  }

  /** true when the code brings its own password and none needs to be typed */
  function codeIsSelfContained(code) {
    return String(code || '').trim().replace(/\s+/g, '').indexOf(CODE_FULL_PREFIX) === 0;
  }

  function shaped(o, pw) {
    if (!o || !o.o || !o.r || !o.p || !o.t) throw new Error('bad-code');
    return { owner: o.o, repo: o.r, path: o.p, token: o.t, password: pw };
  }

  function parseCode(code, password) {
    var s = String(code || '').trim().replace(/\s+/g, '');

    if (s.indexOf(CODE_FULL_PREFIX) === 0) {
      try {
        var obj = JSON.parse(unutf8(b64ToBytes(unb64url(s.slice(CODE_FULL_PREFIX.length)))));
        return Promise.resolve(shaped(obj, obj.w));
      } catch (e) { return Promise.reject(new Error('bad-code')); }
    }

    if (s.indexOf(CODE_PREFIX) !== 0) return Promise.reject(new Error('bad-prefix'));
    var inner;
    try { inner = unutf8(b64ToBytes(unb64url(s.slice(CODE_PREFIX.length)))); }
    catch (e) { return Promise.reject(new Error('bad-code')); }
    return openSealed(password, inner).then(function (r) {
      return shaped(r.data, password);
    }, function (e) {
      throw new Error(e && e.message === 'wrong-password' ? 'wrong-password' : 'bad-code');
    });
  }

  /* ---------- GitHub contents API ---------- */
  var API = 'https://api.github.com';
  function headers(token) {
    return {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    };
  }
  function url(cfg) {
    return API + '/repos/' + encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo) +
           '/contents/' + cfg.path.split('/').map(encodeURIComponent).join('/');
  }

  /* Returns {text, sha} — or {missing:true} when the file is not there yet,
     which is the normal state the first time a sheet is shared. */
  function ghGet(cfg) {
    return fetch(url(cfg) + '?ref=main&t=' + Date.now(), { headers: headers(cfg.token), cache: 'no-store' })
      .then(function (res) {
        if (res.status === 404) return { missing: true };
        if (res.status === 401 || res.status === 403) return res.json().then(function (j) {
          throw errWith(res.status, j);
        }, function () { throw errWith(res.status, null); });
        if (!res.ok) throw errWith(res.status, null);
        return res.json().then(function (j) {
          /* content comes back base64 with newlines in it */
          var raw = String(j.content || '').replace(/\s+/g, '');
          return { text: unutf8(b64ToBytes(raw)), sha: j.sha };
        });
      });
  }

  function errWith(status, body) {
    var e = new Error((body && body.message) || ('HTTP ' + status));
    e.status = status;
    return e;
  }

  /* The manual route has no code to tell it which file to open, so it asks the
     repository what is there. Names give nothing away — they are random. */
  function ghList(cfg, dir) {
    var u = API + '/repos/' + encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo) +
            '/contents/' + encodeURIComponent(dir) + '?ref=main&t=' + Date.now();
    return fetch(u, { headers: headers(cfg.token), cache: 'no-store' }).then(function (res) {
      if (res.status === 404) return [];
      if (!res.ok) throw errWith(res.status, null);
      return res.json().then(function (j) {
        return (Array.isArray(j) ? j : []).filter(function (x) { return x.type === 'file'; })
          .map(function (x) { return x.path; });
      });
    });
  }

  /* sha === null means "create". A 409/422 means somebody else wrote in the
     meantime — reported as {conflict:true} so the caller can re-merge instead
     of blindly overwriting their work. */
  function ghPut(cfg, text, sha, message) {
    var body = {
      message: message || 'billing-tool',
      content: bytesToB64(utf8(text)),
      branch: 'main',
    };
    if (sha) body.sha = sha;
    return fetch(url(cfg), { method: 'PUT', headers: headers(cfg.token), body: JSON.stringify(body) })
      .then(function (res) {
        if (res.status === 409 || res.status === 422) return { conflict: true };
        if (!res.ok) return res.json().then(function (j) { throw errWith(res.status, j); },
                                            function () { throw errWith(res.status, null); });
        return res.json().then(function (j) { return { sha: j.content && j.content.sha }; });
      });
  }

  /* Deleting needs the blob sha, i.e. you have to have read the file first —
     which also means a stale listing cannot delete something newer by accident. */
  function ghDelete(cfg, sha, message) {
    return fetch(url(cfg), {
      method: 'DELETE',
      headers: headers(cfg.token),
      body: JSON.stringify({ message: message || 'billing-tool: remove', sha: sha, branch: 'main' }),
    }).then(function (res) {
      if (res.status === 409 || res.status === 422) return { conflict: true };
      if (!res.ok) return res.json().then(function (j) { throw errWith(res.status, j); },
                                          function () { throw errWith(res.status, null); });
      return { ok: true };
    });
  }

  /* ---------- merge ---------- */
  function byId(list) {
    var m = {};
    for (var i = 0; i < (list || []).length; i++) m[list[i].id] = list[i];
    return m;
  }
  /* later mtime wins; a tie falls to the local side so a sync is idempotent */
  function pick(a, b) {
    if (!a) return b;
    if (!b) return a;
    return (Number(b.m) || 0) > (Number(a.m) || 0) ? b : a;
  }
  function mergeList(local, remote) {
    var la = byId(local), rb = byId(remote), out = [], seen = {};
    function add(rec) {
      if (!rec || seen[rec.id]) return;
      seen[rec.id] = 1;
      out.push(pick(la[rec.id], rb[rec.id]));
    }
    (local || []).forEach(add);
    (remote || []).forEach(add);
    return out;
  }
  function alive(list) { return list.filter(function (r) { return !r.x; }); }

  /* Who has claimed which person as "me". One entry per person, holding the
     device that claimed it and when. A release is an entry with no device, so
     that it can out-date an older claim instead of vanishing and letting the
     claim come back from the other side.

     Later stamp wins, and the loser finds out: a device checks after every
     exchange whether its own claim survived. First-come-first-served would
     read better on paper, but it needs the clocks to agree, and they do not. */
  function mergeClaims(local, remote) {
    var out = {};
    var all = {};
    var k;
    for (k in (local || {})) all[k] = 1;
    for (k in (remote || {})) all[k] = 1;
    for (k in all) {
      var a = (local || {})[k];
      var b = (remote || {})[k];
      if (!a) { out[k] = b; continue; }
      if (!b) { out[k] = a; continue; }
      var ma = Number(a.m) || 0, mb = Number(b.m) || 0;
      if (mb > ma) out[k] = b;
      else if (ma > mb) out[k] = a;
      /* same instant on two devices: pick deterministically, or the two would
         disagree forever, each convinced it holds the claim */
      else out[k] = (String(a.d || '') <= String(b.d || '')) ? a : b;
    }
    return out;
  }

  /* "I consider this settled." One entry per device, so no two devices ever
     write the same key — except when a change revokes them all at once, and
     that is a broadcast the later stamp is meant to win. */
  function mergeFinal(local, remote) {
    var out = {}, all = {}, k;
    for (k in (local || {})) all[k] = 1;
    for (k in (remote || {})) all[k] = 1;
    for (k in all) {
      var a = (local || {})[k], b = (remote || {})[k];
      if (!a) { out[k] = b; continue; }
      if (!b) { out[k] = a; continue; }
      /* Round first, clock only to break a tie inside one round. A phone whose
         clock runs slow would otherwise lose the confirmation it has just
         given to the cancellation it is answering. */
      var ra = Number(a.r) || 0, rb = Number(b.r) || 0;
      if (rb !== ra) { out[k] = rb > ra ? b : a; continue; }
      out[k] = ((Number(b.m) || 0) > (Number(a.m) || 0)) ? b : a;
    }
    return out;
  }

  /* ---- why a confirmation carries a round number ----
     Two phones do not agree on the time. A confirmation and the edit that
     cancels it were resolved by comparing their timestamps, so a phone whose
     clock ran a minute fast kept a confirmation that had already been
     cancelled — silently, with no message and no marks, which is the one
     outcome the whole mechanism exists to prevent.
     So a change bumps a counter instead. The counter only ever grows and is
     merged as a maximum, which no clock can argue with: a confirmation given
     in round 3 is dead the moment the sheet reaches round 4. Sheets from
     before this have no counter and no round on their confirmations — both
     read as 0, so they go on working until the first change bumps them. */
  function finalAlive(entry, rev) {
    if (!entry || !entry.a) return false;
    return (Number(entry.r) || 0) >= (Number(rev) || 0);
  }
  /* the confirmations as they actually count, with the dead ones cleared */
  function liveFinal(final, rev) {
    var out = {}, k;
    for (k in (final || {})) {
      var e = final[k];
      out[k] = finalAlive(e, rev) ? e : { a: 0, m: Number(e && e.m) || 0, r: Number(e && e.r) || 0 };
    }
    return out;
  }

  /**
   * Merge two sheet states. Neither side is authoritative: every record is
   * resolved on its own, so two people working on different rows both keep
   * what they did.
   */
  function mergeState(local, remote) {
    if (!remote) return local;
    var out = {
      title: (Number(remote.tm) || 0) > (Number(local.tm) || 0) ? remote.title : local.title,
      tm: Math.max(Number(local.tm) || 0, Number(remote.tm) || 0),
      currency: (Number(remote.cm) || 0) > (Number(local.cm) || 0) ? remote.currency : local.currency,
      cm: Math.max(Number(local.cm) || 0, Number(remote.cm) || 0),
      people: mergeList(local.people, remote.people),
      expenses: mergeList(local.expenses, remote.expenses),
      claims: mergeClaims(local.claims, remote.claims),
      /* Where to send somebody money, and which transfers have been handed over
         to a bank or to PayPal. Both are notes ABOUT the settlement rather than
         part of it: they are merged like claims, entry by entry and newest
         wins, but they are deliberately left out of the change comparison, so
         typing an IBAN never cancels anybody's confirmation. */
      pay: mergeClaims(local.pay, remote.pay),
      sent: mergeClaims(local.sent, remote.sent),
      final: mergeFinal(local.final, remote.final),
      /* only ever forwards, on every device */
      rev: Math.max(Number(local.rev) || 0, Number(remote.rev) || 0),
    };
    /* newest expense first, the same order a single device produces */
    out.expenses.sort(function (a, b) { return (Number(b.c) || 0) - (Number(a.c) || 0); });
    return out;
  }

  /* Cheap comparison to decide whether a push is needed at all — every
     needless PUT is a commit in someone's history and an API call. */
  function fingerprint(st) {
    if (!st) return '';
    return JSON.stringify([
      st.title, st.tm, st.currency, st.cm,
      (st.people || []).map(function (p) { return [p.id, p.m, p.x ? 1 : 0, p.name]; }),
      (st.expenses || []).map(function (e) {
        return [e.id, e.m, e.x ? 1 : 0, e.payerId, e.desc, e.cents, e.shares, e.fixed, e.c];
      }),
      Object.keys(st.claims || {}).sort().map(function (k) {
        return [k, st.claims[k] && st.claims[k].d, st.claims[k] && st.claims[k].m];
      }),
      Object.keys(st.pay || {}).sort().map(function (k) {
        var v = st.pay[k] || {};
        return [k, v.pp, v.iban, v.m];
      }),
      Object.keys(st.sent || {}).sort().map(function (k) {
        var v = st.sent[k] || {};
        return [k, v.via, v.m];
      }),
      Object.keys(st.final || {}).sort().map(function (k) {
        return [k, st.final[k] && st.final[k].a ? 1 : 0, st.final[k] && st.final[k].m,
                st.final[k] && st.final[k].r];
      }),
      Number(st.rev) || 0,
    ]);
  }

  /* ---- "we are done": the two-day rule ----
     Somebody has to be allowed to go on holiday. Once the first device confirms,
     a clock starts: a device that neither confirms nor objects within two days
     counts as confirmed, so one silent phone cannot hold the group hostage.
     Pure arithmetic on the stored timestamps — no server decides this, every
     device works out the same answer for itself. */
  var AUTO_FINAL_MS = 48 * 60 * 60 * 1000;

  /* when the round began: the oldest confirmation still standing */
  function finalRoundStart(final){
    var t = 0;
    for(var d in (final || {})){
      if(!(final[d] && final[d].a)) continue;
      var m = Number(final[d].m) || 0;
      if(!t || m < t) t = m;
    }
    return t;
  }
  /* confirmed, or silent for two days since the round started AND since its own
     last word — pressing "still checking" is a word, and buys another two days */
  function deemedFinal(final, d, now){
    final = final || {};
    var e = final[d];
    if(e && e.a) return true;
    var start = finalRoundStart(final);
    if(!start) return false;
    if(now - start < AUTO_FINAL_MS) return false;
    return (now - (Number(e && e.m) || 0)) >= AUTO_FINAL_MS;
  }
  function finalTally(roster, final, now){
    var ok = 0, auto = 0;
    (roster || []).forEach(function(d){
      if(final && final[d] && final[d].a){ ok++; return; }
      if(deemedFinal(final, d, now)){ ok++; auto++; }
    });
    return { ok: ok, total: (roster || []).length, auto: auto };
  }
  /* what is left of the two days for one device, 0 when nothing is running */
  function autoFinalLeft(final, d, now){
    final = final || {};
    var start = finalRoundStart(final);
    if(!start || (final[d] && final[d].a)) return 0;
    var mine = Number(final[d] && final[d].m) || 0;
    var left = Math.max(start, mine) + AUTO_FINAL_MS - now;
    return left > 0 ? left : 0;
  }

  return {
    AUTO_FINAL_MS: AUTO_FINAL_MS, finalRoundStart: finalRoundStart,
    deemedFinal: deemedFinal, finalTally: finalTally, autoFinalLeft: autoFinalLeft,
    newSalt: newSalt, deriveKey: deriveKey, suggestPassword: suggestPassword, randomId: randomId,
    seal: seal, unseal: unseal, openSealed: openSealed, labelOf: labelOf,
    makeCode: makeCode, parseCode: parseCode, codeIsSelfContained: codeIsSelfContained,
    CODE_PREFIX: CODE_PREFIX, CODE_FULL_PREFIX: CODE_FULL_PREFIX,
    ghGet: ghGet, ghPut: ghPut, ghList: ghList, ghDelete: ghDelete,
    mergeState: mergeState, mergeList: mergeList, mergeClaims: mergeClaims,
    mergeFinal: mergeFinal, finalAlive: finalAlive, liveFinal: liveFinal,
    alive: alive, fingerprint: fingerprint,
    _b64: { bytesToB64: bytesToB64, b64ToBytes: b64ToBytes, b64url: b64url, unb64url: unb64url },
  };
});

</script>
<script>
(function(){
'use strict';

/* ============================ state ============================ */
var STORE_KEY = 'billing-tool.v1';
var state = null;
var memoryOnly = false;

function uid(){ return 'p' + Math.random().toString(36).slice(2,9); }

/* The app ships without any data: no people, no expenses, no example. */
function emptyState(){
  /* tm/cm are the edit times of the two scalar fields, `gone` holds the
     tombstones of deleted records. Both only matter for shared sheets, but
     they are always kept so a local sheet can become a shared one later. */
  return { title:'', currency:'\u20ac', people:[], expenses:[], tm:0, cm:0,
           gone:{p:{},e:{}}, claims:{}, final:{}, rev:0, pay:{}, sent:{} };
}

function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){
      var st = JSON.parse(raw);
      if(st && st.people && st.expenses) return normalize(st);
    }
  }catch(e){ memoryOnly = true; }
  return emptyState();
}
/* Every record carries the time it was last edited — that is what decides a
   conflict when two people work on the same sheet. Stamping it centrally here,
   by comparing against the previous snapshot, means no edit handler can forget
   to do it; there are around thirty of them. */
var lastSnap = null;
function recFp(r){ return JSON.stringify(r, function(k, v){ return k === 'm' ? undefined : v; }); }
function snapshot(st){
  var s = { title: st.title, currency: st.currency, p: {}, e: {} };
  st.people.forEach(function(x){ s.p[x.id] = recFp(x); });
  st.expenses.forEach(function(x){ s.e[x.id] = recFp(x); });
  return s;
}
/* When the user last touched anything. The exchange refuses to redraw the
   screen for a few seconds afterwards: pulling the server's version into the
   DOM while somebody is halfway through adding a person wipes the half-typed
   row out from under them. Our own change is pushed either way — only the
   redraw waits. */
var lastLocalEdit = 0;

function stampChanges(){
  var now = Date.now();
  var prev = lastSnap;
  if(!prev){ lastSnap = snapshot(state); return; }
  if(state.title !== prev.title) state.tm = now;
  if(state.currency !== prev.currency) state.cm = now;
  ['people','expenses'].forEach(function(kind){
    var key = kind === 'people' ? 'p' : 'e';
    var seen = {};
    state[kind].forEach(function(r){
      seen[r.id] = 1;
      if(prev[key][r.id] !== recFp(r)) r.m = now;
      /* a record that comes back after a delete must outlive its tombstone */
      if(state.gone[key][r.id]){ delete state.gone[key][r.id]; r.m = now; }
    });
    /* A tombstone carries the device that made it, so the other phones can say
       WHO removed the entry rather than "somebody". */
    for(var id in prev[key]) if(!seen[id]) state.gone[key][id] = { m: now, d: deviceId };
  });
  var after = snapshot(state);
  if(JSON.stringify(after) !== JSON.stringify(prev)){
    lastLocalEdit = now;
    /* A number that moves after somebody said "this is settled" makes that
       agreement worthless — so the change cancels every confirmation, not just
       the ones on this device. */
    finalNotice = null;
    /* An edit is this device's answer to the marks: it has seen them. They go
       without a redraw — this runs on every keystroke, and rebuilding the table
       under a cursor is exactly what the marks were meant to help with. */
    if(marksShown()) stripMarks();
    clearMarks();
    if($('finalBar')) renderFinal();
    if(revokeAllFinal(now)){
      lastFinalSeen = JSON.stringify(stFinal());
      applyFinalLock();
      /* the cards themselves are locked in applyGate, not here — without this
         the sheet read as open again while every card stayed inert */
      applyGate();
      if($('finalBar')) renderFinal();
      toast(t('final.revoked.mine'));
    }
  }
  lastSnap = after;
}

/* Replacing the whole sheet is not an edit: the baseline moves with it, or the
   next save would stamp every record as "just changed" and a loaded file would
   wrongly outrank everything on the server. */
var saveTargetChosen = false;
function adopt(st){
  state = st; lastSnap = snapshot(state); saveTargetChosen = false;
  /* the live view, always: a dead confirmation must not read as one that was
     just taken back the next time these are compared */
  lastFinalSeen = JSON.stringify(stFinal());
  return state;
}

function save(){
  stampChanges();
  syncSoon();
  if(memoryOnly) return;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ memoryOnly = true; }
}
function normalize(st){
  st.currency = st.currency || '\u20ac';
  st.title = String(st.title == null ? '' : st.title);
  st.tm = Number(st.tm) || 0;
  st.cm = Number(st.cm) || 0;
  var g = st.gone && typeof st.gone === 'object' ? st.gone : {};
  st.gone = { p: {}, e: {} };
  ['p','e'].forEach(function(gk){
    var src = g[gk] || {};
    for(var gid in src){
      var v = src[gid];
      /* sheets written before tombstones had an author hold a bare timestamp */
      st.gone[gk][gid] = (v && typeof v === 'object')
        ? { m: Number(v.m) || 0, d: v.d ? String(v.d) : null }
        : { m: Number(v) || 0, d: null };
    }
  });
  /* who says "that one is me" — see the claim section below */
  var cl = st.claims && typeof st.claims === 'object' ? st.claims : {};
  st.claims = {};
  for(var ck in cl){
    var c = cl[ck];
    if(c && typeof c === 'object') st.claims[ck] = { d: c.d ? String(c.d) : null, m: Number(c.m) || 0 };
  }
  /* who has said "this is settled" */
  var fi = st.final && typeof st.final === 'object' ? st.final : {};
  st.final = {};
  for(var fk in fi){
    var fv = fi[fk];
    if(fv && typeof fv === 'object')
      st.final[fk] = { a: fv.a ? 1 : 0, m: Number(fv.m) || 0, r: Number(fv.r) || 0 };
  }
  /* the round the sheet is in: bumped by every change that cancels a
     confirmation, and never goes backwards */
  st.rev = Number(st.rev) || 0;
  /* Where to send somebody money. Kept per person id, beside the people rather
     than inside them, so that entering an IBAN is not an edit to the sheet: it
     must never cancel a confirmation or raise a change mark. */
  var py = st.pay && typeof st.pay === 'object' ? st.pay : {};
  st.pay = {};
  for(var pk in py){
    var pv = py[pk];
    if(pv && typeof pv === 'object') st.pay[pk] = {
      pp: String(pv.pp || ''), iban: String(pv.iban || ''), m: Number(pv.m) || 0 };
  }
  /* Which transfers have been handed to a bank or to PayPal, keyed "from>to".
     Same reasoning: a note about the settlement, not part of it. */
  var sn = st.sent && typeof st.sent === 'object' ? st.sent : {};
  st.sent = {};
  for(var sk in sn){
    var sv = sn[sk];
    if(sv && typeof sv === 'object') st.sent[sk] = {
      via: String(sv.via || ''), m: Number(sv.m) || 0, d: sv.d ? String(sv.d) : null };
  }
  st.people = (st.people||[]).map(function(p){
    var pn = {id:p.id||uid(), name:String(p.name||'').toUpperCase(), m:Number(p.m)||0};
    if(p.o) pn.o = String(p.o);
    return pn;
  });
  var n = (st.expenses||[]).length;
  st.expenses = (st.expenses||[]).map(function(e, i){
    var sh={};
    for(var k in (e.shares||{})){ var n=Math.max(0,Math.floor(Number(e.shares[k])||0)); if(n) sh[k]=n; }
    var fx={}, any=false;
    for(var k2 in (e.fixed||{})){
      var c=Math.round(Number(e.fixed[k2])||0);
      if(c){ fx[k2]=c; any=true; }
    }
    var out = {id:e.id||uid(), payerId:e.payerId||null, desc:String(e.desc||''),
               cents:Math.round(Number(e.cents)||0), shares:sh,
               m:Number(e.m)||0,
               /* c orders the list. A sheet written before shared editing has
                  none, so it is derived from the position — the list already
                  runs newest first, so index 0 must end up with the largest c. */
               c:Number(e.c) || (n - i)};
    if(e.o) out.o = String(e.o);
    if(any) out.fixed = fx;
    return out;
  });
  return st;
}

/* A pointing hand, drawn rather than borrowed from the emoji font: the emoji
   differs wildly between Android, iOS and the desktop, and this one has to
   read as a button at 17 pixels. */
/* the pointing hand lives in the stylesheet, as a background image */

/* ======================= "that one is me" =======================
   A person can be claimed by exactly one device. The claim travels with the
   sheet so that no two people can pick the same name; the SUBSTITUTION is
   local, because "me" only means anything on the device that said it.

   The device id is per browser profile, not per person: clearing the site data
   loses the claim, which is the same thing that loses the sheet, so nothing is
   made worse by it. */
var DEVICE_KEY = 'billing-tool.device';
var deviceId = (function(){
  var v = null;
  try{ v = localStorage.getItem(DEVICE_KEY); }catch(e){}
  if(v) return v;
  v = 'd' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  try{ localStorage.setItem(DEVICE_KEY, v); }catch(e){}
  return v;
})();

/** the person this device calls "me", or null */
function meId(){
  for(var id in state.claims){
    var c = state.claims[id];
    if(c && c.d === deviceId) return id;
  }
  return null;
}
/** the device holding a person, or null */
function claimedBy(personId){
  var c = state.claims[personId];
  return (c && c.d) ? c.d : null;
}
function isMe(personId){ return claimedBy(personId) === deviceId; }

/** What to show instead of a person's name. `mode` picks the grammatical form
    German needs and English does not. */
/* "me" is a word this app puts on the screen in place of a name. If a name
   could also BE that word, nobody could tell the two apart — so the word is
   reserved, in both languages, whichever one is switched on. */
function isReservedName(nm){
  var n = String(nm || '').trim().toLowerCase();
  if(!n) return false;
  var words = [];
  ['en','de'].forEach(function(l){
    ['me.nom','me.acc'].forEach(function(k){
      var v = I18N[l] && I18N[l][k];
      if(v) words.push(String(v).toLowerCase());
    });
  });
  return words.indexOf(n) > -1;
}

function shownName(personId, mode){
  if(isMe(personId)) return t(mode === 'acc' ? 'me.acc' : 'me.nom');
  return personName(personId);
}

/* =================== "we are done" ===================
   Before anybody transfers money, every phone has to agree that the sheet is
   finished. One flag per device, kept with the sheet:

     - confirming locks THIS device and tells the others
     - confirming again unlocks it and tells them too
     - any change to the sheet revokes EVERY confirmation, because a number
       that moved after the fact makes the earlier agreement worthless
     - once every device has confirmed, nothing can be edited anywhere

   Who counts as a participant: the devices that have claimed a person as "me",
   plus any device that has confirmed. A phone that opened the sheet once and
   never claimed anybody is not waited for — and one that claimed somebody and
   never comes back WILL hold the count open until that claim is released. */

function finalRoster(){
  var seen = {}, out = [], cl = (state && state.claims) || {}, fi = (state && state.final) || {};
  function add(d){ if(d && !seen[d]){ seen[d] = 1; out.push(d); } }
  for(var pid in cl){
    var c = cl[pid];
    if(c && c.d) add(c.d);
  }
  for(var dv in fi) add(dv);
  add(deviceId);
  return out;
}
function iAmFinal(){
  var f = (state && state.final) || {};
  return Sync.finalAlive(f[deviceId], (state && state.rev) || 0);
}

/* Which people have said "final" — by name, because "somebody" is no use when
   you are trying to work out who still has to look. A device without a claimed
   person cannot normally exist on a shared sheet any more, but an old sheet may
   still carry one, so the count falls back to the anonymous wording. */
function personOfDevice(d){
  for(var pid in state.claims){
    var c = state.claims[pid];
    if(c && c.d === d) return pid;
  }
  return null;
}
/* one name, or a count once several are involved */
function whoText(devices, one, many){
  if(!devices.length) return '';
  if(devices.length > 1) return t(many, devices.length);
  var pid = personOfDevice(devices[0]);
  return t(one, (pid && personName(pid)) || t('final.someone.who'));
}
function finalNames(exceptMe){
  var fi = (state && state.final) || {}, out = [];
  for(var d in fi){
    if(!(fi[d] && fi[d].a)) continue;
    if(exceptMe && d === deviceId) continue;
    out.push(d);
  }
  return { devices: out, total: out.length };
}
/* one name, or a count once several agree */
function finalSomeoneText(){
  return whoText(finalNames(true).devices, 'final.someone', 'final.someone.n');
}

/* Somebody has to be allowed to go on holiday. Once the first device confirms,
   a clock starts: a device that neither confirms nor objects within two days
   counts as confirmed, so one silent phone cannot hold the group hostage. The
   rule is announced in the message the others receive — it must never be a
   surprise. Every device works it out from the same timestamps, so no server
   decides anything. */
/* The arithmetic lives with the merge code, where it can be tested without a
   browser and where every device is guaranteed to use the same version of it. */
/* The confirmations as they COUNT: one that was given before the last change
   is dead, whatever the two clocks involved make of the timestamps. */
function stFinal(){
  return Sync.liveFinal((state && state.final) || {}, (state && state.rev) || 0);
}
function autoFinalLeft(now){ return Sync.autoFinalLeft(stFinal(), deviceId, now || Date.now()); }

function finalTally(){ return Sync.finalTally(finalRoster(), stFinal(), Date.now()); }
function allFinal(){
  var t = finalTally();
  return t.total > 0 && t.ok === t.total;
}
/* the only gate the rest of the app has to ask about */
function inputsLocked(){ return iAmFinal() || allFinal(); }

function setFinal(on){
  /* stamped with the round it was given in, so a later change can kill it */
  state.final[deviceId] = { a: on ? 1 : 0, m: Date.now(), r: Number(state.rev) || 0 };
  lastFinalSeen = JSON.stringify(stFinal());
  applyFinalLock();
  renderAll();
  save();
  if(syncCfg) syncNow();
}

/* A change after somebody confirmed cancels every confirmation. Called from
   the one place that knows a change really happened. */
function revokeAllFinal(now){
  var rev = Number(state.rev) || 0;
  var any = false;
  for(var d in state.final) if(Sync.finalAlive(state.final[d], rev)) any = true;
  if(!any) return false;
  /* the round number is what actually cancels them; the flags follow so that
     an older build reading this sheet sees the same thing */
  state.rev = rev + 1;
  /* the flags follow so an older build reading this sheet sees the same thing,
     but they are stamped with the round they CANCEL, not the new one — a
     confirmation given in the new round has to be able to out-rank them */
  for(var d2 in state.final) state.final[d2] = { a: 0, m: now, r: rev };
  return true;
}

/* What this device last saw, so it can tell somebody else's doing from its own */
var lastFinalSeen = '{}';
var finalNotice = null;      /* 'revoked' | 'someone' | null */

/* Which records the last exchange brought in different from what was here.
   A message saying "something changed" is not much use on a sheet with twenty
   rows — the point is to show WHICH one, so it can be checked in a second. */
var changedMark = { p: {}, e: {} };
/* Once a confirmation has been cancelled by somebody else's edit, this device
   is re-checking the sheet — and everything that arrives from then on is part
   of what it has to re-check, not just the one change that started it. So the
   marks keep collecting until this device either edits something itself or
   confirms again. */
var marksActive = false;
/* A record somebody else deleted cannot be marked — it is not there any more.
   It is kept as a ghost instead: struck through, not editable, in the list
   where it was, until the marks are answered. Somebody has to be able to see
   WHAT was removed before agreeing that the sheet is finished. */
var ghosts = { p: {}, e: {} };
function clearMarks(){
  changedMark = { p: {}, e: {} };
  ghosts = { p: {}, e: {} };
  ghostShares = {};
  marksActive = false;
}
/* What a person who has been removed was down for, expense by expense. Their
   column is gone from the table the moment they are, so without this there is
   no way to see WHAT the removal changed — only that something did. */
var ghostShares = {};
function addGhosts(prev, now){
  if(!prev || !now) return;
  ['p','e'].forEach(function(k){
    var id;
    for(id in prev[k]){
      if(now[k][id] || ghosts[k][id]) continue;
      try{ ghosts[k][id] = JSON.parse(prev[k][id]); }catch(e){}
      if(k === 'p' && ghosts.p[id]) ghostShares[id] = sharesOf(prev.e, id);
    }
    /* put back what came back */
    for(id in ghosts[k]) if(now[k][id]){
      delete ghosts[k][id];
      if(k === 'p') delete ghostShares[id];
    }
  });
}
/* every share this person held, read off the snapshot taken before they went */
function sharesOf(snapE, pid){
  var out = {};
  for(var eid in snapE){
    var rec = null;
    try{ rec = JSON.parse(snapE[eid]); }catch(e){}
    if(!rec) continue;
    var n = rec.shares ? (Number(rec.shares[pid]) || 0) : 0;
    var fx = rec.fixed ? (Number(rec.fixed[pid]) || 0) : 0;
    if(n || fx) out[eid] = { n: n, fx: fx };
  }
  return out;
}
/* "removed by <name>" — the name comes from the tombstone the deletion left */
function goneByText(kind, id){
  var tomb = (state.gone && state.gone[kind]) ? state.gone[kind][id] : null;
  var who = tomb && tomb.d ? personOfDevice(tomb.d) : null;
  var nm = who ? personName(who) : '';
  return nm ? t('row.gone', nm) : t('row.gone.anon');
}
function anyGhosts(){
  for(var a in ghosts.p) return true;
  for(var b in ghosts.e) return true;
  return false;
}
/* take the marks off the screen without redrawing anything */
function stripMarks(){
  var i, n = document.querySelectorAll('.chg');
  for(i=0;i<n.length;i++) n[i].classList.remove('chg');
  n = document.querySelectorAll('.changed');
  for(i=0;i<n.length;i++) n[i].classList.remove('changed', 'whole');
  /* the ghosts are whole elements, not classes — they have to go too */
  n = document.querySelectorAll('tr.gone, .chip.gone');
  for(i=n.length-1;i>=0;i--) n[i].parentNode.removeChild(n[i]);
}
function addMarks(diff){
  ['p','e'].forEach(function(k){
    for(var id in diff[k]){
      var have = changedMark[k][id];
      if(!have){ changedMark[k][id] = diff[k][id]; continue; }
      for(var f in diff[k][id]) have[f] = 1;
    }
  });
}
function marksShown(){
  for(var a in changedMark.p) return true;
  for(var b in changedMark.e) return true;
  return anyGhosts();
}
/* Which FIELD moved, not merely which row. A dashed frame around a whole card
   says "something in here"; a frame around the amount says what to look at.
   The snapshot keeps each record as the JSON it was, so the two versions can
   simply be compared key by key. */
function fieldsOf(a, b){
  var out = {}, k;
  if(a.payerId !== b.payerId) out.payer = 1;
  if((a.desc || '') !== (b.desc || '')) out.desc = 1;
  if((Number(a.cents) || 0) !== (Number(b.cents) || 0)) out.amt = 1;
  if((a.name || '') !== (b.name || '')) out.name = 1;
  var sa = a.shares || {}, sb = b.shares || {}, seen = {};
  for(k in sa) seen[k] = 1;
  for(k in sb) seen[k] = 1;
  for(k in seen) if((Number(sa[k]) || 0) !== (Number(sb[k]) || 0)) out['share:' + k] = 1;
  var fa = a.fixed || {}, fb = b.fixed || {}, seenF = {};
  for(k in fa) seenF[k] = 1;
  for(k in fb) seenF[k] = 1;
  for(k in seenF) if((Number(fa[k]) || 0) !== (Number(fb[k]) || 0)) out['fixed:' + k] = 1;
  return out;
}
function diffSnaps(prev, now){
  var out = { p: {}, e: {} };
  if(!prev || !now) return out;
  ['p','e'].forEach(function(k){
    for(var id in now[k]){
      if(prev[k][id] === now[k][id]) continue;
      if(!prev[k][id]){ out[k][id] = { added: 1 }; continue; }   /* wholly new */
      var was = null, is = null;
      try{ was = JSON.parse(prev[k][id]); is = JSON.parse(now[k][id]); }catch(e){}
      out[k][id] = (was && is) ? fieldsOf(was, is) : { added: 1 };
    }
  });
  return out;
}
/* did this one field move? */
function chg(kind, id, field){
  var rec = changedMark[kind][id];
  if(!rec || rec.added) return false;    /* a new record is framed as a whole */
  return !!rec[field];
}
/* nothing but a whole new record marks the card as a whole */
function chgWhole(kind, id){
  var rec = changedMark[kind][id];
  return !!(rec && rec.added);
}

/* The mark on the row and the sentence about it belong together — the message
   is read once and dismissed, and it has to say where to look. */
function revokedText(){
  return t('final.revoked') + (marksShown() ? ' ' + t('final.marked') : '');
}

function noticeFinalChange(beforeJson, prevSnap){
  var before = {};
  try{ before = JSON.parse(beforeJson == null ? lastFinalSeen : beforeJson); }catch(e){}
  var nowSeen = stFinal();
  var nowSnap = snapshot(state);
  var diff = diffSnaps(prevSnap, nowSnap);
  var dataMoved = false;
  for(var k1 in diff.p) dataMoved = true;
  for(var k2 in diff.e) dataMoved = true;
  var k3;
  for(k3 in (prevSnap ? prevSnap.p : {})) if(!nowSnap.p[k3]) dataMoved = true;
  for(k3 in (prevSnap ? prevSnap.e : {})) if(!nowSnap.e[k3]) dataMoved = true;

  /* Who changed their mind, and in which direction. A confirmation that is
     taken back and given again is a NEW confirmation even though the flag reads
     the same as before — which is why the timestamp is compared too, and not
     just the flag. */
  var seen = {}, gained = [], lost = [], d;
  for(d in before) seen[d] = 1;
  for(d in nowSeen) seen[d] = 1;
  for(d in seen){
    if(d === deviceId) continue;
    var a0 = !!(before[d] && before[d].a), m0 = Number(before[d] && before[d].m) || 0;
    var a1 = !!(nowSeen[d] && nowSeen[d].a), m1 = Number(nowSeen[d] && nowSeen[d].m) || 0;
    if(a1 && (!a0 || m1 > m0)) gained.push(d);
    else if(a0 && !a1) lost.push(d);
  }

  var wasMine = !!(before[deviceId] && before[deviceId].a);
  var isMine = iAmFinal();

  /* already re-checking: every further edit from elsewhere joins the list */
  if(marksActive){ addMarks(diff); addGhosts(prevSnap, nowSnap); }

  if(wasMine && !isMine){
    /* my own confirmation was cancelled — only a change to the sheet does that */
    finalNotice = 'revoked';
    /* the device that had confirmed is the one that has to re-check, so it is
       the one that gets the changed fields marked */
    marksActive = true; addMarks(diff); addGhosts(prevSnap, nowSnap);
    toast(revokedText());
  }else if(lost.length && dataMoved){
    /* somebody's edit cancelled the others' confirmations; this device had none
       to lose, but the sheet moved and the mark is still worth having */
    finalNotice = 'revoked';
    marksActive = true; addMarks(diff); addGhosts(prevSnap, nowSnap);
    toast(revokedText());
  }else if(lost.length){
    /* no edit, so somebody simply took their word back */
    finalNotice = 'unfinal';
    lastUnfinal = lost;
    toast(whoText(lost, 'final.unfinal', 'final.unfinal.n'));
  }else if(gained.length && !isMine){
    finalNotice = 'someone';
    toast(finalSomeoneText() || t('final.someone', t('final.someone.who')));
  }
  lastFinalSeen = JSON.stringify(nowSeen);
}

/* what the banner says about somebody else taking their confirmation back */
var lastUnfinal = [];

function applyFinalLock(){
  var mine = iAmFinal();
  var all = allFinal();
  document.body.classList.toggle('await-final', mine && !all);
  document.body.classList.toggle('all-final', all);
}

/* The confirmation bar under the transfers. Shown as soon as the sheet is
   shared — it is the one place that says how many of the others are done. */
function fmtLeft(ms){
  var mins = Math.max(1, Math.round(ms / 60000));
  return mins >= 120 ? t('time.h', Math.round(mins / 60)) : t('time.min', mins);
}

function renderBalanceFold(){
  var card = $('balCard'), btn = $('balFold');
  if(!card || !btn) return;
  card.classList.toggle('folded', !balOpen);
  setChevronLabel(btn, balOpen ? 'up' : 'down', '');
  btn.setAttribute('aria-expanded', String(balOpen));
  btn.title = t(balOpen ? 'card.balance.fold' : 'card.balance.open');
}

/* The people list folds like the balance — but never while the sheet is still
   asking this device who it is: the answer is given in that very list. */
function renderPeopleFold(){
  var card = $('peopleCard'), btn = $('peopleFold');
  if(!card || !btn) return;
  var open = peopleOpen || needsMeGate();
  card.classList.toggle('folded', !open);
  setChevronLabel(btn, open ? 'up' : 'down', '');
  btn.setAttribute('aria-expanded', String(open));
  btn.title = t(open ? 'card.people.fold' : 'card.people.open');
  btn.hidden = needsMeGate();
}

function renderFinal(){
  var bar = $('finalBar'), note = $('finalNote');
  var show = !!syncCfg;
  bar.hidden = !show;
  var lock = inputsLocked(), all = allFinal();
  if(show){
    var tal = finalTally();
    var btn = $('finalBtn');
    setTextArrows(btn, t(lock ? 'final.btn.undo' : 'final.btn'));
    btn.setAttribute('aria-label', t(lock ? 'final.btn.undo' : 'final.btn').replace('\u2192','-'));
    btn.className = 'btn finalbtn' + (lock ? ' open' : ' seal');
    var st = $('finalStat');
    st.textContent = all ? t('final.status.all') : t('final.status', tal.ok, tal.total);
    if(!all && tal.auto) st.textContent += ' ' + t('final.status.auto', tal.auto);
    st.className = 'finalstat' + (all ? ' all' : '');
  }
  var mini = $('finalMini');
  if(mini){
    mini.hidden = !show;
    if(show){
      var m = finalTally();
      mini.textContent = all ? t('final.mini.all') : t('final.mini', m.ok, m.total);
      mini.className = 'finalmini' + (all ? ' all' : '') + (finalNotice ? ' warn' : '');
    }
  }
  var msg = '', warn = true;
  if(finalNotice === 'revoked') msg = revokedText();
  else if(finalNotice === 'unfinal') msg = whoText(lastUnfinal, 'final.unfinal', 'final.unfinal.n');
  else if(finalNotice === 'someone') msg = finalSomeoneText() || t('final.someone', t('final.someone.who'));
  else if(show && all){ msg = t('final.done'); warn = false; }
  else if(show && iAmFinal()){ msg = t('final.locked.mine'); warn = false; }
  else if(show) { msg = t('final.hint'); warn = false; }
  /* while a round is running, say plainly how long silence still counts as
     checking — the deadline is useless if only the other side knows it */
  if(show && !all){
    var left = autoFinalLeft();
    if(left) msg = (msg ? msg + ' ' : '') + t('final.auto.in', fmtLeft(left));
  }
  note.hidden = !msg;
  note.textContent = msg;

/* The deadline moves without anybody touching anything, so the screen has to
   catch up on its own. Once a minute is plenty for a two-day clock. */
setInterval(function(){

  var was = document.body.classList.contains('all-final');
  renderFinal();
  if(was !== allFinal()) applyGate();
}, 60000);

/* ---------------- who put this here ----------------
   A record remembers the device that created it. Anybody may still change
   anything — this is a shared sheet, not a permissions system — but a change to
   somebody else's entry asks first, once per entry. Records from before this
   existed have no owner and are free for all. */
var unlocked = {};
function ownedByOther(rec){
  return !!(rec && rec.o && rec.o !== deviceId && !unlocked[rec.id]);
}
function mayEdit(rec, whatKey){
  if(!ownedByOther(rec)) return true;
  if(confirm(t('own.confirm', t(whatKey)))){
    unlocked[rec.id] = true;
    return true;
  }
  return false;
}

   but guarded nothing: a field can be filled without ever holding focus, and by
   then the model has already moved. */

function money(cents){ return formatCents(cents) + ' ' + state.currency; }
function sheetTitle(){ return (state.title || '').trim() || 'Billing sheet'; }
function el(tag, cls, txt){

function $(id){ return document.getElementById(id); }

/* The arrow characters a font offers have a hairline head that all but
   disappears at 13px on a phone, and which head you get depends on the font the
   device happens to use. Drawn here, it is the same solid arrow everywhere. */
function arrowSVG(){
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class','arw');
  svg.setAttribute('viewBox','0 0 26 14');
  svg.setAttribute('aria-hidden','true');
  svg.setAttribute('focusable','false');
  var shaft = document.createElementNS(ns, 'path');
  shaft.setAttribute('d','M2 7h13');
  shaft.setAttribute('stroke','currentColor');
  shaft.setAttribute('stroke-width','2.6');
  shaft.setAttribute('stroke-linecap','round');
  shaft.setAttribute('fill','none');
  var head = document.createElementNS(ns, 'path');
  head.setAttribute('d','M14 1.2 24.5 7 14 12.8z');
  head.setAttribute('fill','currentColor');
  svg.appendChild(shaft); svg.appendChild(head);
  return svg;
}
/* The same drawn arrow, turned a quarter turn: down for "open", up for
   "close". The character triangles are hairlines at this size. */
function chevronSVG(dir){
  var s = arrowSVG();
  s.setAttribute('class', 'arw chev ' + dir);
  return s;
}
/* The switch between the list and the cards. Both drawn rather than set as
   characters: at 22px a font's arrow is a hairline, and which arrow you get
   depends on the device. */
function svgNode(vb, cls){
  var s = document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox', vb); s.setAttribute('class', cls);
  s.setAttribute('aria-hidden','true'); s.setAttribute('focusable','false');
  return s;
}
function svgPath(parent, d, w, fill){
  var p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d', d);
  if(fill){ p.setAttribute('fill','currentColor'); }
  else {
    p.setAttribute('fill','none');
    p.setAttribute('stroke','currentColor');
    p.setAttribute('stroke-width', w || '2.1');
    p.setAttribute('stroke-linecap','round');
    p.setAttribute('stroke-linejoin','round');
  }
  parent.appendChild(p);
  return p;
}
/* The same chevron runs that sit at the foot of a card, shrunk into a button:
   two pointing each way, the outer one fainter, so the switch and the thing it
   switches to are drawn in the same hand. */
function swipeIconSVG(){
  var s = svgNode('0 0 34 20','swico wide');
  var d = ['M13 4 8 10l5 6', 'M8 4 3 10l5 6', 'M21 4l5 6-5 6', 'M26 4l5 6-5 6'];
  for(var i=0;i<d.length;i++){
    var p = svgPath(s, d[i], '2.6');
    if(i === 1 || i === 3) p.style.opacity = '.45';
  }
  return s;
}
/* three lines: "back to the list" */
function listIconSVG(){
  var s = svgNode('0 0 24 24','swico');
  svgPath(s, 'M4 7h16'); svgPath(s, 'M4 12h16'); svgPath(s, 'M4 17h16');
  return s;
}
/* A real arrow, in a real button: the one thing on the strip that is meant to
   be tapped rather than dragged. */
function cardNavBtn(dir){
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'cardnav ' + dir;
  var s = svgNode('0 0 24 24','navarw');
  svgPath(s, dir === 'left' ? 'M20 12H5' : 'M4 12h15', '2.4');
  svgPath(s, dir === 'left' ? 'M11 5 4 12l7 7' : 'M13 5l7 7-7 7', '2.4');
  b.appendChild(s);
  b.title = t(dir === 'left' ? 'card.prev' : 'card.next');
  b.setAttribute('aria-label', b.title);
  b.addEventListener('click', function(){ goCard(dir === 'left' ? -1 : 1); });
  return b;
}
/* The strip at the foot of a card: three slots, so the hand stays in the middle
   whether or not there is a card on both sides — an arrow to tap, the hand and
   its chevrons to drag, an arrow to tap. The chevrons belong to the hand, not
   to the buttons: they show which way a FINGER travels. Wiping left brings in
   the card on the right, so a run to the LEFT means "there is another one
   after this". Counted in slides, not in expenses: a removed expense is still
   a card in the rail, and a card with no way past it is a dead end. */
function swipeStrip(at, total){
  var hint = el('div','swipehint');
  var navL = el('span','navslot');
  if(at > 0) navL.appendChild(cardNavBtn('left'));
  hint.appendChild(navL);

  var set = el('span','swipeset');
  set.setAttribute('aria-hidden','true');
  if(at < total - 1) set.appendChild(chevRun('left', 3));
  set.appendChild(handSVG());
  if(at > 0) set.appendChild(chevRun('right', 3));
  hint.appendChild(set);

  var navR = el('span','navslot right');
  if(at < total - 1) navR.appendChild(cardNavBtn('right'));
  hint.appendChild(navR);
  return hint;
}
/* a hand, tilted, of the kind that is about to drag something */
function handSVG(){
  var s = svgNode('0 0 24 24','swhand');
  svgPath(s, 'M11 13V6.6a1.5 1.5 0 0 1 3 0V13', '1.9');
  svgPath(s, 'M14 9.8a1.4 1.4 0 0 1 2.8 0V13', '1.9');
  svgPath(s, 'M16.8 11.2a1.4 1.4 0 0 1 2.8 0v4.2c0 2.6-2 4.6-4.6 4.6h-1.6c-2 0-3-1-4-2.2l-2.3-3a1.4 1.4 0 0 1 2.1-1.8L11 16.4', '1.9');
  return s;
}
/* the run of chevrons that fans out from the hand. Not a control: it says
   which way the card travels, and a drag across it is what turns it. */
function chevRun(dir, n){
  var box = document.createElement('span');
  box.className = 'chevrun ' + dir;
  for(var i=0;i<n;i++){
    var s = svgNode('0 0 12 20','chev');
    svgPath(s, dir === 'left' ? 'M8.5 3 3 10l5.5 7' : 'M3.5 3 9 10l-5.5 7', '2.4');
    s.style.opacity = String(0.25 + 0.3 * i);
    box.appendChild(s);
  }
  return box;
}

/* a label made of that arrow and a word */
function setChevronLabel(node, dir, text){
  node.textContent = '';
  node.appendChild(chevronSVG(dir));
  if(text) node.appendChild(document.createTextNode(text));
}

/* Put a translated string into a node, drawing every arrow in it. */
function setTextArrows(node, str){
  node.textContent = '';
  String(str).split('\u2192').forEach(function(part, i){
    if(i) node.appendChild(arrowSVG());
    if(part) node.appendChild(document.createTextNode(part));
  });
}
var toastTimer;
function toast(msg, brief){
  var box = $('toast');
  $('toastTxt').textContent = msg;
  $('toastOk').hidden = !!brief;
  box.classList.toggle('brief', !!brief);
  box.classList.add('show');
